<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root { --copper: #B45A2A; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #FFFFFF; color: #0B1D2D; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: #B45A2A; color: #fff; }

  .font-display { font-family: 'Satoshi', system-ui, sans-serif; }

  /* Scroll reveal — opacity is rule-driven (never gated by an animation, so it
     can't get stuck hidden); the animation only nudges transform. */
  .reveal { opacity: 0; }
  .reveal.in { opacity: 1; animation: revealUp .8s cubic-bezier(.16,1,.3,1) both; }
  .reveal-d1.in { animation-delay: .07s; }
  .reveal-d2.in { animation-delay: .14s; }
  .reveal-d3.in { animation-delay: .21s; }
  .reveal-d4.in { animation-delay: .28s; }
  @keyframes revealUp { from { transform: translateY(20px); } to { transform: translateY(0); } }
  /* enfoque connecting line grow */
  .reveal-line { width: 0; }
  .reveal-line.in { width: 78%; transition: width 1.4s cubic-bezier(.16,1,.3,1) .2s; }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.in { opacity: 1 !important; animation: none !important; }
    .reveal-line.in { width: 78%; transition: none !important; }
    html { scroll-behavior: auto; }
  }

  /* invert the navy logo to crisp white on dark surfaces */
  .logo-light { filter: brightness(0) invert(1); }

  /* thin animated underline for nav links */
  .navlink { position: relative; }
  .navlink::after { content:''; position:absolute; left:0; bottom:-4px; height:1px; width:0; background:#B45A2A; transition: width .35s cubic-bezier(.16,1,.3,1); }
  .navlink:hover::after { width:100%; }

  /* hairline grid overlay */
  .grid-faint { background-image: linear-gradient(to right, rgba(47,68,86,.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(47,68,86,.06) 1px, transparent 1px); background-size: 64px 64px; }

  .btn-press { transition: transform .25s cubic-bezier(.16,1,.3,1), background-color .25s, box-shadow .25s, color .25s; }
  .btn-press:active { transform: translateY(1px) scale(.99); }

  .card-lift { transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s cubic-bezier(.16,1,.3,1), border-color .4s; }

  /* slow drift for mist layers */
  @keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(-40px)} }
  .mist-drift { animation: drift 26s ease-in-out infinite alternate; }

  /* marquee for module ticker */
  @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

  [data-anchor] { scroll-margin-top: 92px; }

  /* tweak-driven overrides (scoped to app wrapper) */
  .motion-reduced .reveal { opacity: 1 !important; animation: none !important; }
  .motion-reduced .reveal-line { width: 78% !important; animation: none !important; }
  .accent-intense .cta-primary { background-color: #B45A2A !important; }
  .accent-intense .cta-primary:hover { background-color: #9d4a20 !important; }
</style>
