<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Campañas Meta — Alma CMC</title>
<link rel="preload" href="/static/fonts/montserrat-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Montserrat';src:url('/static/fonts/montserrat-var-latin.woff2') format('woff2-variations');
  font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --navy:#0F3F68;--blue:#1172AB;--aqua:#4FBECE;--aqua-s:#E8F8FB;--aqua-d:#0E7C8C;
  --bg:#EEF3F8;--card:#fff;--line:#DCE6EE;--line-2:#EDF2F6;
  --ink:#12283A;--ink-2:#3C5468;--mute:#5A6F81;
  --green:#16A34A;--green-s:#E7F7EE;--green-d:#137A3B;
  --orange:#EA7317;--orange-s:#FDF0E5;--orange-d:#A4500C;
  --red:#DC2626;--red-s:#FDECEC;--red-d:#A61F1F;
  --sh-xs:0 1px 2px rgba(15,63,104,.06);--sh-sm:0 1px 3px rgba(15,63,104,.08),0 1px 2px rgba(15,63,104,.04);
  --sh-md:0 8px 24px rgba(15,63,104,.12);--sh-lg:0 20px 48px rgba(15,63,104,.20);
  --r:14px;--r-lg:18px;--ease:cubic-bezier(.2,.7,.2,1);--back:cubic-bezier(.34,1.36,.64,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
  color:var(--ink);font-size:14px;line-height:1.45;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.num,.money{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Hero ─────────────────────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);
  color:#fff;padding:20px 20px 18px;padding-top:max(20px,env(safe-area-inset-top))}
.hero::after{content:"";position:absolute;right:-110px;top:-140px;width:380px;height:380px;
  background:radial-gradient(circle,rgba(79,190,206,.40),transparent 70%);pointer-events:none}
.hero .in{position:relative;z-index:1;max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bdg{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;flex:none}
.bdg svg{width:22px;height:22px;stroke:#fff}
.hero h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px}
.hero p{margin:3px 0 0;font-size:12.5px;color:#CFE3EF;max-width:62ch}
.hero .sp{flex:1;min-width:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 0 4px rgba(124,255,178,.25);
  animation:pu 2.4s ease-in-out infinite}
.pill.old .dot{background:#FFC37A;box-shadow:0 0 0 4px rgba(255,195,122,.25)}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;min-width:44px;padding:0 15px;
  border-radius:11px;border:1px solid var(--aqua);background:var(--aqua);color:#06303A;font-weight:700;font-size:13px;
  cursor:pointer;box-shadow:0 4px 14px rgba(79,190,206,.35);transition:transform .15s var(--ease),background .15s}
.hb:hover{background:#68CBD8}.hb:active{transform:translateY(1px)}
.hb svg{width:17px;height:17px;stroke:currentColor}
.hb.spin svg{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}

/* ── Tabs + filtros (sticky) ──────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:30;background:rgba(238,243,248,.92);backdrop-filter:saturate(1.4) blur(10px);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1440px;margin:0 auto;padding:10px 20px 10px}
.tabs{display:flex;gap:4px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:13px;width:max-content;
  max-width:100%;box-shadow:var(--sh-xs);margin-bottom:10px}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px;border:0;border-radius:10px;
  background:transparent;color:var(--ink-2);font-weight:700;font-size:13px;cursor:pointer;transition:color .15s,background .2s var(--ease)}
.tab svg{width:16px;height:16px;stroke:currentColor}
.tab:hover{color:var(--navy);background:var(--line-2)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:var(--sh-sm)}
.tab .sh{display:none}
.tab .cnt{font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--line-2);color:var(--mute)}
.tab[aria-selected="true"] .cnt{background:rgba(255,255,255,.18);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{min-height:36px;padding:0 11px;border:0;border-radius:8px;background:transparent;font-size:12.5px;font-weight:700;
  color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{background:var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--aqua-s);color:var(--navy);box-shadow:inset 0 0 0 1px #A9DFE7}
.fld{position:relative;display:inline-flex;align-items:center}
.fld select,.fld input{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:0 34px 0 12px;
  font-size:16px;font-weight:600;color:var(--navy);max-width:230px;appearance:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s}
@media(min-width:761px){.fld select,.fld input{font-size:13px}}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--aqua);box-shadow:0 0 0 3px rgba(79,190,206,.22)}
.fld svg{position:absolute;right:11px;width:15px;height:15px;stroke:var(--mute);pointer-events:none}
.fld.search input{padding:0 12px 0 34px;width:220px}
.fld.search svg{left:11px;right:auto}
.fld input[type=date]{padding:0 10px;max-width:160px}
.custom{display:none;gap:6px;align-items:center}.custom.on{display:inline-flex}
.custom span{font-size:12px;color:var(--mute);font-weight:600}
.only-k{display:none}body.v-kanban .only-k{display:inline-flex}
.clear{border:0;background:none;color:var(--blue);font-weight:700;font-size:12.5px;cursor:pointer;min-height:40px;padding:0 6px;display:none}
.clear.on{display:inline-block}

/* ── Contenido ────────────────────────────────────────────────────────── */
.wrap{max-width:1440px;margin:0 auto;padding:18px 20px calc(48px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block;animation:vin .26s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.card-h .ic{width:32px;height:32px;border-radius:10px;background:var(--aqua-s);display:flex;align-items:center;justify-content:center;flex:none}
.card-h .ic svg{width:16px;height:16px;stroke:var(--blue)}
.card-h .sub{font-size:12px;color:var(--mute);font-weight:500}
.card-h .sp{flex:1}
.cp{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--line-2);color:var(--mute)}
.block{margin-bottom:24px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

/* Nota de medición */
.medicion{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r);background:#fff;
  border:1px solid var(--line);margin-bottom:16px;font-size:12.5px;color:var(--ink-2)}
.medicion svg{width:18px;height:18px;stroke:var(--blue);flex:none;margin-top:1px}
.medicion details summary{cursor:pointer;font-weight:700;color:var(--navy);list-style:none;min-height:24px}
.medicion details summary::-webkit-details-marker{display:none}
.medicion details summary::after{content:" — ver detalle";font-weight:600;color:var(--blue)}
.medicion details[open] summary::after{content:" — ocultar"}
.medicion ul{margin:8px 0 0;padding-left:18px}.medicion li{margin:3px 0}
.tag-est{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;
  border-radius:6px;background:var(--line-2);color:var(--mute);vertical-align:2px}
.warnline{margin-top:6px;color:var(--orange-d);font-weight:600}

/* Embudo KPI */
/* Banda de plata: Venta → Para el centro − Gasto = Resultado (lo primero que mira el dueño) */
.mband{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:12px}
.mb{position:relative;padding:16px 20px 15px;opacity:0;animation:rise .32s var(--back) forwards;animation-delay:calc(var(--i,0)*50ms)}
.mb+.mb{border-left:1px solid var(--line-2)}
.mb .v{font-size:25px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.mb .s{font-size:12px;color:var(--mute);margin-top:4px;font-weight:500}
.mb .op{position:absolute;left:-12px;top:50%;transform:translateY(-50%);z-index:2;width:24px;height:24px;border-radius:50%;background:#fff;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--mute);box-shadow:var(--sh-xs)}
.mb.venta .v{color:var(--blue)}
.mb.res{background:linear-gradient(135deg,#F3F8FC,#fff)}
.mb.res .v{font-size:32px}
.mb.res.pos{background:linear-gradient(135deg,var(--green-s),#fff)}.mb.res.pos .v{color:var(--green-d)}
.mb.res.neg{background:linear-gradient(135deg,var(--red-s),#fff)}.mb.res.neg .v{color:var(--red-d)}
.mb .chipr{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:#fff;
  border:1px solid var(--line);color:var(--ink-2);vertical-align:3px;letter-spacing:0}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:12px}
.fs{position:relative;padding:16px 18px 15px;opacity:0;animation:rise .32s var(--back) forwards;animation-delay:calc(var(--i,0)*50ms)}
.fs+.fs{border-left:1px solid var(--line-2)}
.fs .v{font-size:25px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.fs .s{font-size:12px;color:var(--mute);margin-top:4px;font-weight:500}
.fs .rate{position:absolute;left:-13px;top:50%;transform:translateY(-50%);z-index:2;background:#fff;border:1px solid var(--line);
  border-radius:999px;font-size:10.5px;font-weight:800;color:var(--blue);padding:2px 6px;font-variant-numeric:tabular-nums;box-shadow:var(--sh-xs)}
.fs.hi .v{color:var(--green-d)}
.fs+.fs{padding-left:32px}
.fs .c{display:inline-flex;align-items:baseline;gap:5px;margin-top:8px;font-size:12px;color:var(--ink-2);font-weight:600;
  background:var(--line-2);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.fs .c b{font-size:13px;color:var(--navy);font-weight:800}
.fs.key .c{background:var(--aqua-s)}.fs.key .c b{color:var(--blue)}
.funnel{margin-bottom:24px}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.pctc{display:block;font-size:11px;color:var(--mute);font-weight:600}.resp{color:#13795b;font-weight:700}.resn{color:#c0362c;font-weight:700}.cac.pos .v{color:#13795b}.cac.neg .v{color:#c0362c}
.cacs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.cac{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 18px;box-shadow:var(--sh-sm);
  opacity:0;animation:rise .32s var(--back) forwards;animation-delay:calc(var(--i,0)*50ms + 200ms);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.cac:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.cac .v{font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--navy);line-height:1.05;margin-top:6px}
.cac.key{background:linear-gradient(135deg,#F3FBFD,#fff);border-color:#BFE6EC}
.cac.key .v{color:var(--blue)}
.cac .s{font-size:12px;color:var(--mute);margin-top:5px}

/* Alertas */
.alerts{margin-bottom:24px}
.al-list{padding:0 8px 8px}
.al{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;opacity:0;animation:rise .28s var(--ease) forwards;
  animation-delay:calc(var(--i,0)*45ms)}
.al+.al{border-top:1px solid var(--line-2)}
.al .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.al .ico svg{width:17px;height:17px}
.al.bad .ico{background:var(--red-s)}.al.bad .ico svg{stroke:var(--red)}
.al.warn .ico{background:var(--orange-s)}.al.warn .ico svg{stroke:var(--orange)}
.al .t{font-weight:700;color:var(--ink);font-size:13.5px}
.al .d{font-size:12px;color:var(--mute)}
.al .x{margin-left:auto;text-align:right;font-weight:800;font-size:15px;color:var(--ink);white-space:nowrap}
.al .x small{display:block;font-size:11px;color:var(--mute);font-weight:600}

/* Tabla */
.tbl-wrap{overflow-x:auto}
.venta-cell.has-pop{cursor:help}
.venta-cell.has-pop b{text-decoration:underline dotted var(--mute);text-underline-offset:3px}
#vpop{position:fixed;z-index:60;min-width:300px;max-width:min(420px,calc(100vw - 16px));background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 12px 32px rgba(15,40,70,.18);padding:12px 14px;opacity:0;pointer-events:none;transform:translateY(-4px);
  transition:opacity .12s,transform .12s}
#vpop.on{opacity:1;transform:none}
#vpop .pop-h{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
#vpop .pop-t{width:100%;border-collapse:collapse;font-size:13px}
#vpop .pop-t th{position:static;font-size:10.5px;padding:4px 6px;background:none;border-top:0}
#vpop .pop-t td{padding:5px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
#vpop .pop-t td small{display:block;font-size:11px;color:var(--mute)}
#vpop .pop-t tfoot td{font-weight:800;border-bottom:0}
td small.otras{display:block;font-size:10.5px;color:#B07215;font-weight:600;max-width:150px;margin-left:auto;white-space:normal}
#vpop{max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain}
#vpop.sheet{left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom));max-width:none;min-width:0;
  max-height:72dvh;border-radius:18px;padding:14px 16px 16px;box-shadow:0 -8px 40px rgba(15,40,70,.28);transform:translateY(16px)}
#vpop.sheet.on{transform:none}
#vpop .pop-x{display:none}
#vpop.sheet .pop-x{display:flex;position:sticky;top:-14px;margin:-14px -16px 6px;padding:8px 8px 0;justify-content:flex-end;background:#fff;z-index:1}
#vpop .pop-x button{width:44px;height:36px;border:0;border-radius:10px;background:var(--line-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
#vpop .pop-x svg{width:16px;height:16px;stroke:var(--ink-2)}
#vpop .pop-s{font-size:12px;color:var(--ink-2);margin:-2px 0 6px}
#vpop tr.fuera td:first-child{border-left:3px solid #E8A33D;padding-left:8px}
#vpop .pop-n{font-size:11px;color:var(--mute);margin-top:6px}
/* Encabezado fijo al bajar. Un contenedor con overflow anula el sticky contra
   la página: en pantallas anchas (la tabla cabe) se suelta el overflow y el
   encabezado se pega bajo la barra de filtros; en medianas la tabla se
   desplaza dentro de su propio recuadro con el encabezado fijo arriba. */
@media(min-width:761px){
  .tbl-wrap{max-height:calc(100dvh - var(--bar-h,64px) - 40px);overflow:auto}
  thead th{position:sticky;top:0;z-index:2}
}
@media(min-width:1280px){
  .tbl-wrap:not(.full){max-height:none;overflow:visible}
  .tbl-wrap:not(.full) thead th{top:var(--bar-h,64px)}
}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);
  padding:10px 12px;background:#F7FAFC;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line);white-space:nowrap}
thead th.r,td.r{text-align:right}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr{transition:background .12s}
tbody tr:hover{background:#FAFCFE}
tbody tr:last-child td{border-bottom:0}
tbody tr.flag-bad td:first-child{box-shadow:inset 3px 0 0 var(--red)}
th.mny,td.mny{background:#F6FAFD}
@media(min-width:761px){tbody td.r{white-space:nowrap}tbody td.r small.otras{white-space:normal}}
tbody tr:hover td.mny{background:#F0F6FB}
th.mny{color:var(--navy)}
td.res b{font-size:14px;font-weight:800}
td.nmc{min-width:230px}
.tbl-mode .tbl-wrap.full .nm{max-width:300px}
.card-h .segs{display:flex;gap:8px;flex-wrap:wrap}
.seg .sh2{display:none}
.seg.hidden-web{display:none}
.nm{font-weight:700;color:var(--navy);max-width:340px}
.nm small{display:block;font-weight:500;color:var(--mute);font-size:11.5px;margin-top:1px}
.cacv{font-weight:800;color:var(--navy)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;
  white-space:nowrap;letter-spacing:.01em;margin:2px 4px 0 0}
.badge.mut{background:var(--line-2);color:var(--mute)}
.badge.warn{background:var(--orange-s);color:var(--orange-d)}
td.ret span{display:block;white-space:nowrap;font-variant-numeric:tabular-nums}
td.ret span small{display:inline;margin-left:4px;font-size:10.5px;color:var(--mute);font-weight:600}
td.ret .rc{font-weight:800}
.badge.on{background:#E3F6EE;color:#13795b}
.seg .scnt{font-size:10.5px;font-weight:800;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--line-2);color:var(--mute)}
.badge.bad{background:var(--red-s);color:var(--red-d)}
.badge.ok{background:var(--green-s);color:var(--green-d)}
.badge.info{background:var(--aqua-s);color:var(--aqua-d)}
.dash{color:#9AACBA}
.tbl-foot{padding:10px 18px 14px;font-size:12px;color:var(--mute)}

/* Desgloses */
.grid-d{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;margin-bottom:24px;align-items:start}
.dn{padding:2px 18px 16px}
.brow{display:grid;grid-template-columns:minmax(96px,1.2fr) minmax(40px,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:12.5px}
.brow .k{color:var(--ink-2);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.brow .track{display:block;height:10px;background:var(--line-2);border-radius:999px;overflow:hidden}
.brow .fill{display:block;height:100%;width:var(--w);background:#B7C8D6;border-radius:999px;transform-origin:left;
  animation:grow .45s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.brow.best .fill{background:var(--aqua)}
.brow .val{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.brow .val small{display:block;color:var(--mute);font-weight:600;font-size:11px}
.grid-d>.card{min-width:0}

/* Cómo nos conocieron */

/* ── Kanban ───────────────────────────────────────────────────────────── */

.kc{background:#fff;border-radius:12px;padding:11px 12px 10px;box-shadow:var(--sh-xs);border:1px solid #E3EAF0;
  opacity:0;animation:rise .28s var(--back) forwards;animation-delay:calc(min(var(--i,0),12)*40ms);
  transition:box-shadow .18s var(--ease),transform .18s var(--ease)}

.kc-top{display:flex;align-items:flex-start;gap:8px}

.kc-days{font-size:11px;font-weight:800;color:var(--ink-2);background:var(--line-2);border-radius:999px;padding:2px 8px;white-space:nowrap;

.kc-tel{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:1px}
.kc-ad{display:flex;gap:6px;align-items:flex-start;margin-top:8px;font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.35}

.kc-ad span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kc-camp{font-size:11.5px;color:var(--mute);margin:1px 0 0 19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}

  background:var(--line-2);color:var(--ink-2)}

/* ── Estados ──────────────────────────────────────────────────────────── */
.sk{background:linear-gradient(90deg,#E4EBF1 0%,#F1F5F8 50%,#E4EBF1 100%);background-size:200% 100%;
  animation:sh 1.3s ease-in-out infinite;border-radius:10px}

.empty{text-align:center;padding:44px 20px;max-width:520px;margin:0 auto}

.btn:hover{box-shadow:var(--sh-md)}.btn:active{transform:translateY(1px)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;

  transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:60;pointer-events:none;max-width:calc(100vw - 32px)}

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = n => (n === null || n === undefined) ? "—" : Number(n).toLocaleString("es-CL");
const fmt$ = n => (n === null || n === undefined) ? "—" : (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("es-CL");
const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : null;
const fdate = iso => { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${y}`; };
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const I = {
  meg: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  table: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>',
  pie: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>',
  trend: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>',
  fb: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  xc: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  pulse: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
};

/* ── Estado ─────────────────────────────────────────────────────────────── */
const S = { llamar: false, llamarData: null, sug: null, valor: null, valorPor: "canal", res: "", canal: "meta", v: "panel", rango: "30", desde: "", hasta: "", campana: "", plat: "", anuncio: "", esp: "", q: "", gest: "",
            tabla: "anuncios", estado: (() => { try { return localStorage.getItem("cm_estado") || "todos"; } catch (_) { return "todos"; } })(), cols: (() => { try { return localStorage.getItem("cm_cols") || "resumen"; } catch (_) { return "resumen"; } })(), kcol: "escribio", panel: null, kanban: null, ver: {} };

function hoyCL() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Santiago", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  return p;
}
function rangoFechas() {
  if (S.rango === "custom" && S.desde && S.hasta) return [S.desde, S.hasta];
  const h = hoyCL(); const d = new Date(h + "T12:00:00");
  d.setDate(d.getDate() - (Number(S.rango === "custom" ? 30 : S.rango) - 1));
  return [d.toISOString().slice(0, 10), h];
}
function qs(extra) {
  const [d, h] = rangoFechas();
  const p = new URLSearchParams({ desde: d, hasta: h });
  if (S.campana) p.set("campana", S.campana);
  if (S.plat && S.canal !== "web") p.set("plataforma", S.plat);
  if (S.canal !== "meta") p.set("canal", S.canal);
  if (extra) { if (S.anuncio) p.set("anuncio", S.anuncio); if (S.esp) p.set("especialidad", S.esp); if (S.q) p.set("q", S.q); if (S.gest) p.set("gestion", S.gest); if (S.res) p.set("resultado", S.res); }
  return p.toString();
}
async function api(path) {
  const r = await fetch(path, { headers: { Authorization: "Bearer " + TOKEN }, credentials: "same-origin" });
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error("perm"), { perm: true });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
let toastT;
function toast(msg, tipo) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (tipo === "error" ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast" + (tipo === "error" ? " err" : ""), 3200);
}

/* ── Carga ──────────────────────────────────────────────────────────────── */
let seq = 0;
async function cargar(silencioso) {
  const my = ++seq;
  $("#btnRefresh").classList.add("spin");
  if (!S.panel || !silencioso) skelPanel();
  if (!S.kanban || !silencioso) skelKanban();
  try {
    const [p, k] = await Promise.all([api("/alma/api/campanas-meta/panel?" + qs(false)),
                                      api("/alma/api/campanas-meta/kanban?" + qs(true))]);
    if (my !== seq) return;
    S.panel = p; S.kanban = k;
    opciones(p.opciones);
    opcionesGestion(k.opciones.gestion || []);
    pill(p);
    renderPanel(); renderKanban();
    if (silencioso) toast("Datos actualizados");
    cargarSugerencias(); if (S.llamar) cargarLlamar(); if (S.v === "valor" || S.valor) cargarValor();
  } catch (e) {
    if (my !== seq) return;
    const html = e.perm
      ? estado("err", I.alert, "Sin permiso para ver Campañas Meta", "Este módulo muestra gasto publicitario y solo se abre con el acceso del dueño.", "")
      : estado("err", I.alert, "No se pudieron cargar los datos", "Revise la conexión e intente de nuevo. Si el problema sigue, el servidor puede estar reiniciándose.", '<button class="btn" type="button" onclick="cargar()">Reintentar</button>');
    $("#v-panel").innerHTML = html; $("#v-kanban").innerHTML = html;
    $("#fotoTxt").textContent = "Sin datos";
    if (!e.perm) toast("No se pudieron cargar los datos", "error");
  } finally {
    if (my === seq) $("#btnRefresh").classList.remove("spin");
  }
}
async function cargarSugerencias() {
  if (S.canal === "web") return;
  try { S.sug = await api("/alma/api/campanas-meta/sugerencias-presupuesto"); }
  catch (e) { S.sug = { error: true, campanas: [] }; }
  const el = document.getElementById("sugBox"); if (el) el.outerHTML = sugerencias();
}
function estado(cls, icon, t, p, act) {
  return `<div class="card"><div class="empty ${cls}"><div class="ei">${icon}</div><h3>${esc(t)}</h3><p>${esc(p)}</p>${act || ""}</div></div>`;
}
function pill(p) {
  const el = $("#fotoPill");
  if (!p.ultima_foto) { $("#fotoTxt").textContent = "Sin fotos de Meta aún"; el.classList.add("old"); return; }
  const dias = Math.round((new Date(hoyCL()) - new Date(p.ultima_foto)) / 864e5);
  $("#fotoTxt").textContent = "Meta al " + fdate(p.ultima_foto);
  el.classList.toggle("old", dias > 2);
  el.title = dias > 2 ? "La última foto diaria de Meta tiene " + dias + " días" : "Foto diaria de Meta Ads al día";
}
function opciones(o) {
  const fill = (sel, items, first, val) => {
    const cur = val;
    sel.innerHTML = `<option value="">${first}</option>` + items.map(x => `<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join("");
    sel.value = items.some(x => x.id === cur) ? cur : "";
  };
  fill($("#fCampana"), o.campanas, S.canal === "web" ? "Todas las páginas" : S.canal === "todos" ? "Campañas y páginas" : "Todas las campañas", S.campana);
  fill($("#fAnuncio"), o.anuncios.filter(a => !S.campana || a.campaign_id === S.campana), S.canal === "web" ? "Todos los botones" : S.canal === "todos" ? "Anuncios y botones" : "Todos los anuncios", S.anuncio);
  fill($("#fEsp"), o.especialidades.map(e => ({ id: e, nombre: e })), "Todas las especialidades", S.esp);
}

function opcionesGestion(g) {
  const sel = $("#fGest"); if (sel.options.length > 1) return;
  sel.innerHTML = `<option value="">Toda la gestión</option><option value="por_llamar">Por llamar: hoy o vencido</option>`
    + g.map(x => `<option value="${esc(x.id)}">${esc(x.label)}</option>`).join("");
  sel.value = S.gest;
}

/* ── Skeletons ──────────────────────────────────────────────────────────── */
function skelPanel() {
  $("#v-panel").innerHTML = `
    <div class="sk" style="height:46px;margin-bottom:16px"></div>
    <div class="mband">${[0,1,2,3].map(() => `<div class="mb" style="opacity:1;animation:none"><div class="sk" style="height:11px;width:50%"></div><div class="sk" style="height:28px;width:75%;margin-top:10px"></div><div class="sk" style="height:10px;width:60%;margin-top:8px"></div></div>`).join("")}</div>
    <div class="funnel">${[0,1,2,3].map(() => `<div class="fs" style="opacity:1;animation:none"><div class="sk" style="height:11px;width:60%"></div><div class="sk" style="height:24px;width:45%;margin-top:10px"></div><div class="sk" style="height:18px;width:55%;margin-top:10px"></div></div>`).join("")}</div>
    <div class="sk" style="height:320px;border-radius:18px"></div>`;
}
function skelKanban() {
  $("#v-kanban").innerHTML = `<div class="sk" style="height:20px;width:280px;margin-bottom:16px"></div>
    <div class="board">${[0,1,2,3,4,5].map(i => `<div class="col"><div class="sk" style="height:16px;width:70%;margin:6px 6px 14px"></div>${[0,1,2].slice(0, 3 - (i % 3)).map(() => `<div class="sk" style="height:118px;border-radius:12px;margin-bottom:8px;background-color:#fff"></div>`).join("")}</div>`).join("")}</div>`;
}

/* ── Panel ──────────────────────────────────────────────────────────────── */
function renderPanel() {
  const p = S.panel, k = p.kpis, m = p.medicion;
  const web = S.canal === "web", todos = S.canal === "todos";
  if (web && !k.personas) {
    $("#v-panel").innerHTML = notaMedicion(p) + estado("", I.globe, "Nadie llegó desde la página web en este rango",
      "Cuando alguien toque un botón de WhatsApp en centromedicocarampangue.cl, aparecerá aquí con la página y el botón que usó.", S.rango !== "90" ? '<button class="btn" type="button" onclick="setRango(\'90\')">Ver últimos 90 días</button>' : "");
    return;
  }
  if (!web && !p.hay_insights && !k.personas && !k.citas) {
    $("#v-panel").innerHTML = notaMedicion(p) + estado("", I.wallet, "Aún no hay fotos de Meta Ads",
      "La foto diaria de Meta (gasto, conversaciones y desgloses) se guarda cada día. Cuando exista la primera, este panel mostrará el costo por conversación, por cita y por atención de cada anuncio.", "");
    return;
  }
  const sinGasto = S.plat === "sin_dato";
  const res = k.resultado;
  const money = [
    { cls: "venta", l: "Venta", v: fmt$(k.venta), s: k.pagaron ? fmtN(k.pagaron) + (k.pagaron === 1 ? " paciente pagó" : " pacientes pagaron") + (k.pagaron_tel ? " (" + fmtN(k.pagaron_tel) + " fuera del bot)" : "") : (web ? "Nadie de la web ha pagado aún" : "Nadie del anuncio ha pagado aún") },
    { l: "Para el centro", v: fmt$(k.centro), s: k.centro_pct == null ? "Venta menos honorarios" : k.centro_pct + "% de la venta, tras honorarios", op: "→" },
    web ? { l: "Gasto publicitario", v: "—", s: "La web no tiene gasto publicitario registrado", op: "−" }
      : { l: "Gasto en Meta", v: sinGasto ? "—" : fmt$(k.gasto), s: sinGasto ? "Meta no informa gasto sin plataforma" : (todos ? "Solo anuncios; la web no tiene gasto registrado" : fmtN(k.impresiones) + " impresiones"), op: "−" },
    { cls: "res " + (sinGasto ? "" : res >= 0 ? "pos" : "neg"), l: "Resultado", v: sinGasto ? "—" : fmt$(res),
      s: web ? "Igual a lo que queda para el centro: sin gasto registrado" : "Para el centro menos el gasto", op: "=", chip: !sinGasto && k.retorno != null ? "retorno venta " + String(k.retorno).replace(".", ",") + "× · centro " + String(k.retorno_centro).replace(".", ",") + "×" : "" },
  ];
  const band = `<div class="mband" role="group" aria-label="Plata del rango">${money.map((m, i) => `<div class="mb ${m.cls || ""}" style="--i:${i}">
      ${m.op ? `<span class="op" aria-hidden="true">${m.op}</span>` : ""}<div class="lbl">${m.l}</div>

function rapidez(p) {
  const r = p.rapidez; if (!r) return "";
  const head = `<div class="card-h"><div class="ic">${I.clock}</div><h2>Rapidez de recepción</h2><span class="cp">${fmtN(r.necesitaron)}</span><div class="sp"></div>

  const con = r.curva.filter(x => x.pct != null && x.personas >= 3);
  const best = con.length > 1 ? con.reduce((a, b) => a.pct >= b.pct ? a : b).tramo : null;
  const bars = r.curva.map((x, i) => `<div class="b${x.tramo === best ? " best" : ""}${x.pct == null ? " nil" : ""}"><span class="pc">${x.pct == null ? "—" : x.pct + "%"}</span>
      <span class="bar" style="--h:${x.pct == null ? 3 : Math.max(3, x.pct)}%;--i:${i}" title="${esc(x.label)}: ${x.agendaron} de ${x.personas} agendaron"></span></div>`).join("");

      const cv = Object.fromEntries(c.resp_curva.map(x => [x.tramo, x]));
      const lento = ["1_4h", "gt4h", "sin_respuesta"].reduce((a, t) => [a[0] + cv[t].personas, a[1] + cv[t].agendaron], [0, 0]);
      return `<tr><td data-l="${S.canal === "web" ? "Página" : "Campaña"}"><div class="nm">${esc(c.campana)}</div></td><td class="r" data-l="Pasaron a recepción">${fmtN(c.resp_necesitaron)}</td>
        <td class="r" data-l="Mediana">${c.resp_mediana_min == null ? dash : fmtMin(c.resp_mediana_min)}</td><td class="r" data-l="Sin respuesta">${c.resp_sin ? `<span class="resn">${fmtN(c.resp_sin)}</span>` : "0"}</td>
        <td class="r" data-l="Agendó si <15 min">${cv.lt15.pct == null ? dash : cv.lt15.pct + "%"}<small class="pctc">${cv.lt15.personas} pers.</small></td>
        <td class="r" data-l="Agendó si >1 h o nada">${lento[0] ? Math.round(100 * lento[1] / lento[0]) + "%" : dash}<small class="pctc">${lento[0]} pers.</small></td></tr>`; }).join("")}</tbody></table></div>` : "";
  return `<div class="card block">${head}<div class="rap">
    <div class="rap-k"><div><span class="lbl">Mediana de respuesta</span><div class="v">${r.mediana_min == null ? "—" : fmtMin(r.mediana_min)}</div><small>Hasta la primera respuesta humana</small></div>
      <div><span class="lbl">Pasaron a recepción</span><div class="v">${fmtN(r.necesitaron)}</div><small>${fmtN(r.solo_bot)} las atendió solo el bot${r.proactivas ? " · " + fmtN(r.proactivas) + " las escribió recepción primero" : ""}</small></div>
      <div><span class="lbl">Sin respuesta humana</span><div class="v${r.sin_respuesta ? " resn" : ""}">${fmtN(r.sin_respuesta)}</div><small>${r.necesitaron ? Math.round(100 * r.sin_respuesta / r.necesitaron) + "% de quienes pasaron" : ""}</small></div></div>
    <div class="lbl" style="margin-bottom:8px">% que agendó según cuánto tardó recepción</div>
    <div class="rcurve" role="img" aria-label="Porcentaje que agendó según el tiempo de respuesta de recepción">${bars}</div><div class="rcurve-x">${xs}</div>
    ${tab}
    <p class="dleg" style="margin:12px 0 0">Se mide desde que el bot la pasó a recepción hasta el primer mensaje de recepción desde el panel. Cuando recepción escribió primero por su cuenta (sin que el bot la derivara) no hubo espera y no entra en la curva. Solo cuentan minutos en horario de atención: lunes a viernes 08:00–21:00 y sábado 09:00–14:00. "Agendó" = cita del bot o pago en caja hasta 90 días después de llegar.</p></div></div>`;
}
function fmtMin(m) { m = Math.round(m); if (m < 1) return "<1 min"; return m < 60 ? m + " min" : (Math.floor(m / 60) + " h" + (m % 60 ? " " + (m % 60) + " min" : "")); }

    <li><b>Medido por el bot:</b> personas captadas (teléfonos que llegaron por un anuncio) y citas atribuidas al último clic en un anuncio, desde el ${fdate(m.atribucion_desde)}. Un reagendamiento no se cuenta dos veces.</li>

    <li><b>Ortodoncia</b>: "instalaron" = cobro de instalación de la Dra. Castillo (desde $80.000) o paso a "Instalado" en el embudo de ortodoncia, después del primer contacto. Quien ya pagaba ortodoncia antes no cuenta.</li>

    <li><b>Venta</b>: cobrado en caja (Medilink) a cada paciente que trajo el anuncio, hasta hoy. Incluye a quienes escribieron desde el anuncio y después agendaron por recepción o llegaron directo: se reconocen porque su teléfono está en la ficha de un paciente que pagó dentro de 90 días del clic. Un teléfono compartido (familia) suma a todos sus pacientes. Cada paciente cuenta una vez, en el anuncio de su primera cita. Si ya era paciente del centro, sus pagos posteriores también cuentan.</li>
    <li><b>Para el centro</b>: cada pago menos el honorario del profesional que atendió (su % cargado en Equipo; 70% si falta; Dr. Abarca con sueldo fijo se calcula al 62%). <b>Resultado</b> = para el centro menos el gasto del anuncio.</li>
    <li><b>Página web</b>: personas que escribieron con un botón de WhatsApp de centromedicocarampangue.cl. La página, el artículo y el botón salen del evento que registra el bot en cada llegada (desde el 05/10/2026); antes de esa fecha, del texto pre-escrito del botón y del tag de la primera visita, y el artículo exacto del blog no viene (solo "blog"). Citas = las del bot hasta 90 días después de llegar. La web no tiene gasto publicitario registrado: Resultado = para el centro. En "Todos", cada persona cuenta una sola vez, en el canal de su primer contacto del rango; en cada canal por separado aparece en ambos.</li>

function tabla(p) {

function tendencia(p) {

    lbl += `<text x="${cx}" y="${H - pb + 18}" text-anchor="middle" font-size="${narrow ? 10.5 : 12}" font-weight="700" fill="#3C5468">${MES[+x.mes.slice(5) - 1]}${last && parcial ? "*" : ""}</text>`;

  });

  const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#0E7C8C" stroke-width="2"/>${i === pts.length - 1 ? `<text x="${p[0] + 6}" y="${p[1] - 10}" text-anchor="end" font-size="12" font-weight="800" fill="#0E7C8C">${fmt$(p[2])}</text>` : ""}`).join("");
  const ult = t[t.length - 1];
  return `<div class="card block"><div class="card-h"><div class="ic">${I.trend}</div><h2>Tendencia mensual</h2><span class="sub">${S.canal === "todos" ? "solo anuncios de Meta · " : ""}últimos 12 meses hasta el fin del rango</span></div>
    <div class="trend"><div class="leg"><span><i style="background:#C3D2DE"></i>Gasto del mes</span><span><i style="background:#4FBECE;height:3px;vertical-align:3px"></i>Costo por conversación</span>${bw < 44 ? "" : "<span>f = frecuencia mínima estimada</span>"}${parcial ? "<span>* mes en curso, parcial</span>" : ""}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto mensual y costo por conversación. Último mes: ${fmt$(ult.gasto)} de gasto.">
      <line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="#DCE6EE"/>${bars}${line}${dots}${lbl}</svg></div></div>`;
}

    <span class="chip" title="${esc(d ? d.campana : t.campana)}"><span>${esc(d ? d.campana : t.campana)}</span></span>
    ${w ? [w.articulo ? `<span class="chip" title="Artículo del blog"><span>Artículo «${esc(w.articulo)}»</span></span>` : "",
           w.posicion ? `<span class="chip"><span>${esc(w.posicion)}</span></span>` : "",
           w.comuna ? `<span class="chip">${I.pin}<span>${esc(w.comuna)}</span></span>` : "",
           `<span class="chip web">${I.globe}Página web</span>`].join("")
      : plat === "instagram" ? `<span class="chip">${I.ig}Instagram</span>` : plat === "facebook" ? `<span class="chip">${I.fb}Facebook</span>` : `<span class="chip nd">Plataforma sin dato</span>`}`;
}
async function cargarFicha() {
  const clave = MX.clave;
  try {
    const d = await api("/alma/api/campanas-meta/persona/" + encodeURIComponent(clave));
    if (MX.clave !== clave) return;
    MX.d = d;
    if (d.nombre) { $("#mxNombre").textContent = d.nombre; $("#mxNombre").classList.remove("anon"); $("#mxAv").textContent = iniciales(d.nombre); }
    $("#mxTel").textContent = d.telefono;
    const call = $("#mxCall");
    if (d.tel_href) { call.href = "tel:" + d.tel_href; call.removeAttribute("aria-disabled"); call.setAttribute("aria-label", "Llamar al " + d.telefono); }
    pintarMeta(); pintarSeg(); pintarAct();
  } catch (e) {
    if (MX.clave !== clave) return;
    const msg = e.perm ? "Sin permiso para abrir esta ficha." : "No se pudo cargar la ficha. Revise la conexión e intente de nuevo.";
    $("#mxSeg").innerHTML = `<div class="empty err" style="padding:28px 16px"><div class="ei">${I.alert}</div><h3 style="font-size:15px">No se pudo cargar</h3><p>${esc(msg)}</p><button class="btn" type="button" onclick="cargarFicha()">Reintentar</button></div>`;
    $("#mxAct").innerHTML = "";
  }
}
function fechaMas(dias) {
  const d = new Date(hoyCL() + "T12:00:00"); d.setDate(d.getDate() + dias); return d.toISOString().slice(0, 10);
}
function pintarSeg() {
  const sg = MX.d.seguimiento, opts = MX.d.gestion_opciones;
  MX.sel = sg.estado;
  const alerta = sg.alerta === "vencido" ? `<div class="g-alert vencido">${I.phone}Llamada vencida: había que llamar el ${fdate(sg.proximo)}.</div>`
    : sg.alerta === "hoy" ? `<div class="g-alert hoy">${I.phone}Hoy toca volver a llamar.</div>` : "";
  $("#mxTabAlert").hidden = !sg.alerta;
  const hist = sg.historial.length ? `<ul class="hist">${sg.historial.map(h => `<li><span class="hd">${fdate(h.ts)}<br>${esc(h.ts.slice(11, 16))}</span>
      <span class="hbd"><b>${esc(h.label)}</b>${h.proximo ? ` · próximo contacto ${esc(h.proximo_fmt)}` : ""}${h.origen && h.origen !== "dueño" ? `<small>${esc(h.origen[0].toUpperCase() + h.origen.slice(1))}</small>` : ""}${h.nota ? `<p>${esc(h.nota)}</p>` : ""}</span></li>`).join("")}</ul>`
    : `<p class="dleg" style="margin:0">Aún no hay gestión registrada. Cada vez que guarde, queda una línea aquí con la fecha; el historial no se borra.</p>`;
  $("#mxSeg").innerHTML = `<h3>${I.phone}Seguimiento${sg.actualizado ? `<small>Actualizado ${fdate(sg.actualizado)} ${esc(sg.actualizado.slice(11, 16))}</small>` : ""}</h3>
    <div class="mx-in">${alerta}
      <div class="lbl" id="gEstL" style="margin-bottom:8px">Estado de gestión</div>
      <div class="g-est" role="radiogroup" aria-labelledby="gEstL">${opts.map(o => `<button type="button" role="radio" data-e="${esc(o.id)}" aria-checked="${o.id === sg.estado}" tabindex="${o.id === sg.estado ? 0 : -1}"><i></i>${esc(o.label)}</button>`).join("")}</div>
      <div class="g-f"><label class="lbl" for="gProx">Próximo contacto<span class="req" id="gReq" ${sg.estado === "volver_llamar" ? "" : "hidden"}>obligatorio para volver a llamar</span></label>
        <div class="g-row"><input type="date" id="gProx" value="${esc(sg.proximo || "")}">
          <button type="button" class="g-q" data-d="1">Mañana</button><button type="button" class="g-q" data-d="3">En 3 días</button><button type="button" class="g-q" data-d="7">En 1 semana</button></div></div>
      <div class="g-f"><label class="lbl" for="gNota">Nota</label>
        <textarea id="gNota" maxlength="2000" placeholder="Qué conversaron, a qué hora prefiere que lo llamen, qué le interesa…">${esc(sg.nota)}</textarea></div>
    </div>
    <div class="g-save"><span class="hint">Las columnas del tablero se calculan solas; esto es su gestión.</span>
      <button type="button" class="mbtn pri" id="gSave">Guardar gestión</button></div>
    <div class="mx-in" style="padding-top:4px"><div class="lbl" style="margin-bottom:6px">Historial de gestión</div>${hist}</div>`;
  const radios = [...document.querySelectorAll(".g-est button")];
  const elegir = b => {
    MX.sel = b.dataset.e;
    radios.forEach(x => { x.setAttribute("aria-checked", x === b); x.tabIndex = x === b ? 0 : -1; });
    $("#gReq").hidden = MX.sel !== "volver_llamar";
    if (MX.sel === "volver_llamar" && !$("#gProx").value) $("#gProx").value = fechaMas(1);
  };
  radios.forEach((b, i) => {
    b.onclick = () => elegir(b);
    b.onkeydown = e => {
      const dir = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!dir) return;
      e.preventDefault(); const n = radios[(i + dir + radios.length) % radios.length]; elegir(n); n.focus();
    };
  });
  document.querySelectorAll(".g-q").forEach(b => b.onclick = () => { $("#gProx").value = fechaMas(+b.dataset.d); });
  $("#gSave").onclick = guardarGestion;
}
async function guardarGestion() {
  const b = $("#gSave"); if (b.disabled) return;
  const body = { estado: MX.sel, nota: $("#gNota").value, proximo: $("#gProx").value || null };
  if (body.estado === "volver_llamar" && !body.proximo) { toast("Indique la fecha en que hay que volver a llamar", "error"); $("#gProx").focus(); return; }
  b.disabled = true; b.textContent = "Guardando…";
  const clave = MX.clave;
  try {
    const sg = await apiSend("/alma/api/campanas-meta/persona/" + encodeURIComponent(clave) + "/seguimiento", body);
    if (MX.clave !== clave) return;
    MX.d.seguimiento = sg; pintarSeg(); actualizarTarjeta(clave, sg);
    toast("Gestión guardada");
  } catch (e) { toast(e.message, "error"); b.disabled = false; b.textContent = "Guardar gestión"; }
}
function actualizarTarjeta(clave, sg) {
  const [t, c] = buscarTarjeta(clave); if (!t) return;
  const lbl = (MX.d && MX.d.gestion_opciones.find(o => o.id === sg.estado) || {}).label || sg.estado;
  const vacio = sg.estado === "sin_gestion" && !sg.proximo && !(sg.nota || "").trim();
  t.gestion = vacio ? null : { estado: sg.estado, label: lbl, proximo: sg.proximo, proximo_fmt: sg.proximo ? fdate(sg.proximo) : "",
                               alerta: sg.alerta, con_nota: !!(sg.nota || "").trim() };
  S.kanban.por_llamar = S.kanban.columnas.reduce((a, cc) => a + cc.tarjetas.filter(x => x.gestion && x.gestion.alerta).length, 0);
  const el = document.querySelector(`.kc[data-k="${CSS.escape(clave)}"]`);
  if (el) { const tmp = document.createElement("div"); tmp.innerHTML = cardHtml(t, 0, c.id); const n = tmp.firstElementChild; n.classList.add("noanim"); el.replaceWith(n); MX.from = n; }
  const tc = $("#btnToCall");
  if (tc) { tc.lastChild.textContent = fmtN(S.kanban.por_llamar) + " por llamar hoy o vencidos"; tc.hidden = !S.kanban.por_llamar && S.gest !== "por_llamar"; }
}
function pintarAct() {
  const d = MX.d, p = d.pagos;
  const sum = `<div class="act-sum">
      <div><span class="lbl">Pagado en caja</span><div class="v">${p.total ? fmt$(p.total) : "—"}</div><small>${p.total ? "Desde el primer contacto" : "Sin pagos desde el primer contacto"}${p.pacientes > 1 ? " · " + p.pacientes + " pacientes con este teléfono" : ""}</small></div>
      <div><span class="lbl">Llegadas</span><div class="v">${[d.clics ? fmtN(d.clics) + (d.clics === 1 ? " clic" : " clics") : "", d.visitas_web ? fmtN(d.visitas_web) + " web" : ""].filter(Boolean).join(" · ") || "—"}</div><small>Primer contacto el ${esc(d.primer_clic)}</small></div>
    </div>${p.antes_del_clic ? `<p class="dleg" style="margin:-4px 0 10px">Ya era paciente: ${p.antes_del_clic} ${p.antes_del_clic === 1 ? "pago" : "pagos"} antes del primer contacto (${fmt$(p.antes_total)}), no incluidos aquí.</p>` : ""}`;
  const items = d.linea.map((x, i) => `<li class="t-${x.tipo}" style="--i:${i}"><span class="ti">${TL_IC[x.tipo] || I.info}</span>
      <span class="tb"><b>${esc(x.titulo)}</b>${x.tipo === "cita" && x.desenlace ? `<span class="badge ${x.desenlace === "atendida" ? "ok" : x.desenlace === "no_show" || x.desenlace === "anulada" ? "bad" : "mut"}" title="${esc(x.desenlace_lbl)}">${esc(x.desenlace_lbl.split(" · ")[0])}</span>` : ""}${x.tipo === "cita" && !x.del_anuncio ? '<span class="badge mut">Sin anuncio</span>' : ""}
        ${x.detalle ? `<p>${esc(x.detalle)}</p>` : ""}<small>${esc(x.fecha)}${x.hora ? " · " + esc(x.hora) : ""}${x.paciente ? " · " + esc(x.paciente) : ""}${x.plataforma === "instagram" ? " · Instagram" : x.plataforma === "facebook" ? " · Facebook" : ""}</small></span>
      <span class="tm">${x.monto ? fmt$(x.monto) : ""}</span></li>`).join("");
  $("#mxAct").innerHTML = `<h3>${I.pulse}Línea de tiempo<small>Más reciente primero</small></h3><div class="mx-in">${sum}<ul class="tl">${items}</ul>
    <p class="dleg" style="margin:10px 0 0">Clics en anuncios, llegadas desde la web, citas del bot, horarios ofrecidos, avisos de atención y pagos en caja (cruce por teléfono, igual que la venta del panel). Sin datos clínicos.</p></div>`;
}
function chFecha(ts) { return new Date(String(ts).replace(" ", "T") + "Z"); }
function chAuto(t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }
const EST_BOT = { HUMAN_TAKEOVER: "Con recepción", IDLE: "Bot en espera" };
async function cargarChat(forzar) {
  const clave = MX.clave; if (!clave) return;
  let d;
  try { d = await api("/alma/api/campanas-meta/persona/" + encodeURIComponent(clave) + "/conversacion"); }
  catch (e) { if (forzar && MX.clave === clave) $("#chBody").innerHTML = `<div class="empty" style="padding:24px 10px"><p style="margin:0">No se pudo leer la conversación.</p></div>`; return; }
  if (MX.clave !== clave) return;
  $("#chSt").textContent = EST_BOT[d.estado_bot] || (String(d.estado_bot || "").startsWith("WAIT") ? "Bot en un flujo" : "Bot");
  const av = $("#chAviso"), txt = $("#chTxt"), btn = $("#chSend");
  if (d.ventana_abierta) {
    av.className = "ch-aviso";
    av.textContent = "Se envía desde el WhatsApp del centro. Al responder, el bot deja de contestarle y la conversación queda con recepción.";
  } else {
    av.className = "ch-aviso cerrada";
    av.textContent = d.ultimo_del_paciente
      ? "Pasaron más de 24 h desde su último mensaje: WhatsApp no permite escribirle texto libre hasta que vuelva a escribir. Llámelo por teléfono."
      : "Esta persona no ha escrito por WhatsApp: no se le puede enviar texto libre. Llámela por teléfono.";
  }
  txt.disabled = btn.disabled = !d.ventana_abierta;
  if (!forzar && d.mensajes.length === MX.n) return;
  MX.n = d.mensajes.length;
  const body = $("#chBody");
  const alFondo = forzar || body.scrollHeight - body.scrollTop - body.clientHeight < 80;
  let dia = "", h = "";
  for (const m of d.mensajes) {
    const f = chFecha(m.ts), dd = f.toLocaleDateString("es-CL", { ...CH_TZ, weekday: "short", day: "numeric", month: "short" });
    if (dd !== dia) { dia = dd; h += `<div class="ch-dia">${esc(dd)}</div>`; }
    const hum = m.dir === "out" && /^\[Recepcionista\]/.test(m.texto);
    const texto = m.texto.replace(/^\[Recepcionista\]\s*/, "") || (m.media ? "[" + m.media + "]" : "");
    const who = m.dir === "in" ? "" : (hum ? "Recepción" : "Bot");
    h += `<div class="ch-m ${m.dir === "in" ? "in" : "out"}${hum ? " hum" : ""}">${who ? `<span class="who">${who}</span>` : ""}${esc(texto)}<span class="t">${f.toLocaleTimeString("es-CL", { ...CH_TZ, hour: "2-digit", minute: "2-digit" })}</span></div>`;
  }
  body.innerHTML = h || `<div class="empty" style="padding:24px 10px"><p style="margin:0">Sin mensajes registrados con esta persona.</p></div>`;
  if (alFondo) body.scrollTop = body.scrollHeight;
}
async function enviarChat() {
  const t = $("#chTxt"), b = $("#chSend"), msg = t.value.trim();
  if (!msg || !MX.clave || b.disabled) return;
  b.disabled = true; const clave = MX.clave;
  try {
    await apiSend("/alma/api/campanas-meta/persona/" + encodeURIComponent(clave) + "/conversacion", { mensaje: msg });
    t.value = ""; chAuto(t); toast("Mensaje enviado");
    await cargarChat(true);
    if (MX.clave === clave && MX.d && MX.d.seguimiento.estado === "sin_gestion") {
      const d = await api("/alma/api/campanas-meta/persona/" + encodeURIComponent(clave));
      if (MX.clave === clave) { MX.d = d; pintarSeg(); actualizarTarjeta(clave, d.seguimiento); }
    }
  } catch (e) { toast(e.message, "error"); }
  finally { if (MX.clave === clave) b.disabled = $("#chTxt").disabled; }
}
$("#mxX").onclick = cerrarFicha;
$("#mx").addEventListener("click", e => { if (e.target === e.currentTarget) cerrarFicha(); });
document.querySelectorAll(".mx-tabs button").forEach(b => b.onclick = () => setTab(b.dataset.t));
$("#chSend").onclick = enviarChat;
$("#chTxt").oninput = e => chAuto(e.target);
$("#chTxt").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); enviarChat(); } };
$("#v-kanban").addEventListener("click", e => { const k = e.target.closest(".kc"); if (k) abrirFicha(k.dataset.k, k); });
$("#v-kanban").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("kc")) { e.preventDefault(); abrirFicha(e.target.dataset.k, e.target); }
});
document.addEventListener("keydown", e => {
  if (!MX.clave) return;
  if (e.key === "Escape") { e.preventDefault(); cerrarFicha(); return; }
  if (e.key !== "Tab") return;
  const f = [...document.querySelectorAll(".mx a[href],.mx button:not([disabled]),.mx textarea:not([disabled]),.mx input,.mx [tabindex='0']")]
    .filter(x => x.offsetParent !== null && x.getAttribute("aria-disabled") !== "true");
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});

/* ── Interacción ────────────────────────────────────────────────────────── */
function setVista(v, push) {
  S.v = v;
  const vp = document.getElementById("vpop"); if (vp) vp.classList.remove("on");
  document.body.className = "v-" + v + (S.canal === "web" ? " c-web" : "");
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === v));
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
  if (push) history.replaceState(null, "", location.pathname + location.search + "#" + v);
  if (v === "valor" && !S.valor) cargarValor();
  marcarClear();
}
function setRango(r) {
  S.rango = r;
  document.querySelectorAll("#segRango button").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === r));
  $("#custom").classList.toggle("on", r === "custom");
  if (r === "custom") {
    const [d, h] = rangoFechas();
    if (!S.desde) { S.desde = d; $("#fDesde").value = d; }
    if (!S.hasta) { S.hasta = h; $("#fHasta").value = h; }
  }
  S.ver = {}; cargar();
}
function marcarClear() {
  const on = S.campana || S.plat || (S.v === "kanban" && (S.anuncio || S.esp || S.q || S.gest || S.res));
  $("#btnClear").classList.toggle("on", !!on);
}
function limpiar() {
  S.campana = S.plat = S.anuncio = S.esp = S.q = S.gest = S.res = "";
  $("#fCampana").value = $("#fPlat").value = $("#fAnuncio").value = $("#fEsp").value = $("#fQ").value = $("#fGest").value = "";
  marcarClear(); S.ver = {}; cargar();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setVista(t.dataset.v, true));
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const vs = ["panel", "kanban", "valor"], i = vs.indexOf(S.v);
  const v = vs[(i + (e.key === "ArrowRight" ? 1 : vs.length - 1)) % vs.length]; setVista(v, true); $("#tab-" + v).focus();
});
document.querySelectorAll("#segRango button").forEach(b => b.onclick = () => setRango(b.dataset.r));
$("#fDesde").onchange = e => { S.desde = e.target.value; if (S.desde && S.hasta) cargar(); };
$("#fHasta").onchange = e => { S.hasta = e.target.value; if (S.desde && S.hasta) cargar(); };
$("#fCampana").onchange = e => { S.campana = e.target.value; S.anuncio = ""; marcarClear(); S.ver = {}; cargar(); };
document.querySelectorAll("#segCanal button").forEach(b => b.onclick = () => {
  S.canal = b.dataset.c;
  document.querySelectorAll("#segCanal button").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.body.classList.toggle("c-web", S.canal === "web");
  $("#kTabLbl").textContent = S.canal === "web" ? "Pacientes de la web" : S.canal === "todos" ? "Pacientes de anuncios y web" : "Pacientes de anuncios";
  S.campana = S.anuncio = ""; $("#fCampana").value = $("#fAnuncio").value = "";
  S.valor = null; if (S.canal === "web") S.sug = null;
  marcarClear(); S.ver = {}; cargar();
});
$("#fPlat").onchange = e => { S.plat = e.target.value; marcarClear(); S.ver = {}; cargar(); };
$("#fAnuncio").onchange = e => { S.anuncio = e.target.value; marcarClear(); S.ver = {}; cargar(); };
$("#fEsp").onchange = e => { S.esp = e.target.value; marcarClear(); S.ver = {}; cargar(); };
$("#fGest").onchange = e => { S.gest = e.target.value; marcarClear(); S.ver = {}; cargar(); };
let qT; $("#fQ").oninput = e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); marcarClear(); S.ver = {}; cargar(); }, 320); };
$("#btnClear").onclick = limpiar;
$("#btnRefresh").onclick = () => cargar(true);

setVista(["#kanban", "#valor"].includes(location.hash) ? location.hash.slice(1) : "panel", false);
cargar();
</script>
