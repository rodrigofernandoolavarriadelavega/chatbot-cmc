<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Caja Diaria — Alma CMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --aqua:#4FBECE; --aqua-s:#e8f8fb; --blue:#1172AB; --navy:#0F3F68;
    --bg:#F7FBFD; --border:#d6e4ec; --text:#0F3F68; --mute:#62788a;
    --red:#e84545; --green:#1a7a42;
    --sh-sm:0 1px 3px rgba(15,63,104,.08); --sh-md:0 10px 34px rgba(15,63,104,.16);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:'Montserrat',-apple-system,sans-serif; background:var(--bg); color:var(--text);
    font-size:13px; display:flex; flex-direction:column; align-items:center; padding:22px 16px 60px; }
  .wrap { width:100%; max-width:520px; }
  .topline { display:flex; align-items:center; gap:9px; margin:2px 0 18px; }
  .topline .ico { width:34px; height:34px; border-radius:10px; background:var(--aqua-s);
    display:flex; align-items:center; justify-content:center; }
  .topline .ico svg { width:19px; height:19px; stroke:var(--aqua); }
  .topline h1 { font-size:16px; font-weight:800; margin:0; color:var(--navy); }
  .topline .sub { font-size:11px; color:var(--mute); font-weight:600; }

  /* Hero: lo que hay en la caja AHORA */
  .hero { background:linear-gradient(135deg, var(--navy), var(--blue)); color:#fff;
    border-radius:20px; padding:26px 24px; box-shadow:var(--sh-md); text-align:center; }
  .hero .lbl { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    opacity:.85; }
  .hero .big { font-size:46px; font-weight:800; margin:6px 0 2px; letter-spacing:-.01em;
    font-variant-numeric:tabular-nums; }
  .hero .hint { font-size:11.5px; opacity:.8; font-weight:500; }

  /* Mini datos */
  .mini { display:flex; gap:10px; margin-top:14px; }
  .mini .card { flex:1; background:#fff; border:1px solid var(--border); border-radius:13px;
    padding:13px 15px; box-shadow:var(--sh-sm); }
  .mini .card .l { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); }
  .mini .card .v { font-size:18px; font-weight:800; color:var(--navy); margin-top:3px; font-variant-numeric:tabular-nums; }
  .mini .card .v small { font-size:11px; font-weight:600; color:var(--mute); display:block; margin-top:1px; }

  /* Depósito */
  .dep { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px;
    margin-top:16px; box-shadow:var(--sh-sm); }
  .dep h3 { font-size:12.5px; font-weight:800; color:var(--navy); margin:0 0 11px; text-transform:uppercase; letter-spacing:.03em; }
  .dep .row { display:flex; gap:9px; align-items:center; }
  .dep input { flex:1; font-family:inherit; font-size:16px; font-weight:700; color:var(--navy);
    border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
  .dep input:focus { outline:none; border-color:var(--aqua); box-shadow:0 0 0 3px rgba(79,190,206,.18); }
  .dep button { border:0; background:var(--navy); color:#fff; font-family:inherit; font-size:14px; font-weight:700;
    border-radius:10px; padding:11px 18px; cursor:pointer; white-space:nowrap; }
  .dep button:hover { background:#0c3556; }
  .dep button:disabled { opacity:.5; cursor:default; }
  .dep .note { font-size:11px; color:var(--mute); margin-top:9px; font-weight:500; }

  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--navy); color:#fff; padding:11px 20px; border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:var(--sh-md); opacity:0; transition:all .3s; z-index:90; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .toast.success { background:var(--green); } .toast.error { background:var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2M12 12v4M10 14h4"/></svg></div>
    <div>
      <h1>Caja Diaria</h1>
      <div class="sub">Efectivo que hay en el cajón ahora</div>
    </div>
  </div>

  <div class="hero">
    <div class="lbl">En la caja hay ahora</div>
    <div class="big" id="enCaja">—</div>
    <div class="hint" id="enCajaHint">Efectivo recaudado que aún no se deposita</div>
  </div>

  <div class="mini">
    <div class="card"><div class="l">Efectivo de hoy</div><div class="v" id="efecHoy">—</div></div>
    <div class="card"><div class="l">Último depósito</div><div class="v" id="ultDep">—</div></div>
  </div>

  <div class="dep">
    <h3>Registré un depósito al banco</h3>
    <div class="row">
      <input type="number" id="depValor" min="0" step="1000" placeholder="$ depositado">
      <button id="btnDep">Registrar</button>
    </div>
    <div class="note">Al depositar, esa plata sale del cajón y baja el “en la caja ahora”.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const qp = TOKEN ? ("?token=" + encodeURIComponent(TOKEN)) : "";
function fmt$(n){ return '$' + (Number(n)||0).toLocaleString('es-CL'); }
function fechaCorta(iso){ if(!iso) return ''; const p=iso.split('-'); return p.length===3?`${p[2]}/${p[1]}`:iso; }
function showToast(m,t=''){ const e=document.getElementById('toast'); e.textContent=m; e.className='toast show '+(t||'');
  clearTimeout(e._t); e._t=setTimeout(()=>e.className='toast',2600); }

async function cargar(){
  try{
    const r = await fetch('/alma/api/caja-diaria/saldo'+qp);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    document.getElementById('enCaja').textContent = fmt$(d.en_caja);
    document.getElementById('efecHoy').innerHTML = fmt$(d.efectivo_hoy)
      + (d.hoy_en_libro ? '' : '<small>desde Pagos</small>');
    const ud = d.ultimo_deposito;
    document.getElementById('ultDep').innerHTML = ud
      ? fmt$(ud.valor) + `<small>${fechaCorta(ud.fecha)}</small>`
      : '—';
  }catch(e){ showToast('Error al cargar','error'); console.error(e); }
}

document.getElementById('btnDep').addEventListener('click', async ()=>{
  const inp = document.getElementById('depValor');
  const valor = parseInt(inp.value,10)||0;
  if(valor<=0){ showToast('Ingresa el monto depositado','error'); inp.focus(); return; }
  const btn = document.getElementById('btnDep'); btn.disabled=true;
  try{
    const r = await fetch('/alma/api/caja-diaria/deposito'+qp, {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({valor})});
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.detail||'HTTP '+r.status); }
    inp.value=''; showToast('Depósito registrado','success'); cargar();
  }catch(e){ showToast('Error: '+e.message,'error'); }
  finally{ btn.disabled=false; }
});

cargar();
</script>
</body>
</html>
