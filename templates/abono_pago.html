<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abono — Centro Médico Carampangue</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F3F68">
<link rel="icon" href="/static/isotipo.png">
<style>
  /* Paleta oficial CMC (Manual de Marca): aqua · azul · navy.
     color-scheme:light a propósito — es una pantalla de PAGO: se ve igual
     para todos, sin que el navegador del paciente invierta los colores. */
  :root{
    color-scheme: light;
    --aqua:#4FBECE;
    --azul:#1172AB;
    --navy:#0F3F68;
    --navy-900:#0A2E4D;
    --ink:#16232E;
    --muted:#5B6B76;
    --bg:#F2F7F9;
    --card:#FFFFFF;
    --border:#DEE9ED;
    --ok:#177A45;
    --ok-bg:#E7F6EC;
    --warn:#8A5300;
    --warn-bg:#FFF6E6;
    --shadow-sm:0 1px 2px rgba(15,63,104,.06), 0 2px 8px rgba(15,63,104,.05);
    --shadow-md:0 4px 16px rgba(15,63,104,.10), 0 1px 3px rgba(15,63,104,.06);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:0 16px calc(40px + env(safe-area-inset-bottom)); }

  /* ── Cabecera de marca ── */
  .topbar{
    background:linear-gradient(135deg, var(--navy) 0%, var(--azul) 100%);
    padding:calc(18px + env(safe-area-inset-top)) 16px 34px;
    margin-bottom:-20px;
  }
  .topbar-in{ max-width:480px; margin:0 auto; display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:44px; height:44px; border-radius:12px; background:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 2px 8px rgba(10,46,77,.22);
  }
  .brand-mark img{ width:32px; height:32px; display:block; }
  .brand-name{ font-size:15.5px; font-weight:700; color:#fff; letter-spacing:-.01em; }
  .brand-sub{ font-size:12.5px; color:rgba(255,255,255,.82); }

  /* ── Tarjetas ── */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:18px 16px; margin-bottom:12px; box-shadow:var(--shadow-sm);
  }
  .card.hero{ box-shadow:var(--shadow-md); }
  h1{ font-size:19px; line-height:1.3; margin:0 0 6px; color:var(--navy); letter-spacing:-.015em; }
  .lead{ font-size:14px; color:var(--muted); margin:0; }

  /* ── Estado ── */
  .estado-pill{
    display:inline-flex; align-items:center; gap:7px;
    font-size:12.5px; font-weight:650; padding:7px 13px; border-radius:999px;
    background:var(--warn-bg); color:var(--warn); border:1px solid #F2DFB4;
    margin-bottom:12px;
  }
  .estado-pill.confirmado{ background:var(--ok-bg); color:var(--ok); border-color:#BFE3CB; }
  .estado-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .estado-pill.pendiente .dot{ animation:latir 1.8s ease-in-out infinite; }
  @keyframes latir{ 0%,100%{opacity:1} 50%{opacity:.35} }
  @media (prefers-reduced-motion: reduce){ .estado-pill .dot{ animation:none; } }

  /* ── Resumen de la cita ── */
  .cita{
    background:#F7FBFC; border:1px solid var(--border); border-radius:12px;
    padding:13px 14px; margin-top:13px;
  }
  .cita-esp{ font-size:15px; font-weight:700; color:var(--navy); margin-bottom:7px; }
  .cita-line{ display:flex; gap:9px; align-items:center; font-size:13.5px; color:var(--ink); padding:2px 0; }
  .cita-line .ic{ width:16px; text-align:center; flex-shrink:0; opacity:.85; }

  /* ── Monto ── */
  .monto-box{
    text-align:center; padding:20px 12px; margin-top:14px;
    background:linear-gradient(135deg, var(--azul) 0%, var(--aqua) 140%);
    border-radius:14px; color:#fff;
  }
  .monto-label{ font-size:11.5px; opacity:.92; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
  .monto-valor{ font-size:36px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }
  .monto-nota{ font-size:12px; opacity:.9; margin-top:4px; }

  /* ── Cuenta regresiva ── */
  .reloj{
    display:flex; align-items:center; justify-content:center; gap:7px;
    margin-top:12px; padding:10px; border-radius:10px;
    background:var(--warn-bg); border:1px solid #F2DFB4;
    font-size:13.5px; color:var(--warn); font-weight:600;
  }
  .reloj.urgente{ background:#FDECEC; border-color:#F5C6C6; color:#A32020; }

  /* ── Campos copiables ── */
  .campo{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 0; border-bottom:1px solid var(--border);
  }
  .campo:last-child{ border-bottom:none; padding-bottom:0; }
  .campo:first-child{ padding-top:0; }
  .campo-txt{ min-width:0; }
  .campo-label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .campo-valor{ font-size:15.5px; font-weight:650; color:var(--ink); word-break:break-word; }
  .campo.destacado .campo-valor{ color:var(--azul); font-size:17px; font-weight:750; }

  button.copy-btn{
    flex-shrink:0; border:1.5px solid var(--azul); background:#fff; color:var(--azul);
    font-size:13px; font-weight:650; padding:9px 13px; border-radius:9px; cursor:pointer;
    min-height:42px; min-width:74px; font-family:inherit;
    transition:background .15s, color .15s, border-color .15s;
  }
  button.copy-btn:active{ background:var(--azul); color:#fff; }
  button.copy-btn.copied{ background:var(--ok); border-color:var(--ok); color:#fff; }
  button.copy-btn:focus-visible{ outline:3px solid var(--aqua); outline-offset:2px; }

  .card-title{ font-weight:700; margin-bottom:10px; font-size:14.5px; color:var(--navy); }
  .pasos{ margin:0; padding-left:19px; font-size:14px; line-height:1.65; }
  .pasos li{ margin-bottom:5px; }
  .pasos li:last-child{ margin-bottom:0; }

  .aviso{
    display:flex; gap:9px; align-items:flex-start; margin-top:13px;
    background:#EDF7F4; border:1px solid #C4E4D9; border-radius:11px;
    padding:12px 13px; font-size:13.5px; color:#0B4D3A;
  }
  .aviso b{ color:#083C2D; }

  .footer-note{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:20px; }
  .footer-note a{ color:var(--azul); }
  .footer-note b{ color:var(--navy); }

  .estado-box{ text-align:center; padding:26px 12px; }
  .estado-box .emo{ font-size:34px; line-height:1; margin-bottom:10px; }
  .estado-box h1{ font-size:18px; }
  .estado-box p{ font-size:14px; color:var(--muted); margin:6px 0 0; }
  .btn-wa{
    display:inline-block; margin-top:15px; padding:13px 22px; border-radius:11px;
    background:var(--azul); color:#fff; text-decoration:none; font-weight:650; font-size:14.5px;
  }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>

    <div>
      <div class="brand-name">Centro Médico Carampangue</div>
      <div class="brand-sub">Abono para confirmar tu hora</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="app" aria-live="polite">
    <div class="card"><p class="lead">Cargando…</p></div>
  </div>

  <p class="footer-note">
    ¿Dudas? Llama al <b>(44) 296 5226</b><br>
    <a href="https://agentecmc.cl/privacidad">Política de privacidad</a>
  </p>
</div>

<script>
(function(){
  var TOKEN = window.location.pathname.split("/").filter(Boolean).pop();
  var app = document.getElementById("app");
  var relojTimer = null;

  function money(n){ return "$" + Number(n).toLocaleString("es-CL"); }

  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function fallbackCopy(valor){
    var ta = document.createElement("textarea");
    ta.value = valor;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
  }

  function copiar(valor, btn){
    var marcar = function(){
      btn.textContent = "Copiado";
      btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = "Copiar"; btn.classList.remove("copied"); }, 1600);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(valor).then(marcar).catch(function(){ fallbackCopy(valor); marcar(); });
    } else { fallbackCopy(valor); marcar(); }
  }

  function campo(label, valor, destacado){
    var row = el("div", "campo" + (destacado ? " destacado" : ""));
    var txt = el("div", "campo-txt");
    txt.appendChild(el("div", "campo-label", label));
    txt.appendChild(el("div", "campo-valor", valor));
    var btn = el("button", "copy-btn", "Copiar");
    btn.type = "button";
    btn.setAttribute("aria-label", "Copiar " + label);
    btn.addEventListener("click", function(){ copiar(valor, btn); });
    row.appendChild(txt); row.appendChild(btn);
    return row;
  }

  function cajaEstado(emo, titulo, texto){
    var box = el("div", "card estado-box");
    box.appendChild(el("div", "emo", emo));
    box.appendChild(el("h1", null, titulo));
    box.appendChild(el("p", null, texto));
    var a = el("a", "btn-wa", "Escríbenos por WhatsApp");
    a.href = "https://wa.me/56966610737";
    box.appendChild(a);
    return box;
  }

  /* Cuenta regresiva real, desde expira_at. Antes el WhatsApp decía "90
     minutos" (la ventana real es ABONO_VENTANA_HORAS) y la página no mostraba
     nada: el paciente no tenía ningún dato fiable de cuánto le quedaba. */
  function montarReloj(expiraISO){
    if (!expiraISO) return null;
    var t = new Date(expiraISO);
    if (isNaN(t.getTime())) return null;
    var box = el("div", "reloj");
    function tick(){
      var ms = t.getTime() - Date.now();
      if (ms <= 0){ box.textContent = "⏳ El plazo terminó — refresca la página"; return; }
      var min = Math.floor(ms / 60000);
      var h = Math.floor(min / 60), m = min % 60;
      box.textContent = "⏳ Tu hora queda apartada " + (h > 0 ? h + " h " + m + " min" : m + " min") + " más";
      box.classList.toggle("urgente", min <= 30);
    }
    tick();
    if (relojTimer) clearInterval(relojTimer);
    relojTimer = setInterval(tick, 30000);
    return box;
  }

  function render(data){
    if (relojTimer){ clearInterval(relojTimer); relojTimer = null; }
    app.innerHTML = "";

    if (!data || data.error === "no_encontrado") {
      app.appendChild(cajaEstado("🔍", "Este link no es válido",
        "Puede que haya expirado o que el enlace esté incompleto. Pídenos uno nuevo."));
      return;
    }
    if (data.estado === "expirado" || data.error === "expirado") {
      app.appendChild(cajaEstado("⏳", "El tiempo para transferir venció",
        "Tu hora se liberó, pero podemos buscarte otra."));
      return;
    }

    var confirmado = data.estado === "confirmado";
    var esp = data.especialidad || "";
    var cita = data.cita || {};

    var pill = el("div", "estado-pill " + (confirmado ? "confirmado" : "pendiente"));
    pill.appendChild(el("span", "dot"));
    pill.appendChild(document.createTextNode(confirmado ? "Confirmado" : "Esperando tu transferencia"));
    app.appendChild(pill);

    var hero = el("div", "card hero");
    // La especialidad viene del backend. Estaba escrita a mano como
    // "Psiquiatría" y los abonos de Gastroenterología mostraban la equivocada.
    var saludo = data.paciente ? data.paciente + ", " : "";
    hero.appendChild(el("h1", null, confirmado
      ? "Tu hora ya está confirmada"
      : saludo + (esp ? "este es el abono de tu hora de " + esp : "este es el abono de tu hora")));
    hero.appendChild(el("p", "lead", confirmado
      ? "Recibimos tu transferencia. No necesitas hacer nada más — te esperamos."
      : "Transfiere el monto exacto y mándanos el comprobante por WhatsApp: con eso te confirmamos la hora."));

    if (cita.fecha_display || cita.hora || cita.profesional) {
      var c = el("div", "cita");
      if (esp) c.appendChild(el("div", "cita-esp", esp));
      if (cita.fecha_display){
        var l1 = el("div", "cita-line");
        l1.appendChild(el("span", "ic", "📅"));
        l1.appendChild(el("span", null, cita.fecha_display + (cita.hora ? " · " + cita.hora + " h" : "")));
        c.appendChild(l1);
      }
      if (cita.profesional){
        var l2 = el("div", "cita-line");
        l2.appendChild(el("span", "ic", "👤"));
        l2.appendChild(el("span", null, cita.profesional));
        c.appendChild(l2);
      }
      hero.appendChild(c);
    }

    var montoBox = el("div", "monto-box");
    montoBox.appendChild(el("div", "monto-label", "Monto a transferir"));
    montoBox.appendChild(el("div", "monto-valor", money(data.monto)));
    montoBox.appendChild(el("div", "monto-nota", "Cubre el total de la consulta — el día de la atención no pagas nada más"));
    hero.appendChild(montoBox);

    if (!confirmado){
      var reloj = montarReloj(data.expira_at);
      if (reloj) hero.appendChild(reloj);
    }
    app.appendChild(hero);

    if (confirmado) return;

    var cta = el("div", "card");
    cta.appendChild(el("div", "card-title", "Datos para transferir"));
    cta.appendChild(campo("Banco", data.cuenta.banco));
    cta.appendChild(campo("Tipo de cuenta", data.cuenta.tipo));
    cta.appendChild(campo("Número de cuenta", data.cuenta.numero));
    cta.appendChild(campo("Titular", data.cuenta.titular));
    cta.appendChild(campo("RUT", data.cuenta.rut));
    cta.appendChild(campo("Correo", data.cuenta.correo));
    cta.appendChild(campo("Monto exacto", money(data.monto), true));
    app.appendChild(cta);

    var pasos = el("div", "card");
    pasos.appendChild(el("div", "card-title", "Cómo hacerlo"));
    var ol = el("ol", "pasos");
    ["Abre la app de tu banco.",
     "Copia los datos de arriba y transfiere el monto exacto.",
     "Sácale una foto o captura al comprobante.",
     "Mándanoslo por WhatsApp y te confirmamos la hora."
    ].forEach(function(p){ ol.appendChild(el("li", null, p)); });
    pasos.appendChild(ol);
    var aviso = el("div", "aviso");
    aviso.appendChild(el("span", null, "📎"));
    var t = el("span");
    t.appendChild(el("b", null, "El comprobante es lo que confirma tu hora. "));
    t.appendChild(document.createTextNode("Mándalo por el mismo chat de WhatsApp donde te llegó este link."));
    aviso.appendChild(t);
    pasos.appendChild(aviso);
    // Botón directo al chat: el paciente llega acá desde WhatsApp y tiene que
    // volver justo ahí para mandar la foto — sin esto queda buscando la app.
    var waBtn = el("a", "btn-wa", "📎 Enviar comprobante por WhatsApp");
    waBtn.href = "https://wa.me/56966610737";
    waBtn.style.display = "block";
    waBtn.style.textAlign = "center";
    waBtn.style.marginTop = "14px";
    pasos.appendChild(waBtn);
    app.appendChild(pasos);
  }

  function cargar(){
    fetch("/api/abono/" + encodeURIComponent(TOKEN) + "/estado")
      .then(function(r){ return r.json(); })
      .then(function(data){
        render(data);
        if (data && data.estado !== "confirmado" && data.estado !== "expirado" && !data.error) {
          setTimeout(cargar, 8000);
        }
      })
      .catch(function(){
        app.innerHTML = "";
        app.appendChild(cajaEstado("📶", "No pudimos cargar tu abono",
          "Refresca la página o escríbenos y te ayudamos."));
      });
  }

  cargar();
})();
</script>
</body>
</html>
