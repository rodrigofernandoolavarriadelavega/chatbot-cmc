<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abono — Centro Médico Carampangue</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A2E4D">
<link rel="icon" href="/static/isotipo.png">
<link rel="preload" href="/static/fonts/montserrat-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* ─────────────────────────────────────────────────────────────────────
     Montserrat es la tipografía del Manual de Marca CMC. Se sirve desde
     /static (la CSP permite font-src 'self' pero NO data:, así que un
     data-URI se bloquearía). Variable font: un archivo de 35 KB cubre
     400–800, sin una sola request a un tercero.
     ───────────────────────────────────────────────────────────────────── */
  @font-face{
    font-family:'Montserrat';
    src:url('/static/fonts/montserrat-var-latin.woff2') format('woff2-variations');
    font-weight:400 800;
    font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,
                  U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,
                  U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }

  :root{
    /* Paleta oficial CMC */
    --aqua:#4FBECE;
    --azul:#1172AB;
    --navy:#0F3F68;
    --navy-deep:#092A47;
    --ink:#132330;
    --muted:#65788A;
    --hairline:#E3EDF1;
    --bg:#EEF4F7;
    --card:#FFFFFF;
    --ok:#0F7040;
    --ok-bg:#E8F5ED;
    --alerta:#8A5300;
    --alerta-bg:#FDF5E7;
    --rojo:#A32020;

    /* Escala modular 1.25 — evita los tamaños ad-hoc que delatan una UI
       armada a ojo. Todo el documento sale de acá. */
    --t-xs:11px; --t-sm:13px; --t-base:15px; --t-md:17px;
    --t-lg:21px; --t-xl:27px; --t-display:44px;

    --r-sm:10px; --r-md:14px; --r-lg:20px;
    --sombra-baja:0 1px 2px rgba(9,42,71,.05), 0 2px 6px rgba(9,42,71,.04);
    --sombra-media:0 2px 4px rgba(9,42,71,.05), 0 8px 24px rgba(9,42,71,.08);
    --sombra-alta:0 4px 8px rgba(9,42,71,.06), 0 16px 40px rgba(9,42,71,.12);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    /* Grano finísimo: le saca el plano digital al fondo y acerca la
       sensación a papel impreso. Va en el body para no repetirlo por capa. */
    background-image:
      radial-gradient(circle at 12% 0%, rgba(79,190,206,.10), transparent 42%),
      radial-gradient(circle at 92% 8%, rgba(17,114,171,.07), transparent 38%);
    background-attachment:fixed;
  }

  /* ── Cabecera ─────────────────────────────────────────────────────── */

    position:relative; overflow:hidden;
    background:
      radial-gradient(120% 140% at 88% -20%, #17568C 0%, transparent 58%),
      linear-gradient(158deg, var(--navy) 0%, var(--navy-deep) 100%);
    padding:calc(20px + env(safe-area-inset-top)) 18px 46px;
  }

  /* Filo aqua: el único trazo de color puro de la marca en toda la página. */
  .topbar::before{
    content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg, var(--aqua) 0%, var(--azul) 55%, transparent 100%);
  }
  .topbar-in{
    position:relative; z-index:1;
    max-width:470px; margin:0 auto; display:flex; align-items:center; gap:13px;
  }
  .brand-mark{
    width:46px; height:46px; border-radius:13px; background:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.24), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .brand-mark img{ width:33px; height:33px; display:block; }
  .brand-name{
    font-size:var(--t-base); font-weight:700; color:#fff;
    letter-spacing:-.012em; line-height:1.25;
  }
  .brand-sub{
    font-size:var(--t-xs); font-weight:500; letter-spacing:.10em;
    text-transform:uppercase; color:var(--aqua); margin-top:3px;
  }

  .wrap{ max-width:470px; margin:0 auto; padding:0 18px calc(44px + env(safe-area-inset-bottom)); }
  #app{ margin-top:-26px; position:relative; z-index:2; }

  /* Entrada escalonada: un solo momento coreografiado al cargar. */
  .card{
    background:var(--card); border-radius:var(--r-lg);
    padding:22px 20px; margin-bottom:14px;
    box-shadow:var(--sombra-media);
    animation:surgir .5s cubic-bezier(.22,.9,.3,1) both;
  }
  .card:nth-of-type(2){ animation-delay:.07s; }
  .card:nth-of-type(3){ animation-delay:.14s; }
  .card.hero{ box-shadow:var(--sombra-alta); }
  @keyframes surgir{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
  }

  h1{
    font-size:var(--t-lg); font-weight:750; margin:0 0 8px;
    color:var(--navy); letter-spacing:-.022em; line-height:1.28;
  }
  .lead{ font-size:var(--t-sm); color:var(--muted); margin:0; font-weight:450; }

  /* ── Estado ───────────────────────────────────────────────────────── */
  .estado-pill{
    display:inline-flex; align-items:center; gap:8px;
    font-size:var(--t-xs); font-weight:650; letter-spacing:.07em;
    text-transform:uppercase; padding:8px 14px; border-radius:999px;
    background:var(--alerta-bg); color:var(--alerta);
    box-shadow:inset 0 0 0 1px rgba(138,83,0,.16);
    margin-bottom:14px;
  }
  .estado-pill.confirmado{
    background:var(--ok-bg); color:var(--ok);
    box-shadow:inset 0 0 0 1px rgba(15,112,64,.18);
  }
  .estado-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .estado-pill.pendiente .dot{ animation:latir 2s ease-in-out infinite; }
  @keyframes latir{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.3; transform:scale(.82); } }
  @media (prefers-reduced-motion: reduce){ .estado-pill .dot{ animation:none; } }

  /* ── Resumen de la cita ───────────────────────────────────────────── */
  .cita{
    margin-top:18px; padding-top:16px;
    border-top:1px solid var(--hairline);
  }
  .cita-esp{
    font-size:var(--t-xs); font-weight:700; letter-spacing:.10em;
    text-transform:uppercase; color:var(--azul); margin-bottom:10px;
  }
  .cita-line{
    display:flex; gap:11px; align-items:baseline;
    font-size:var(--t-sm); padding:3px 0; font-weight:500;
  }
  .cita-line .et{
    color:var(--muted); font-size:var(--t-xs); min-width:62px;
    letter-spacing:.03em; flex-shrink:0;
  }
  .cita-line .va{ font-weight:600; color:var(--ink); }

  /* ── Monto: la pieza central ──────────────────────────────────────── */
  .monto-box{
    position:relative; overflow:hidden;
    text-align:center; padding:26px 16px 24px; margin-top:20px;
    border-radius:var(--r-md); color:#fff;
    background:
      radial-gradient(100% 120% at 12% 0%, rgba(79,190,206,.55) 0%, transparent 60%),
      linear-gradient(140deg, var(--azul) 0%, #0C5B8A 100%);
    box-shadow:0 6px 20px rgba(17,114,171,.28);
  }
  .monto-label{
    font-size:var(--t-xs); font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; opacity:.86;
  }
  .monto-valor{
    font-size:var(--t-display); font-weight:800; margin-top:4px;
    letter-spacing:-.032em; line-height:1.02;
    /* tabular-nums: las cifras no bailan de ancho — detalle de precisión
       que separa una pantalla de pago de una maqueta. */
    font-variant-numeric:tabular-nums;
  }
  .monto-nota{ font-size:var(--t-xs); opacity:.84; margin-top:8px; font-weight:450; line-height:1.5; }

  /* ── Cuenta regresiva ─────────────────────────────────────────────── */
  .reloj{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:14px; padding:12px; border-radius:var(--r-sm);
    background:var(--alerta-bg); color:var(--alerta);
    font-size:var(--t-sm); font-weight:600;
    box-shadow:inset 0 0 0 1px rgba(138,83,0,.14);
    font-variant-numeric:tabular-nums;
  }
  .reloj.urgente{
    background:#FDECEC; color:var(--rojo);
    box-shadow:inset 0 0 0 1px rgba(163,32,32,.16);
  }

  /* ── Campos copiables ─────────────────────────────────────────────── */
  .card-title{
    font-size:var(--t-xs); font-weight:700; letter-spacing:.10em;
    text-transform:uppercase; color:var(--muted); margin-bottom:14px;
  }
  .campo{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 0; border-bottom:1px solid var(--hairline);
  }
  .campo:last-of-type{ border-bottom:none; padding-bottom:2px; }
  .campo-txt{ min-width:0; }
  .campo-label{
    font-size:var(--t-xs); color:var(--muted); font-weight:500;
    letter-spacing:.04em; margin-bottom:1px;
  }
  .campo-valor{
    font-size:var(--t-md); font-weight:600; color:var(--ink);
    word-break:break-word; letter-spacing:-.008em;
    font-variant-numeric:tabular-nums;
  }
  .campo.destacado{
    margin-top:6px; padding:14px 15px; border-bottom:none;
    background:linear-gradient(180deg,#F6FBFC 0%,#EFF7FA 100%);
    border-radius:var(--r-sm);
    box-shadow:inset 0 0 0 1px rgba(79,190,206,.30);
  }
  .campo.destacado .campo-valor{ color:var(--azul); font-size:var(--t-lg); font-weight:750; }

  button.copy-btn{
    flex-shrink:0; font-family:inherit; cursor:pointer;
    border:none; background:#F1F7F9; color:var(--azul);
    box-shadow:inset 0 0 0 1.5px rgba(17,114,171,.28);
    font-size:var(--t-sm); font-weight:650; letter-spacing:.01em;
    padding:10px 15px; border-radius:var(--r-sm);
    min-height:44px; min-width:82px;
    transition:background .18s ease, color .18s ease, box-shadow .18s ease, transform .12s ease;
  }
  button.copy-btn:active{ transform:scale(.96); }
  button.copy-btn.copied{
    background:var(--ok); color:#fff; box-shadow:inset 0 0 0 1.5px var(--ok);
  }
  button.copy-btn:focus-visible{ outline:3px solid var(--aqua); outline-offset:2px; }

  /* ── Pasos ────────────────────────────────────────────────────────── */
  .pasos{ margin:0; padding:0; list-style:none; counter-reset:paso; }
  .pasos li{
    counter-increment:paso; position:relative;
    padding:0 0 16px 38px; font-size:var(--t-sm); font-weight:500; line-height:1.55;
  }
  .pasos li::before{
    content:counter(paso);
    position:absolute; left:0; top:-1px;
    width:25px; height:25px; border-radius:50%;
    background:var(--navy); color:#fff;
    font-size:var(--t-xs); font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  /* Línea que hilvana los pasos — guía la lectura hacia abajo. */
  .pasos li:not(:last-child)::after{
    content:""; position:absolute; left:12px; top:26px; bottom:4px;
    width:1.5px; background:linear-gradient(180deg, var(--hairline), transparent);
  }
  .pasos li:last-child{ padding-bottom:0; }

  .aviso{
    display:flex; gap:11px; align-items:flex-start; margin-top:18px;
    background:#F0F8F5; border-radius:var(--r-sm);
    box-shadow:inset 0 0 0 1px rgba(15,112,64,.14);
    padding:14px 15px; font-size:var(--t-sm); color:#0A4A34; font-weight:500;
  }
  .aviso b{ font-weight:700; }

  .btn-wa{
    display:block; text-align:center; text-decoration:none;
    margin-top:16px; padding:16px 22px; border-radius:var(--r-md);
    background:linear-gradient(160deg, var(--azul) 0%, #0C5B8A 100%);
    color:#fff; font-weight:700; font-size:var(--t-base); letter-spacing:-.008em;
    box-shadow:0 4px 14px rgba(17,114,171,.30);
    transition:transform .12s ease, box-shadow .18s ease;
  }
  .btn-wa:active{ transform:scale(.985); box-shadow:0 2px 8px rgba(17,114,171,.26); }

  .footer-note{
    text-align:center; font-size:var(--t-xs); color:var(--muted);
    margin-top:26px; line-height:1.9; font-weight:500;
  }
  .footer-note a{ color:var(--azul); text-decoration:none; border-bottom:1px solid rgba(17,114,171,.28); }
  .footer-note .tel{ font-size:var(--t-base); font-weight:700; color:var(--navy); letter-spacing:-.01em; }

  .estado-box{ text-align:center; padding:30px 14px; }
  .estado-box .emo{ font-size:38px; line-height:1; margin-bottom:14px; }
  .estado-box h1{ font-size:var(--t-md); }
  .estado-box p{ font-size:var(--t-sm); color:var(--muted); margin:8px 0 0; font-weight:450; }
</style>
</head>

<script>
(function(){
  var TOKEN = window.location.pathname.split("/").filter(Boolean).pop();
  var app = document.getElementById("app");
  var relojTimer = null;

  function money(n){ return "$" + Number(n).toLocaleString("es-CL"); }

  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function fallbackCopy(valor){
    var ta = document.createElement("textarea");
    ta.value = valor;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
  }

  function copiar(valor, btn){
    var marcar = function(){
      btn.textContent = "Copiado";
      btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = "Copiar"; btn.classList.remove("copied"); }, 1700);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(valor).then(marcar).catch(function(){ fallbackCopy(valor); marcar(); });
    } else { fallbackCopy(valor); marcar(); }
  }

  function campo(label, valor, destacado){
    var row = el("div", "campo" + (destacado ? " destacado" : ""));
    var txt = el("div", "campo-txt");
    txt.appendChild(el("div", "campo-label", label));
    txt.appendChild(el("div", "campo-valor", valor));
    var btn = el("button", "copy-btn", "Copiar");
    btn.type = "button";
    btn.setAttribute("aria-label", "Copiar " + label);
    btn.addEventListener("click", function(){ copiar(valor, btn); });
    row.appendChild(txt); row.appendChild(btn);
    return row;
  }

  function linea(etiqueta, valor){
    var l = el("div", "cita-line");
    l.appendChild(el("span", "et", etiqueta));
    l.appendChild(el("span", "va", valor));
    return l;
  }

  function cajaEstado(emo, titulo, texto){
    var box = el("div", "card estado-box");
    box.appendChild(el("div", "emo", emo));
    box.appendChild(el("h1", null, titulo));
    box.appendChild(el("p", null, texto));
    var a = el("a", "btn-wa", "Escríbenos por WhatsApp");
    a.href = "https://wa.me/56966610737";
    box.appendChild(a);
    return box;
  }

  /* Cuenta regresiva real, desde expira_at. El WhatsApp decía "90 minutos"
     fijo cuando el plazo efectivo era otro; acá se muestra lo que queda. */
  function montarReloj(expiraISO){
    if (!expiraISO) return null;
    var t = new Date(expiraISO);
    if (isNaN(t.getTime())) return null;
    var box = el("div", "reloj");
    function tick(){
      var ms = t.getTime() - Date.now();
      if (ms <= 0){ box.textContent = "El plazo terminó — refresca la página"; return; }
      var min = Math.floor(ms / 60000);
      var h = Math.floor(min / 60), m = min % 60;
      box.textContent = "Tu hora queda apartada " + (h > 0 ? h + " h " + m + " min" : m + " min") + " más";
      box.classList.toggle("urgente", min <= 30);
    }
    tick();
    if (relojTimer) clearInterval(relojTimer);
    relojTimer = setInterval(tick, 30000);
    return box;
  }

  function render(data){
    if (relojTimer){ clearInterval(relojTimer); relojTimer = null; }
    app.innerHTML = "";

    if (!data || data.error === "no_encontrado") {
      app.appendChild(cajaEstado("🔍", "Este link no es válido",
        "Puede que haya expirado o que el enlace esté incompleto. Pídenos uno nuevo."));
      return;
    }
    if (data.estado === "expirado" || data.error === "expirado") {
      app.appendChild(cajaEstado("⏳", "El tiempo para transferir venció",
        "Tu hora se liberó, pero podemos buscarte otra."));
      return;
    }

    var confirmado = data.estado === "confirmado";
    var esp = data.especialidad || "";
    var cita = data.cita || {};

    var pill = el("div", "estado-pill " + (confirmado ? "confirmado" : "pendiente"));
    pill.appendChild(el("span", "dot"));
    pill.appendChild(document.createTextNode(confirmado ? "Confirmado" : "Esperando tu transferencia"));
    app.appendChild(pill);

    var hero = el("div", "card hero");
    // La especialidad viene del backend. Estaba escrita a mano como
    // "Psiquiatría" y los abonos de Gastroenterología mostraban la equivocada.
    var saludo = data.paciente ? data.paciente + ", " : "";
    hero.appendChild(el("h1", null, confirmado
      ? "Tu hora ya está confirmada"
      : saludo + (esp ? "este es el abono de tu hora de " + esp : "este es el abono de tu hora")));
    hero.appendChild(el("p", "lead", confirmado
      ? "Recibimos tu transferencia. No necesitas hacer nada más — te esperamos."
      : "Transfiere el monto exacto y mándanos el comprobante por WhatsApp: con eso te confirmamos la hora."));

    if (cita.fecha_display || cita.hora || cita.profesional) {
      var c = el("div", "cita");
      if (esp) c.appendChild(el("div", "cita-esp", esp));
      if (cita.fecha_display) c.appendChild(linea("Cuándo", cita.fecha_display + (cita.hora ? " · " + cita.hora + " h" : "")));
      if (cita.profesional) c.appendChild(linea("Con", cita.profesional));
      hero.appendChild(c);
    }

    var montoBox = el("div", "monto-box");
    montoBox.appendChild(el("div", "monto-label", "Monto a transferir"));
    montoBox.appendChild(el("div", "monto-valor", money(data.monto)));
    montoBox.appendChild(el("div", "monto-nota", "Cubre el total de la consulta. El día de la atención no pagas nada más."));
    hero.appendChild(montoBox);

    if (!confirmado){
      var reloj = montarReloj(data.expira_at);
      if (reloj) hero.appendChild(reloj);
    }
    app.appendChild(hero);

    if (confirmado) return;

    var cta = el("div", "card");
    cta.appendChild(el("div", "card-title", "Datos para transferir"));
    cta.appendChild(campo("Banco", data.cuenta.banco));
    cta.appendChild(campo("Tipo de cuenta", data.cuenta.tipo));
    cta.appendChild(campo("Número de cuenta", data.cuenta.numero));
    cta.appendChild(campo("Titular", data.cuenta.titular));
    cta.appendChild(campo("RUT", data.cuenta.rut));
    cta.appendChild(campo("Correo", data.cuenta.correo));
    cta.appendChild(campo("Monto exacto", money(data.monto), true));
    app.appendChild(cta);

    var pasos = el("div", "card");
    pasos.appendChild(el("div", "card-title", "Cómo hacerlo"));
    var ol = el("ol", "pasos");
    ["Abre la app de tu banco.",
     "Copia los datos de arriba y transfiere el monto exacto.",
     "Sácale una foto o captura al comprobante.",
     "Mándanoslo por WhatsApp y te confirmamos la hora."
    ].forEach(function(p){ ol.appendChild(el("li", null, p)); });
    pasos.appendChild(ol);

    var aviso = el("div", "aviso");
    aviso.appendChild(el("span", null, "📎"));
    var t = el("span");
    t.appendChild(el("b", null, "El comprobante es lo que confirma tu hora. "));
    t.appendChild(document.createTextNode("Mándalo por el mismo chat de WhatsApp donde te llegó este link."));
    aviso.appendChild(t);
    pasos.appendChild(aviso);

    // Botón directo al chat: el paciente llega acá desde WhatsApp y tiene que
    // volver justo ahí para mandar la foto — sin esto queda buscando la app.
    var waBtn = el("a", "btn-wa", "Enviar comprobante por WhatsApp");
    waBtn.href = "https://wa.me/56966610737";
    pasos.appendChild(waBtn);
    app.appendChild(pasos);
  }

  function cargar(){
    fetch("/api/abono/" + encodeURIComponent(TOKEN) + "/estado")
      .then(function(r){ return r.json(); })
      .then(function(data){
        render(data);
        if (data && data.estado !== "confirmado" && data.estado !== "expirado" && !data.error) {
          setTimeout(cargar, 8000);
        }
      })
      .catch(function(){
        app.innerHTML = "";
        app.appendChild(cajaEstado("📶", "No pudimos cargar tu abono",
          "Refresca la página o escríbenos y te ayudamos."));
      });
  }

  cargar();
})();
</script>
</body>
</html>
