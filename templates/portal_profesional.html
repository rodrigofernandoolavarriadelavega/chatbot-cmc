<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F3F68">
<title>Portal del Profesional — Alma CMC</title>
<style>
@font-face{font-family:'Montserrat';src:url('/static/fonts/montserrat-var-latin.woff2') format('woff2-variations');font-weight:400 800;font-display:swap}
@font-face{font-family:'Inter';src:url('/static/fonts/inter-var-latin.woff2') format('woff2-variations');font-weight:400 700;font-display:swap}
:root{
  --azul:#0F3F68;--azul-700:#0c3556;--azul-500:#1172AB;--azul-300:#7FA9CB;--azul-50:#EAF2F9;
  --aqua:#4FBECE;--aqua-600:#2E9FB0;--aqua-50:#E6F7FA;
  --verde:#16A34A;--verde-50:#E8F7EE;--naranja:#EA7317;--naranja-700:#B4560D;--naranja-50:#FDF1E7;
  --rojo:#DC2626;--rojo-50:#FDECEC;
  --bg:#EEF3F8;--bg-2:#F6F9FC;--blanco:#fff;--tinta:#12283A;
  --gris-100:#E3EAF1;--gris-200:#D3DDE7;--gris-300:#B5C3D1;--gris-400:#8597A8;--gris-500:#5E7184;--gris-600:#46586A;
  --linea:#E3EAF1;
  --radius:14px;--radius-lg:20px;--radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(15,63,104,.06);
  --shadow-sm:0 1px 3px rgba(15,63,104,.08),0 4px 12px rgba(15,63,104,.05);
  --shadow-md:0 6px 20px rgba(15,63,104,.12);
  --shadow-lg:0 18px 50px rgba(15,63,104,.22);
  --grad-navy:linear-gradient(135deg,#0F3F68 0%,#14527F 60%,#1172AB 100%);
  --font-display:'Montserrat',-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--ease-back:cubic-bezier(.34,1.3,.5,1);
  --side:372px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--tinta);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--aqua);outline-offset:2px;border-radius:8px}
.num,.tab-num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Header ───────────────────────────────────────────── */
.hdr{position:relative;display:flex;align-items:center;gap:14px;padding:0 20px;height:64px;background:var(--grad-navy);
  color:#fff;overflow:hidden;z-index:5;padding-top:env(safe-area-inset-top)}
.hdr::after{content:'';position:absolute;right:-80px;top:-120px;width:340px;height:300px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(79,190,206,.42),rgba(79,190,206,0));pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto;position:relative;z-index:1}
.brand>div{min-width:0}
.brand h1{overflow:hidden;text-overflow:ellipsis}
.brand .iso{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);flex:none}
.brand .iso img{width:26px;height:26px}
.brand h1{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:12.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .spacer{flex:1}
.hpill{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--radius-pill);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:12.5px;font-weight:500;white-space:nowrap}
.hpill .dot{width:7px;height:7px;border-radius:50%;background:var(--aqua);box-shadow:0 0 0 0 rgba(79,190,206,.7);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,190,206,.6)}70%{box-shadow:0 0 0 8px rgba(79,190,206,0)}100%{box-shadow:0 0 0 0 rgba(79,190,206,0)}}
.hpill.demo{gap:0;background:#FFF4E5;color:#7A3E06;border-color:#F7CF9E;font-weight:600}
.hbtn{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;min-width:36px;padding:0 12px;border-radius:10px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:500;transition:background .15s var(--ease)}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn.aqua{background:var(--aqua);border-color:var(--aqua);color:#06303B;font-weight:600}
.hbtn.aqua:hover{background:#6BCBD8}

/* ── Layout ───────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--side) 1fr;height:calc(100dvh - 64px - env(safe-area-inset-top))}
.side{background:var(--blanco);border-right:1px solid var(--linea);display:flex;flex-direction:column;min-height:0}
.main{min-width:0;min-height:0;overflow:auto;scroll-behavior:smooth}

/* ── Sidebar ──────────────────────────────────────────── */
.side-top{padding:16px 16px 10px;border-bottom:1px solid var(--linea)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gris-400);width:17px;height:17px}
.search input{width:100%;height:42px;border:1px solid var(--gris-200);border-radius:12px;background:var(--bg-2);padding:0 40px 0 38px;font-size:14px;
  transition:border-color .15s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease)}
.search input:focus{outline:none;border-color:var(--aqua);background:#fff;box-shadow:0 0 0 4px var(--aqua-50)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--font-body);color:var(--gris-400);border:1px solid var(--gris-200);border-radius:6px;padding:1px 6px;background:#fff}
.seg{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:3px;margin-top:12px}
.seg button{flex:1;white-space:nowrap;height:32px;border:0;background:transparent;border-radius:8px;font-size:13px;font-weight:500;color:var(--gris-600);transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease)}
.seg button[aria-pressed=true]{background:#fff;color:var(--azul);font-weight:600;box-shadow:var(--shadow-xs)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--radius-pill);border:1px solid var(--gris-200);background:#fff;
  font-size:12.5px;font-weight:500;color:var(--gris-600);transition:all .15s var(--ease)}
.chip b{font-weight:600;color:var(--tinta)}
.chip:hover{border-color:var(--azul-300)}
.chip[aria-pressed=true]{background:var(--azul);border-color:var(--azul);color:#fff}
.chip[aria-pressed=true] b{color:#fff}
.list-h{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 6px}
.list-h h2{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-500);margin:0;font-weight:600}
.list-h span{font-size:12.5px;color:var(--gris-500)}
.list{flex:1;overflow:auto;padding:2px 8px 16px;overscroll-behavior:contain}
.pac{display:flex;gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:11px 10px;position:relative;
  transition:background .15s var(--ease);animation:rise .32s var(--ease-back) both;animation-delay:calc(var(--i,0) * 45ms)}
.pac:hover{background:var(--bg-2)}
.pac[aria-current=true]{background:var(--aqua-50)}
.pac[aria-current=true]::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--aqua)}
.av{width:40px;height:40px;border-radius:12px;background:var(--azul-50);color:var(--azul);display:grid;place-items:center;font:600 14px var(--font-display);flex:none;letter-spacing:-.01em}
.pac[aria-current=true] .av{background:var(--azul);color:#fff}
.pac .body{min-width:0;flex:1}
.pac .row1{display:flex;align-items:baseline;gap:8px}
.pac .nom{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--tinta)}
.pac .when{font-size:12px;color:var(--gris-500);white-space:nowrap}
.pac .rut{font-size:12px;color:var(--gris-500);margin-top:1px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;background:var(--bg);color:var(--gris-600);font-size:11.5px;font-weight:500;white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.ck{background:var(--aqua-50);color:#0E6F7E}
.tag.hoy{background:var(--azul);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Contenido ────────────────────────────────────────── */
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 48px}
.sec-label{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-500);font-weight:600;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:center;
  animation:rise .35s var(--ease-back) both;animation-delay:calc(var(--i,0)*50ms);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--azul-50);color:var(--azul);flex:none}
.kpi .ic.aq{background:var(--aqua-50);color:#0E6F7E}
.kpi .v{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--gris-500);margin-top:2px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.tbl-cards,.tbl-med{overflow-x:auto}
.note{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-xs);font-size:13.5px;color:var(--gris-600);line-height:1.55}
.note svg{color:var(--azul-500);margin-top:2px}
.note b{color:var(--tinta);font-weight:600}
.welcome h2{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;color:var(--azul)}
.welcome p{margin:0 0 20px;color:var(--gris-500);font-size:15px}

/* Ficha */
.fhead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.fhead .av{width:56px;height:56px;border-radius:16px;font-size:19px;background:var(--azul);color:#fff}
.fhead .who{flex:1;min-width:220px}
.fhead h2{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px;color:var(--tinta)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--gris-500)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:15px;height:15px}
.fhead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--gris-200);
  background:#fff;color:var(--azul);font-size:14px;font-weight:600;transition:transform .12s var(--ease),box-shadow .18s var(--ease),background .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{border-color:var(--azul-300);box-shadow:var(--shadow-xs)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--azul);border-color:var(--azul);color:#fff;box-shadow:0 4px 14px rgba(15,63,104,.22)}
.btn-primary:hover{background:var(--azul-700);border-color:var(--azul-700);box-shadow:0 6px 18px rgba(15,63,104,.3)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--gris-600)}
.btn-ghost:hover{background:var(--bg);border-color:transparent;box-shadow:none}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.back{display:none}
.citas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}
.cita{background:#fff;border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow-xs);display:flex;gap:12px;align-items:center}
.cita .ic{width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--azul);display:grid;place-items:center;flex:none}
.cita .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-500);font-weight:600}
.cita .v{font-size:14px;font-weight:600;margin-top:1px}
.cita .v small{font-weight:400;color:var(--gris-500);font-size:12.5px}
.cita.hoy{background:var(--azul);color:#fff}
.cita.hoy .l,.cita.hoy .v small{color:rgba(255,255,255,.75)}
.cita.hoy .ic{background:rgba(255,255,255,.14);color:#fff}
.desde{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--gris-600)}
.desde .tag{height:26px;font-size:12.5px;background:#fff;box-shadow:var(--shadow-xs)}

.tabs{display:flex;gap:4px;margin:24px 0 16px;border-bottom:1px solid var(--gris-200);overflow-x:auto;scrollbar-width:none;position:relative}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--gris-500);white-space:nowrap;transition:color .15s var(--ease)}
.tab:hover{color:var(--azul)}
.tab[aria-selected=true]{color:var(--azul);font-weight:600}
.tab .n{font-size:12px;font-weight:600;background:var(--bg);color:var(--gris-600);border-radius:var(--radius-pill);padding:1px 8px;font-variant-numeric:tabular-nums}
.tab[aria-selected=true] .n{background:var(--aqua-50);color:#0E6F7E}
.tab-ink{position:absolute;bottom:-1px;height:2.5px;border-radius:2px;background:var(--aqua);transition:transform .28s var(--ease),width .28s var(--ease);left:0}
.pane{animation:fade .25s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Mediciones */
.vt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.vt .spacer{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-xs)}
.stat .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-500);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--tinta)}
.stat .v small{font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--gris-500);letter-spacing:0;margin-left:3px}
.stat .s{font-size:12.5px;color:var(--gris-500);margin-top:2px}
.chart-card{padding:16px 16px 10px;position:relative}
.chart-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 4px 8px}
.chart-h h3{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--gris-600)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.hollow{background:#fff!important;border:2px solid var(--azul)}
.chart{position:relative;height:260px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .gl{stroke:var(--gris-100);stroke-width:1}
.chart .yl,.chart .xl{font:500 11px var(--font-body);fill:var(--gris-500);font-variant-numeric:tabular-nums}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .7s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .pt{transition:r .12s var(--ease)}
.chart .guide{stroke:var(--gris-300);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .12s}
.tip{position:absolute;pointer-events:none;background:var(--tinta);color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow-md);
  opacity:0;transform:translate(-50%,calc(-100% - 10px)) scale(.96);transition:opacity .12s var(--ease),transform .12s var(--ease);white-space:nowrap;z-index:3}
.tip.on{opacity:1;transform:translate(-50%,calc(-100% - 12px)) scale(1)}
.tip b{font-size:14px;font-variant-numeric:tabular-nums}
.tip span{color:rgba(255,255,255,.7)}
.chart-foot{font-size:12px;color:var(--gris-500);margin:6px 4px 2px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-500);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--gris-100);white-space:nowrap;background:var(--bg-2)}
th:first-child{border-top-left-radius:var(--radius)}th:last-child{border-top-right-radius:var(--radius)}
td{padding:11px 16px;border-bottom:1px solid var(--gris-100);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s var(--ease)}
tbody tr:hover{background:var(--bg-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .val{font-weight:600;font-variant-numeric:tabular-nums}
td .u{color:var(--gris-500);font-size:12.5px;margin-left:3px}
.muted{color:var(--gris-500)}
.small{font-size:12.5px}
.more{display:flex;justify-content:center;padding:10px}

.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap}
.badge svg{width:13px;height:13px}
.badge.ok{background:var(--verde-50);color:#11743A}
.badge.warn{background:var(--naranja-50);color:var(--naranja-700)}
.badge.info{background:var(--azul-50);color:var(--azul)}
.badge.mut{background:var(--bg);color:var(--gris-600)}

/* Datos y familia */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 4px}
.card-h .ic{width:32px;height:32px;border-radius:10px;background:var(--azul-50);color:var(--azul);display:grid;place-items:center}
.card-h h3{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.card-h .muted{font-size:12.5px}
dl.kv{margin:0;padding:8px 18px 16px}
dl.kv div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--gris-100)}
dl.kv div:last-child{border-bottom:0}
dl.kv dt{font-size:12.5px;color:var(--gris-500)}
dl.kv dd{margin:0;font-size:14px;font-weight:500;word-break:break-word}
dl.kv dd.none{color:var(--gris-400);font-weight:400}
.people{padding:8px 10px 14px}
.person{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:12px}
.person .av{width:36px;height:36px;border-radius:11px;font-size:13px}
.person .nm{font-weight:600;font-size:14px}
.person .sub{font-size:12.5px;color:var(--gris-500)}
.person .body{flex:1;min-width:0}
.subhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-500);font-weight:600;padding:10px 18px 2px}
.empty-mini{padding:6px 18px 16px;color:var(--gris-500);font-size:13.5px}

/* Actividad */
.tl{padding:6px 18px 12px}
.tl-day{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris-500);font-weight:600;padding:14px 0 6px}
.ev{display:grid;grid-template-columns:56px 28px 1fr;gap:10px;align-items:flex-start;padding:7px 0}
.ev .h{font-size:12.5px;color:var(--gris-500);font-variant-numeric:tabular-nums;padding-top:4px;text-align:right}
.ev .dot{width:28px;height:28px;border-radius:9px;background:var(--bg);color:var(--gris-500);display:grid;place-items:center}
.ev .dot svg{width:15px;height:15px}
.ev.nov .dot{background:var(--aqua-50);color:#0E6F7E}
.ev .t{font-size:14px;font-weight:500;padding-top:4px}
.ev .d{font-size:12.5px;color:var(--gris-500)}

/* Estados */
.skel{background:linear-gradient(90deg,var(--gris-100) 0%,#F2F6FA 40%,var(--gris-100) 80%);background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:8px}
@keyframes shim{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 24px;color:var(--gris-500)}
.empty .ic{width:52px;height:52px;border-radius:16px;background:var(--azul-50);color:var(--azul);display:grid;place-items:center;margin:0 auto 14px}
.empty .ic svg{width:24px;height:24px}
.empty h3{font-family:var(--font-display);font-size:18px;color:var(--tinta);margin:0 0 6px;letter-spacing:-.01em;font-weight:600}
.empty p{margin:0 auto 16px;max-width:400px;font-size:14px;line-height:1.55}
.banner{display:flex;gap:12px;align-items:center;background:var(--naranja-50);color:#7A3E06;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:12px 16px 0}
.banner.err{background:var(--rojo-50);color:#8F1B1B}
.banner .btn{margin-left:auto;height:34px;font-size:13px}

/* Overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(18,40,58,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto;
  opacity:0;transition:opacity .2s var(--ease)}
.ov.on{opacity:1}
.ov[hidden]{display:none}
.sheet-wrap{width:100%;max-width:860px;transform:translateY(12px) scale(.985);transition:transform .25s var(--ease-back)}
.ov.on .sheet-wrap{transform:none}
.sheet-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:14px 18px;border-bottom:1px solid var(--gris-100);position:sticky;top:-32px;z-index:2}
.sheet-bar h2{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;flex:1;letter-spacing:-.02em;color:var(--azul)}
.sheet-bar label{font-size:12.5px;color:var(--gris-500);display:flex;align-items:center;gap:8px}
.sheet-bar input[type=date]{height:38px;border:1px solid var(--gris-200);border-radius:10px;padding:0 10px;font-size:16px;background:#fff}
.sheet{background:#fff;border-radius:0 0 var(--radius-lg) var(--radius-lg);box-shadow:var(--shadow-lg);padding:28px 32px 32px;color:var(--tinta)}
.sh-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--azul);padding-bottom:14px;margin-bottom:18px}
.sh-head .c{font-family:var(--font-display);font-weight:700;color:var(--azul);font-size:15px;letter-spacing:-.01em}
.sh-head .c small{display:block;font-family:var(--font-body);font-weight:400;color:var(--gris-500);font-size:12px;letter-spacing:0;margin-top:2px}
.sh-head .p{text-align:right}
.sh-head .p b{font-family:var(--font-display);font-size:18px;letter-spacing:-.02em;display:block}
.sh-head .p span{font-size:12.5px;color:var(--gris-500)}
.sh-sec{margin:20px 0 0;overflow-x:auto}
.sh-sec h3{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--azul);margin:0 0 8px;font-weight:700}
.sh-sec table th{background:#fff;padding:7px 10px;border-bottom:1.5px solid var(--gris-200)}
.sh-sec table td{padding:7px 10px;font-size:13px}
.sh-spark{display:block;width:120px;height:28px}
.sh-foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--gris-200);font-size:11.5px;color:var(--gris-500);line-height:1.5}

.audit{max-width:980px}
.lock{position:fixed;inset:0;z-index:60;background:rgba(238,243,248,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;place-items:center}
.lock.on{display:grid;animation:fade .2s var(--ease)}
.lock .box{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:28px;text-align:center;max-width:360px}
.lock .box .ic{width:52px;height:52px;border-radius:16px;background:var(--azul);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.lock h3{font-family:var(--font-display);margin:0 0 6px;font-size:18px;letter-spacing:-.01em}
.lock p{margin:0 0 18px;color:var(--gris-500);font-size:14px}

.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--tinta);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-md);font-size:14px;display:flex;gap:10px;align-items:center;max-width:380px;animation:tin .25s var(--ease-back)}
.toast.err{background:#8F1B1B}
.toast.out{animation:tout .18s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:scale(.96)}}

.full{display:grid;place-items:center;height:calc(100dvh - 64px);padding:24px}
.full .card{max-width:460px;padding:28px;text-align:center}

  .tbl-med td:nth-child(4):empty,.tbl-med td.vacio{display:none}
  dl.kv div{grid-template-columns:1fr;gap:2px}
  .person{flex-wrap:wrap}
  .person .badge{margin-left:48px}
  .ov{padding:0}
  .sheet-wrap{max-width:none;min-height:100dvh;display:flex;flex-direction:column}
  .sheet-bar{border-radius:0;top:0}
  .sheet{border-radius:0;flex:1;padding:18px 16px 32px}
  .sh-head{flex-direction:column}
  .sheet-bar h2{font-size:16px;white-space:nowrap;flex:1 1 100%;padding-right:44px}
  .sheet-bar [data-act=cerrar-prep],.sheet-bar [data-act=cerrar-audit]{position:absolute;right:8px;top:8px;width:44px;height:44px;padding:0}
  .sh-sec table td,.sh-sec table th{padding:6px 8px;font-size:12.5px}
  .sh-sec table td b{white-space:nowrap}
  .sh-head .p{text-align:left}
  .toasts{left:12px;right:12px;align-items:stretch}
  .search input{font-size:16px}
  .search kbd{display:none}
  .ev{grid-template-columns:44px 28px 1fr}
}
@media (max-height:480px) and (orientation:landscape){
  .hdr{height:48px}
  .chart{height:170px}
}

  .sh-sec{break-inside:avoid}
}

<script>
'use strict';
// ── Contexto ─────────────────────────────────────────────
const QS = new URLSearchParams(location.search);
const TOKEN = QS.get('token') || '';
const DEMO = QS.get('demo') === '1';
const _tk = u => { const p = []; if (TOKEN) p.push('token=' + encodeURIComponent(TOKEN)); if (DEMO) p.push('demo=1');
  return p.length ? u + (u.includes('?') ? '&' : '?') + p.join('&') : u; };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const ic = (n, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const TZ = 'America/Santiago';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const S = { dias: 7, filtro: 'todo', pacientes: null, sel: null, ficha: null, tab: 'med', vt: null, rango: 90, yo: null, q: '', buscando: null, verMas: false };

// ── Formato ──────────────────────────────────────────────
const dParts = (iso) => { const d = new Date(iso); if (isNaN(d)) return null;
  const f = new Intl.DateTimeFormat('es-CL', {timeZone: TZ, day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}).formatToParts(d);
  const g = t => (f.find(p => p.type === t) || {}).value; return {d:g('day'), m:g('month'), y:g('year'), h:g('hour'), mi:g('minute'), date:d}; };
const toDate = (iso) => { if (!iso) return null; if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) { const [y,m,d]=iso.split('-'); return new Date(+y, +m-1, +d, 12); } return new Date(iso); };
function fFecha(iso){ if(!iso) return '—'; if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) { const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; } const p=dParts(iso); return p?`${p.d}/${p.m}/${p.y}`:'—'; }
function fHora(iso){ const p=dParts(iso); return p?`${p.h}:${p.mi}`:''; }
function fCorta(iso){ if(!iso) return ''; if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) { const [,m,d]=iso.split('-'); return `${d}/${m}`; } const p=dParts(iso); return p?`${p.d}/${p.m}`:''; }
function hoyCL(){ const p = dParts(new Date().toISOString()); return `${p.y}-${p.m}-${p.d}`; }
function ymdCL(iso){ if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso; const p=dParts(iso); return p?`${p.y}-${p.m}-${p.d}`:''; }
function hace(iso){ if(!iso) return ''; const ms = Date.now() - toDate(iso).getTime(); const m = Math.round(ms/60000);
  if (m < 1) return 'recién'; if (m < 60) return `hace ${m} min`; const h = Math.round(m/60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h/24); if (d === 1) return 'ayer'; if (d < 7) return `hace ${d} días`; return fFecha(iso); }
function diasEntre(a, b){ return Math.round((toDate(b) - toDate(a)) / 86400000); }
const nf1 = new Intl.NumberFormat('es-CL', {maximumFractionDigits:1});
const nf0 = new Intl.NumberFormat('es-CL', {maximumFractionDigits:0});
const VT = {
  presion:     {n:'Presión arterial', c:'Presión', pl:'presiones', u:'mmHg', dec:0},
  glicemia:    {n:'Glicemia', c:'Glicemia', pl:'glicemias', u:'mg/dL', dec:0},
  peso:        {n:'Peso', c:'Peso', pl:'pesos', u:'kg', dec:1},
  temperatura: {n:'Temperatura', c:'Temperatura', pl:'temperaturas', u:'°C', dec:1},
};
const fmtN = (v, t) => v == null ? '—' : (VT[t].dec ? nf1 : nf0).format(v);
function vValor(v){ return v.tipo === 'presion' ? `${fmtN(v.valor,'presion')}/${fmtN(v.valor2,'presion')}` : fmtN(v.valor, v.tipo); }
function iniciales(n){ const p = String(n||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '·'; return ((p[0][0]||'') + (p.length>2 ? p[p.length-2][0] : (p[1]||'')[0]||'')).toUpperCase(); }
const SEXO = {F:'Femenino', M:'Masculino', O:'Otro'};
const CAMPO = {direccion:'dirección', comuna:'comuna', email:'correo', prevision:'previsión', fecha_nacimiento:'fecha de nacimiento', sexo:'sexo',
  contacto_emerg_nombre:'contacto de emergencia', contacto_emerg_telefono:'teléfono de emergencia'};
const METODO = {otp:['Verificado con código','ok','check'], tutor_declaration:['Tutor declarado · menor de edad','info','users'], declared:['Declarado al agendar · sin verificar','warn','alert']};

// ── Red ──────────────────────────────────────────────────
class ApiError extends Error { constructor(st, msg){ super(msg); this.status = st; } }
async function api(path){

function niceTicks(lo, hi, n = 4){
  const span = hi - lo || 1; const step0 = span / n; const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step; const out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(6)); return out;
}
function dibujarChart(el, pts, tipo, desdeMs){
  const W = el.clientWidth, H = el.clientHeight; if (!W) return;
  const m = {l: 44, r: 14, t: 14, b: 28};
  const pres = tipo === 'presion';
  const all = pts.flatMap(p => pres ? [p.valor, p.valor2] : [p.valor]).filter(v => v != null);
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * .15 || Math.max(1, hi * .05); lo -= pad; hi += pad;
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const t0 = Math.min(desdeMs, toDate(pts[0].ts).getTime()), t1 = Date.now();
  const X = t => m.l + (t - t0) / (t1 - t0 || 1) * (W - m.l - m.r);
  const Y = v => m.t + (1 - (v - lo) / (hi - lo || 1)) * (H - m.t - m.b);
  const nX = Math.max(2, Math.min(6, Math.floor((W - m.l) / 90)));
  let g = '';
  ticks.forEach(v => { const y = Y(v).toFixed(1); g += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text class="yl" x="${m.l - 8}" y="${+y + 4}" text-anchor="end">${(VT[tipo].dec ? nf1 : nf0).format(v)}</text>`; });
  for (let i = 0; i <= nX; i++){ const t = t0 + (t1 - t0) * i / nX; const x = X(t);
    g += `<text class="xl" x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === nX ? 'end' : 'middle'}">${fCorta(new Date(t).toISOString())}</text>`; }
  const path = key => pts.filter(p => p[key] != null).map((p, i) => `${i ? 'L' : 'M'}${X(toDate(p.ts).getTime()).toFixed(1)},${Y(p[key]).toFixed(1)}`).join('');
  const many = pts.length > 45, r = many ? 2.4 : 3.4;
  const series = pres ? [['valor2', 'var(--aqua)'], ['valor', 'var(--azul)']] : [['valor', 'var(--azul)']];
  let lines = '', dots = '';
  series.forEach(([k, col]) => {
    if (tipo !== 'glicemia') lines += `<path class="ln draw" d="${path(k)}" stroke="${col}"/>`;
    pts.forEach((p, i) => { if (p[k] == null) return; const hollow = tipo === 'glicemia' && !/ayun/i.test(p.contexto || '');
      dots += `<circle class="pt" data-i="${i}" cx="${X(toDate(p.ts).getTime()).toFixed(1)}" cy="${Y(p[k]).toFixed(1)}" r="${i === pts.length - 1 ? r + 1.4 : r}" fill="${hollow ? '#fff' : col}" stroke="${hollow ? col : '#fff'}" stroke-width="${hollow ? 2 : (i === pts.length - 1 ? 2 : 1)}" style="${RM ? '' : `opacity:0;animation:fade .3s var(--ease) ${Math.min(500, 250 + i * 6)}ms forwards`}"/>`; });
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${VT[tipo].n.toLowerCase()}, ${pts.length} registros">${g}
    <line class="guide" id="guide" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}"/>${lines}${dots}
    <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>`;
  $$('.ln.draw', el).forEach(p => { const L = p.getTotalLength ? p.getTotalLength() : 1000; p.style.setProperty('--len', Math.ceil(L)); });
  const tip = $('#tip', el), guide = $('#guide', el), xsPx = pts.map(p => X(toDate(p.ts).getTime()));
  const hit = $('#hit', el);
  const mover = ev => { const rc = el.getBoundingClientRect(); const x = (ev.clientX - rc.left) * (W / rc.width);
    let bi = 0, bd = 1e9; xsPx.forEach((px, i) => { const d = Math.abs(px - x); if (d < bd){ bd = d; bi = i; } });
    const p = pts[bi], px = xsPx[bi], py = Y(p.valor);
    guide.setAttribute('x1', px); guide.setAttribute('x2', px); guide.style.opacity = 1;
    $$('.pt', el).forEach(c => c.setAttribute('r', +c.dataset.i === bi ? r + 2 : (+c.dataset.i === pts.length - 1 ? r + 1.4 : r)));
    tip.innerHTML = `<b>${vValor(p)}</b> ${VT[tipo].u}<br><span>${fFecha(p.ts)} · ${fHora(p.ts)}${p.contexto ? ' · ' + esc(p.contexto) : ''}</span>`;
    tip.style.left = Math.max(70, Math.min(rc.width - 70, px * rc.width / W)) + 'px'; tip.style.top = (py * rc.height / H) + 'px'; tip.classList.add('on'); };
  const salir = () => { tip.classList.remove('on'); guide.style.opacity = 0; $$('.pt', el).forEach(c => c.setAttribute('r', +c.dataset.i === pts.length - 1 ? r + 1.4 : r)); };
  hit.addEventListener('pointermove', mover); hit.addEventListener('pointerdown', mover); hit.addEventListener('pointerleave', salir);
}

let qT = 0;
function onBuscar(){
  const q = $('#q').value.trim(); clearTimeout(qT);
  if (!q){ S.buscando = null; renderLista(); return; }
  const digits = q.replace(/[^0-9kK]/g, '');
  const corto = !(digits.length >= 7 && /^\d+$/.test(digits.slice(0, -1))) && q.length < 3;
  S.buscando = {q, res: corto ? [] : null, corto}; renderLista(); if (corto) return;
  qT = setTimeout(async () => {
    try { const r = await api('/portal-profesional/api/buscar?q=' + encodeURIComponent(q)); if (S.buscando && S.buscando.q === q){ S.buscando.res = r.pacientes || []; renderLista(); } }
    catch(e){ if (e.status === 401 || e.status === 403) return pantallaSinAcceso(e); if (S.buscando){ S.buscando.res = []; renderLista(); } toast(e.message, 'error'); }
  }, 280);
}

// ── Eventos ──────────────────────────────────────────────
document.addEventListener('click', ev => {
  const b = ev.target.closest('button,[data-act]'); if (!b) return;
  if (b.classList.contains('pac')) return abrir(b.dataset.rut);
  if (b.dataset.d){ S.dias = +b.dataset.d; $$('.seg [data-d]').forEach(x => x.setAttribute('aria-pressed', x === b)); S.filtro = 'todo'; return cargarNovedades(); }
  if (b.dataset.f){ S.filtro = b.dataset.f; renderChips(); renderLista(); return; }
  if (b.dataset.tab){ S.tab = b.dataset.tab; $$('.tab').forEach(t => t.setAttribute('aria-selected', t === b)); moverInk(); renderTab(); return; }
  if (b.dataset.vt){ S.vt = b.dataset.vt; S.verMas = false; return renderTab(); }
  if (b.dataset.rango){ S.rango = +b.dataset.rango; S.verMas = false; return renderTab(); }
  const a = b.dataset.act;
  if (a === 'ampliar'){ S.dias = 30; $$('.seg [data-d]').forEach(x => x.setAttribute('aria-pressed', x.dataset.d === '30')); return cargarNovedades(); }
  if (a === 'reintentar') return cargarNovedades();
  if (a === 'reabrir') return abrir(S.sel, false);
  if (a === 'volver') return history.length > 1 && location.hash ? history.back() : cerrar();
  if (a === 'preparar') return preparar();
  if (a === 'imprimir') return window.print();
  if (a === 'cerrar-prep') return cerrarOv('#ov-prep');
  if (a === 'cerrar-audit') return cerrarOv('#ov-audit');
  if (a === 'vermas'){ S.verMas = true; return renderTab(); }
});
$('#ov-prep').addEventListener('click', e => { if (e.target.id === 'ov-prep') cerrarOv('#ov-prep'); });
$('#ov-audit').addEventListener('click', e => { if (e.target.id === 'ov-audit') cerrarOv('#ov-audit'); });
$('#btn-audit').addEventListener('click', abrirAuditoria);
$('#btn-refresh').addEventListener('click', () => { cargarNovedades(); if (S.sel) abrir(S.sel, false); toast('Información actualizada.'); });
$('#q').addEventListener('input', onBuscar);
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape'){ if (!$('#ov-prep').hidden) return cerrarOv('#ov-prep'); if (!$('#ov-audit').hidden) return cerrarOv('#ov-audit');
    if ($('#q').value){ $('#q').value = ''; onBuscar(); } }
});
addEventListener('popstate', () => { const m = location.hash.match(/p=([^&]+)/); if (m) abrir(decodeURIComponent(m[1]), false); else cerrar(false); });
let rzT = 0; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.ficha && S.tab === 'med') renderTab(); moverInk(false); }, 150); });

// Pantalla protegida por inactividad (5 min): el box es un espacio compartido.
let idle = 0; const IDLE_MS = 5 * 60 * 1000;
const resetIdle = () => { clearTimeout(idle); idle = setTimeout(() => { if (S.sel) $('#lock').classList.add('on'); }, IDLE_MS); };
['pointerdown', 'keydown', 'scroll', 'pointermove'].forEach(t => addEventListener(t, resetIdle, {passive: true}));
$('#unlock').addEventListener('click', () => { $('#lock').classList.remove('on'); resetIdle(); });
resetIdle();

// ── Arranque ─────────────────────────────────────────────
(async function init(){
  if (DEMO){ $('#pill-demo').hidden = false; }
  renderLista(); renderInicio();
  try {
    S.yo = await api('/portal-profesional/api/yo');
    const sc = $('#pill-scope'); sc.hidden = false; sc.textContent = S.yo.alcance === 'propios' ? 'Solo sus pacientes' : 'Todo el centro';
    $('#hdr-sub').textContent = S.yo.actor;
    if (S.yo.ve_auditoria) $('#btn-audit').hidden = false;
  } catch(e){ if (e.status === 401 || e.status === 403) return pantallaSinAcceso(e); }
  await cargarNovedades();
  const m = location.hash.match(/p=([^&]+)/); if (m) abrir(decodeURIComponent(m[1]), false);
})();
</script>
</body>
</html>
