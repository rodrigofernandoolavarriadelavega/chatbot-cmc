<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F3F68">
<meta name="description" content="Sus horas, su familia y su salud en el Centro Médico Carampangue.">
<title>Mi Salud · Centro Médico Carampangue</title>
<link rel="icon" href="/static/favicon-circle-64.png">
<link rel="apple-touch-icon" href="/static/pwa/icon-192.png">
<link rel="manifest" href="/static/portal-app/manifest.webmanifest">
<link rel="preload" href="/static/fonts/montserrat-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ═══ Portal del Paciente CMC — portal_app (v6)
   "La v4, pero más simple, más grande y más premium para adulto mayor".
   Una tarea por pantalla · texto 18px · toques ≥56px · cero CDN. ═══ */
@font-face{font-family:"Montserrat";src:url(/static/fonts/montserrat-var-latin.woff2) format("woff2");font-weight:400 800;font-display:swap}
@font-face{font-family:"Inter";src:url(/static/fonts/inter-var-latin.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{
  --navy:#0F3F68;--navy-2:#0B3154;--blue:#1172AB;--aqua:#4FBECE;--aqua-soft:#E3F4F6;
  --bone:#F6F3EE;--card:#FFFFFF;--line:#E4DED4;--line-2:#D6CEC1;
  --ink:#14212D;--ink-2:#3B4A57;--muted:#55636F;
  --ok:#11734B;--ok-bg:#E5F4EC;--warn:#8A5300;--warn-bg:#FFF3DC;--bad:#A3261B;--bad-bg:#FCEBE8;
  --r-s:12px;--r:18px;--r-l:24px;
  --sh-1:0 1px 2px rgba(15,63,104,.06),0 1px 1px rgba(15,63,104,.04);
  --sh-2:0 2px 6px rgba(15,63,104,.06),0 10px 24px -8px rgba(15,63,104,.16);
  --f-head:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.fz-115{font-size:115%}html.fz-130{font-size:130%}
body{font-family:var(--f-body);font-size:1.125rem;line-height:1.5;color:var(--ink);background:var(--bone);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ── Barra superior ── */
.top{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;background:#fff;box-shadow:var(--sh-1);padding:3px}
.brand b{font-family:var(--f-head);font-weight:700;font-size:15px;line-height:1.15}
.brand small{display:block;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.top .sp{flex:1}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px 0 8px;margin-left:-8px;border:0;background:none;color:var(--navy);font-weight:600;font-size:1.05rem;cursor:pointer;border-radius:12px}
.back svg{width:24px;height:24px}
.who{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 12px 0 6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;cursor:pointer;font-weight:600;font-size:1rem;color:var(--navy);max-width:48vw}
.who i{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:14px;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html.fz-130 .brand span,html.fz-115 .brand span{display:none}
@media (min-width:430px){html.fz-115 .brand span{display:block}}

.demo-band{background:var(--warn-bg);color:#5C3A00;font-size:14px;font-weight:600;text-align:center;padding:8px 16px;border-bottom:1px solid #F0DDB4}
.off-band{background:#EEF1F4;color:var(--ink-2);font-size:14px;text-align:center;padding:8px 16px}

main{padding:8px 0 calc(var(--nav-h) + 32px + env(safe-area-inset-bottom))}
main.noNav{padding-bottom:40px}
.view{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Tipografía ── */
h1{font-family:var(--f-head);font-weight:700;font-size:1.75rem;line-height:1.2;letter-spacing:-.02em;color:var(--navy);margin:14px 0 6px}
h2{font-family:var(--f-head);font-weight:700;font-size:1.3rem;line-height:1.25;letter-spacing:-.01em;color:var(--navy);margin:28px 0 12px}
h3{font-family:var(--f-head);font-weight:700;font-size:1.15rem;color:var(--navy);line-height:1.3}
.lead{color:var(--ink-2);font-size:1.125rem}
.step{display:inline-block;font-weight:700;font-size:1rem;color:var(--blue);margin-top:12px}
.muted{color:var(--muted)}
.small{font-size:1rem}

/* ── Tarjetas ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:20px}
.card+.card{margin-top:12px}
.stack>*+*{margin-top:12px}

/* Boleto de la hora (con la fachada del centro de fondo, sello v4) */
.ticket{position:relative;background:linear-gradient(160deg,#134D7D 0%,var(--navy) 55%,var(--navy-2) 100%);color:#fff;border-radius:var(--r-l);padding:22px 20px 20px;box-shadow:var(--sh-2);overflow:hidden;isolation:isolate}
.ticket::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--facade,none) right 30%/cover no-repeat;opacity:.22;mix-blend-mode:luminosity}
.ticket::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(11,49,84,.96) 0%,rgba(15,63,104,.86) 55%,rgba(15,63,104,.55) 100%)}
.ticket .eyebrow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;color:#CFE9F0;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:1rem;border-radius:999px;padding:4px 12px;line-height:1.4}
.pill.today{background:var(--aqua);color:#06303F}
.pill.soon{background:rgba(255,255,255,.16);color:#fff}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--aqua-soft);color:#0B5563}
.ticket .when{font-family:var(--f-head);font-weight:700;font-size:1.6rem;line-height:1.2;margin-top:10px;letter-spacing:-.01em}
.ticket .hour{font-family:var(--f-head);font-weight:800;font-size:2.6rem;line-height:1.05;letter-spacing:-.02em;margin-top:2px}
.ticket .hour small{font-size:1.1rem;font-weight:600;opacity:.85;margin-left:6px}
.ticket .who-doc{margin-top:10px;font-size:1.125rem;color:#E8F3F8}
.ticket .who-doc b{display:block;color:#fff;font-weight:600}
.ticket .mod{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.3);font-size:1.05rem;color:#E8F3F8}
.ticket .mod svg{width:24px;height:24px;flex:none;margin-top:1px}
.ticket .btns{margin-top:18px}
.ticket .btn.light{background:#fff;color:var(--navy)}
.ticket .btn.ghostL{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
/* Inicio (ronda 4): boleto compacto — hora grande a la izquierda, día y profesional a la derecha */
.ticket.compact{padding:16px 18px 16px}
.tk-main{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;margin-top:8px}
.tk-main .hour{margin:0;font-size:2.5rem;flex:none}
.tk-main .tk-when{flex:1 1 150px;min-width:0;font-size:1.125rem;line-height:1.35;color:#E8F3F8}
.tk-main .tk-when b{display:block;font-family:var(--f-head);font-weight:700;font-size:1.15rem;color:#fff;line-height:1.25}
.tk-main .tk-lbl{display:block;font-size:1rem;font-weight:600;color:#CFE9F0}
.ticket.compact .eyebrow{font-size:1.125rem;color:#fff}.tk-date{font-family:var(--f-head);font-weight:700}
.ticket.compact .mod{margin-top:10px;padding-top:10px;font-size:1.125rem;align-items:center}
.ticket.compact .btns{margin-top:12px}
.tk-btns{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.tk-btns .btn{min-height:56px;padding:8px 10px;font-size:1.1rem}
html.fz-115 .tk-btns,html.fz-130 .tk-btns{grid-template-columns:1fr}
@media (max-width:374px){.tk-btns{grid-template-columns:1fr}}
.home-sec{margin-top:12px}

/* ── Botones ── */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:12px 20px;border-radius:16px;border:0;font-family:var(--f-head);font-weight:700;font-size:1.1rem;line-height:1.25;text-align:center;text-decoration:none;cursor:pointer;transition:transform .12s ease,background-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.985)}
.btn svg{width:24px;height:24px;flex:none}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(17,114,171,.6)}
.btn.aqua{background:var(--aqua);color:#06303F;box-shadow:0 6px 16px -6px rgba(79,190,206,.7)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line-2)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.wa{background:#1B8A53;color:#fff}
.btn.link{background:none;color:var(--bad);min-height:52px;text-decoration:underline;text-underline-offset:3px;font-family:var(--f-body);font-weight:600}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btns>*+*{margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{font-size:1rem;padding:10px 12px}

/* Lista de acciones */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;text-decoration:none;color:var(--ink);cursor:pointer}
.li:first-child{border-top:0}
.li:active{background:#FAF8F4}
.li .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--aqua-soft);color:var(--navy);font-family:var(--f-head);font-weight:700}
.li .ic svg{width:24px;height:24px}
.li .ic.nv{background:var(--navy);color:#fff}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:1.125rem;color:var(--navy)}
.li .tx span{display:block;font-size:1rem;color:var(--muted)}
.li .chev{width:22px;height:22px;color:#9AA6B0;flex:none}
.li.off{opacity:.6}
.date{width:64px;flex:none;text-align:center;border-radius:14px;background:var(--aqua-soft);color:var(--navy);padding:8px 0;line-height:1.1}
.date small{display:block;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.date b{display:block;font-family:var(--f-head);font-size:1.6rem;font-weight:800}
.grp{font-weight:700;color:var(--ink-2);font-size:1rem;margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.06em}

/* Notas */
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-s);padding:14px 16px;font-size:1.05rem;line-height:1.45}
.note svg{width:24px;height:24px;flex:none;margin-top:1px}
.note.info{background:var(--aqua-soft);color:#0B4552}
.note.warn{background:var(--warn-bg);color:#5C3A00}
.note.bad{background:var(--bad-bg);color:#7A1C14}
.note.ok{background:var(--ok-bg);color:#0B5536}
.note b{font-weight:700}

.kv{display:grid;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0;padding-top:0}
.kv dt{font-size:1rem;font-weight:600;color:var(--muted)}
.kv dd{font-size:1.125rem;color:var(--ink)}

/* Elección */
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:68px;padding:12px 18px;border-radius:16px;background:#fff;border:1.5px solid var(--line-2);text-align:left;cursor:pointer;color:var(--navy);text-decoration:none}
.choice b{font-family:var(--f-head);font-weight:700;font-size:1.15rem}
.choice span{color:var(--muted);font-size:1rem}
.choice[aria-pressed=true]{border-color:var(--blue);background:#EEF6FB;box-shadow:0 0 0 3px rgba(17,114,171,.18)}
.choice[disabled]{opacity:.6;cursor:not-allowed}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hours.multi{grid-template-columns:repeat(2,1fr)}
html.fz-130 .hours{grid-template-columns:repeat(2,1fr)}
.hour-b{min-height:58px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;font-family:var(--f-head);font-weight:700;font-size:1.2rem;color:var(--navy);cursor:pointer;padding:6px 4px;line-height:1.15}
.hour-b small{display:block;font-family:var(--f-body);font-weight:600;font-size:1rem;color:var(--muted);margin-top:2px}
.hour-b[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.group-t{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2);margin:18px 0 10px;font-size:1.05rem}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

/* Campos */
label.lbl{display:block;font-weight:700;color:var(--navy);margin:16px 0 6px;font-size:1.05rem}
.hint{font-size:1rem;color:var(--muted);margin-top:4px}
.inp{width:100%;min-height:60px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;padding:12px 16px;font-size:1.3rem;font-family:var(--f-head);font-weight:600;letter-spacing:.02em;color:var(--ink)}
.inp.sm{font-size:1.125rem;font-family:var(--f-body);font-weight:500;letter-spacing:0}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(17,114,171,.18)}
.inp[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 4px rgba(163,38,27,.12)}
.err{color:var(--bad);font-weight:600;font-size:1.02rem;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.check{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;font-size:1.02rem;line-height:1.45}
.check input{width:28px;height:28px;flex:none;accent-color:var(--blue);margin-top:1px}
.prefix{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:14px;background:#fff;overflow:hidden}
.prefix span{padding:0 4px 0 16px;font-family:var(--f-head);font-weight:600;font-size:1.2rem;color:var(--muted);white-space:nowrap}
.prefix .inp{border:0;box-shadow:none;min-height:58px;padding-left:6px}
.prefix:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(17,114,171,.18)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Ayuda */
.help{margin-top:28px}
.help .row2 .btn{min-height:56px}
.sos{margin-top:12px;text-align:center;font-size:1rem;color:var(--muted)}
.sos a{font-weight:700;color:var(--bad)}

.sk{background:linear-gradient(90deg,#ECE7DF 25%,#F4F0EA 37%,#ECE7DF 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:14px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Mediciones / exámenes: valores neutros, SIN semáforo */
.vrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0;padding-top:0}
.val{font-family:var(--f-head);font-weight:700;font-size:1.4rem;color:var(--navy)}
.val small{font-family:var(--f-body);font-size:1rem;font-weight:600;color:var(--muted)}
.icon-b{min-width:52px;min-height:52px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon-b svg{width:22px;height:22px}
.dx{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:1.125rem}
.dx:first-child{border-top:0;padding-top:0}
.dx i{width:10px;height:10px;border-radius:50%;background:var(--aqua);flex:none}

/* Acordeón nativo */
details.acc{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
details.acc+details.acc{margin-top:10px}
details.acc summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:68px;padding:14px 16px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary b{flex:1;font-family:var(--f-head);font-weight:700;font-size:1.1rem;color:var(--navy)}
details.acc summary small{display:block;font-family:var(--f-body);font-weight:600;font-size:1rem;color:var(--muted)}
details.acc summary .chev{transition:transform .2s;width:22px;height:22px;color:#9AA6B0;flex:none;transform:rotate(90deg)}
details.acc[open] summary .chev{transform:rotate(-90deg)}
details.acc .body{padding:0 16px 18px 16px}
details.acc ol{padding-left:22px}
details.acc ol li+li{margin-top:8px}

/* Banderas rojas */
.samu{display:flex;align-items:center;gap:14px;background:var(--bad);color:#fff;border-radius:var(--r);padding:16px 18px;text-decoration:none;box-shadow:0 8px 20px -10px rgba(163,38,27,.7)}
.samu b{display:block;font-family:var(--f-head);font-size:1.2rem}
.samu>span:first-child{flex:1}
.samu .call{flex:none;background:#fff;color:var(--bad);border-radius:999px;padding:10px 18px;font-family:var(--f-head);font-weight:800;font-size:1.2rem;white-space:nowrap}
.flag{border-left:6px solid var(--bad)}
.flag.pronto{border-left-color:#C77C00}
.flag .tag{display:inline-block;font-weight:700;font-size:1rem;border-radius:999px;padding:2px 10px;background:var(--bad-bg);color:var(--bad);margin-bottom:6px}
.flag.pronto .tag{background:var(--warn-bg);color:var(--warn)}
.flag .act{margin-top:10px;font-weight:700;color:var(--ink)}

/* Familia */
.tree{background:#FBFAF7;border:1px solid var(--line);border-radius:var(--r);padding:12px 6px 6px;background-image:radial-gradient(#E6DFD3 1px,transparent 1.2px);background-size:16px 16px}
.legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:1rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--navy);vertical-align:-2px;margin-right:6px}
.legend .c{border-radius:50%}.legend .r{border-color:var(--ok);border-width:3px;border-radius:50%}.legend .a{background:var(--aqua);border-radius:50%}
.mem{display:flex;gap:14px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:1.2rem;flex:none}
.ava.act{background:var(--aqua);color:#06303F}

/* Foto del centro */
.photo{border-radius:var(--r);overflow:hidden;background:#DCE6EE;aspect-ratio:4/3}
.photo img{width:100%;height:100%;object-fit:cover;object-position:right 30%}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--nav-h);text-decoration:none;color:#56636E;font-size:13px;font-weight:600;white-space:nowrap}

class NetErr extends Error{ constructor(kind,msg,status,data){ super(msg); this.kind=kind; this.status=status; this.data=data; } }
async function api(url, opts={}, timeout=15000){
  if (DEMO) throw new NetErr('demo','En el modo de ejemplo no se usa la red.');
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), timeout);
  let r;
  try{ r = await fetch(url, {credentials:'same-origin', ...opts, headers:{'Content-Type':'application/json', ...(opts.headers||{})}, signal:ctrl.signal}); }
  catch(e){ throw new NetErr(navigator.onLine===false?'offline':'timeout', navigator.onLine===false?'Su teléfono no tiene señal en este momento.':'La conexión está muy lenta. Intente de nuevo.'); }
  finally{ clearTimeout(t); }
  let data = null; try{ data = await r.json(); }catch(e){}
  if (r.ok) return data || {};
  const det = data && data.detail; const msg = typeof det==='string' ? det : (det && det.mensaje) || '';
  if (r.status===401) throw new NetErr('auth', msg||'Su sesión terminó.', 401, data);
  if (r.status===429) throw new NetErr('busy', msg||'Hay mucha gente consultando en este momento. Espere un minuto y vuelva a intentar.', 429, data);
  if (r.status>=500) throw new NetErr('server', msg||'El sistema de horas no respondió. Intente en unos minutos.', r.status, data);
  throw new NetErr('bad', msg||'No se pudo completar.', r.status, data);
}

const BACK = {resumen:'mediciones',remedios:'salud',remedio:'remedios',alarmas:'remedios',emergencia:'salud',fichaedit:'emergencia',toca:'salud',hora:'horas',editar:'datos',medir:'mediciones',agregar:'familia',mediciones:'salud',alertas:'salud',guias:'salud',consejos:'salud',

function renderTop(){
  const r = route(); const top=$('#top');
  if (!S.d){ top.hidden=true; return; }
  top.hidden=false;
  let left;
  const back = FLOW.has(r.name) || BACK[r.name];
  if (back && r.name!=='listo'){
    left = `<button class="back" onclick="goBack()">${ic('left')}Atrás</button>`;
  } else {
    left = `<a class="brand" href="#inicio" aria-label="Inicio, Centro Médico Carampangue"><img src="/static/isotipo.png" alt="" width="36" height="36"><span><small>Centro Médico</small><b>Carampangue</b></span></a>`;
  }
  const fam = members().length>1; const nm = first(S.d.nombre);
  $('#topIn').innerHTML = left + '<span class="sp"></span>' + `<button class="who" onclick="openPeople()" aria-label="Está viendo la ficha de ${esc(nm)}.${fam?' Cambiar de persona':''}"><i aria-hidden="true">${esc(initials(S.d.nombre))}</i><span>${esc(nm)}</span>${fam?ic('chev','style="width:18px;height:18px;transform:rotate(90deg)"'):''}</button>`;
}
let _navved = false;   // ¿ya navegamos dentro del portal? (si no, Atrás no debe sacar a la persona del sitio)
window.addEventListener('hashchange', ()=>{ _navved = true; });
function goBack(){ const r=route(); if(_navved){ history.back(); return; } go(BACK[r.name]||'inicio'); }
function renderNav(){
  const r = route(); const nav=$('#nav'); const main=$('#app');
  const show = S.d && !FLOW.has(r.name);
  nav.hidden = !show; main.classList.toggle('noNav', !show);
  if (!show) return;
  const cur = TAB_OF[r.name] || r.name;
  nav.innerHTML = `<div class="in">${TABS.map(([k,t,i])=>`<a href="#${k}" ${cur===k?'aria-current="page"':''}><span class="dot">${ic(i)}</span>${t}</a>`).join('')}</div>`;
}
function renderBands(){
  let h='';
  if (DEMO) h += `<div class="demo-band" role="note">Modo de ejemplo · Datos inventados · Nada se guarda ni se envía</div>`;
  if (S.offline) h += `<div class="off-band" role="status">Sin señal: le mostramos lo último guardado en este teléfono.</div>`;

/* Adulto representado SIN verificar: solo ve las horas que usted le agendó. */
function restringido(){ return !!(S.d && S.d.acceso==='solo_horas_agendadas'); }
const SOLO_VERIFICADOS = ['resumen','salud','mediciones','medir','alertas','docs','datos','editar','remedios','remedio','alarmas','emergencia','fichaedit','toca'];
function avisoVinculo(){
  return `<div class="note info" role="note">${ic('warn')}<div><b>Vínculo sin verificar.</b> Por privacidad, de ${esc(first((S.d&&S.d.nombre)||'')||'esta persona')} solo puede ver y gestionar las horas que usted le agendó. Para ver más, verifiquen el vínculo en recepción o con un código a su WhatsApp.</div></div>
    <div class="btns" style="margin-top:14px"><a class="btn sec" href="#agregar">Verificar con un código</a>
    <a class="btn sec" href="${wa('Hola, quiero verificar mi vínculo con un familiar adulto en el portal.')}" target="_blank" rel="noopener">Consultar por WhatsApp</a></div>`;
}
function render(){
  renderBands();
  if (!S.d){ $('#top').hidden=true; $('#nav').hidden=true; return; }
  renderTop(); renderNav();
  const r = route(); const V = VIEWS[r.name] || VIEWS.inicio;
  let html; try{ html = (restringido() && SOLO_VERIFICADOS.includes(r.name)) ? `<h1>Información protegida</h1>${avisoVinculo()}` : V(r); }catch(e){ console.error(e); html = `<h1>Algo no funcionó</h1>${errorBlock(e,'render()')}`; }
  if (html==null) return;
  $('#app').innerHTML = `<div class="wrap view">${html}</div>`;
  const key = location.hash;
  if (key !== render._last){ render._last = key; const h1 = $('#app h1'); if (h1){ h1.setAttribute('tabindex','-1'); h1.focus({preventScroll:true}); } }
  if (V.after) V.after(r);
  applyFacade();
}
let _facadeOk=false;
function applyFacade(){ if(_facadeOk){ document.querySelectorAll('.ticket').forEach(t=>t.style.setProperty('--facade','url('+STATIC+'fachada-720.webp)')); return; }
  const im=new Image(); im.onload=()=>{ _facadeOk=true; applyFacade(); }; setTimeout(()=>{ im.src=STATIC+'fachada-720.webp'; }, 600); }

}
function errorBlock(e, retry, ctx){

const skel = (n=3,h=72) => `<div class="stack" aria-busy="true">${('<div class="sk" style="height:'+h+'px"></div>').repeat(n)}</div>`;

/* ════════════════════════════════════════════════════════════════════
   INICIO: solo la próxima hora, grande
   ═══════════════════════════════════════════════════════════════════ */
function ticketHTML(c, opts={}){
  const n = daysFrom(c.fecha); const mod = modalidad(c);
  if (opts.compact) return ticketCompact(c, n, mod, opts);
  const pill = n===0 ? '<span class="pill today">Hoy</span>' : n===1 ? '<span class="pill soon">Mañana</span>' : n!=null && n<=30 ? `<span class="pill soon">En ${n} días</span>` : '';
  const modTxt = mod==='video' ? `${ic('video')}<span><b>Teleconsulta por videollamada.</b> Le enviamos el link de Medilink por WhatsApp antes de la hora. No necesita instalar nada.</span>`
    : mod==='eleccion' ? `${ic('info')}<span>Presencial o por videollamada, según lo que usted eligió. Si es videollamada, el link le llega por WhatsApp.</span>`
    : `${ic('pin')}<span>${DIRECCION}<br><span style="opacity:.85">Llegue 10 minutos antes con su cédula${/kine|masoter/i.test(c.especialidad||'')?' y ropa cómoda':''}.</span></span>`;
  return `<article class="ticket" aria-label="Hora de ${esc(c.especialidad)}">
    <div class="eyebrow">${opts.label||'Su próxima hora'} ${pill}</div>
    <div class="when">${fLarga(c.fecha,true)}</div>
    <div class="hour">${esc(hhmm(c.hora_inicio))}<small>hrs</small></div>
    <div class="who-doc"><b>${esc(c.especialidad)}</b>${esc(c.profesional)}</div>
    <div class="mod">${modTxt}</div>
    ${opts.btns?`<div class="btns">${opts.btns}</div>`:''}</article>`;
}
/* Boleto compacto de Inicio: misma información esencial en ~la mitad de alto, para que
   debajo se vean los resultados nuevos y la familia sin hacer scroll (390×844). */
function ticketCompact(c, n, mod, opts){
  const d = pDate(c.fecha);
  const pill = n===0 ? '<span class="pill today">Hoy</span>' : n===1 ? '<span class="pill soon">Mañana</span>' : n!=null && n<=30 ? `<span class="pill soon">En ${n} días</span>` : '';
  const fecha = d ? DIAS[d.getDay()].charAt(0).toUpperCase()+DIAS[d.getDay()].slice(1)+' '+d.getDate()+' de '+MESES[d.getMonth()] : esc(c.fecha);
  const modTxt = mod==='video' ? `${ic('video')}<span>Por videollamada · link por WhatsApp</span>`
    : mod==='eleccion' ? `${ic('info')}<span>Presencial o videollamada</span>`
    : `${ic('pin')}<span>Monsalve 102, Carampangue</span>`;
  return `<article class="ticket compact" aria-label="${esc(opts.label||'Su próxima hora')}: ${esc(c.especialidad)}, ${esc(fecha)} a las ${esc(hhmm(c.hora_inicio))}">
    <div class="eyebrow">${pill}<span class="tk-date">${esc(fecha)}</span></div>
    <div class="tk-main"><div class="hour">${esc(hhmm(c.hora_inicio))}<small>hrs</small></div>
      <div class="tk-when"><span class="tk-lbl">${esc(opts.label||'Su próxima hora')}</span><b>${esc(c.especialidad)}</b>${esc(c.profesional)}</div></div>
    <div class="mod">${modTxt}</div>
    ${opts.btns?`<div class="btns">${opts.btns}</div>`:''}</article>`;
}
const checkinKey = c => 'cmc_app_ci_'+c.fecha+'_'+(c.id||'');
const VIEWS = {};
VIEWS.inicio = () => {
  const cs = citas(); const c = cs[0]; const nm = first(S.d.nombre);
  const h = new Date().getHours(); const sal = h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
  let main;
  if (c){
    const hoy = daysFrom(c.fecha)===0; const done = load(checkinKey(c));
    let btns = '';
    if (hoy && !done) btns = `<div class="tk-btns"><button class="btn light" onclick="checkin('${esc(c.id)}')">Sí, voy a mi hora</button><button class="btn ghostL" onclick="go('hora/${esc(c.id)}')">Ver detalle</button></div>`;
    else btns = (hoy?`<div class="note ok" style="margin-bottom:10px">${ic('check')}<div><b>Recepción ya sabe que viene.</b></div></div>`:'')
      + `<button class="btn light" onclick="go('hora/${esc(c.id)}')">Ver detalle, cambiar o anular</button>`;
    main = ticketHTML(c, {btns, compact:true});
  } else {
    const ult = (S.d.historial||[]).find(h=>estadoCita(h)!=='no_vino');

      <div class="btns"><button class="btn light" onclick="startAgendar()">${ic('plus')}Pedir una hora</button></div></div>`;
  }

    ${S.d.is_dependent?`<p class="lead">Está viendo la ficha de <b>${esc(S.d.nombre)}</b>. <a href="#" onclick="switchTo('${jsq(S.d.owner_rut)}');return false">Volver a la suya</a></p>`:''}

    <div style="margin-top:12px">${main}</div>
    ${pendienteCard()}
    ${familiaRow()}
    ${c?`<button class="btn aqua" style="margin-top:16px" onclick="startAgendar()">${ic('plus')}Pedir una hora nueva</button>`:''}
    ${otras>0?`<a class="btn sec" style="margin-top:10px" href="#horas">${otras===1?'Ver mi otra hora':'Ver mis otras '+otras+' horas'}</a>`:''}
    ${pas.length?`<h2 style="margin-top:24px">Hoy</h2>${pas.map(pasadaHTML).join('')}`:''}
    <p class="sos" style="margin-top:22px">¿Es una emergencia? No use el portal: <a href="tel:131">llame al SAMU 131</a></p>`;
};

/* Hora de hoy que ya pasó, con el desenlace REAL de Medilink (docs/medilink_gotchas.md §11):
   2 Atendido · 5/6 en sala/atendiéndose · 8 No asiste · el resto = recepción aún no la cierra. */
function pasadaHTML(c){
  const st = estadoCita(c); const hr = esc(hhmm(c.hora_inicio)); const esp = esc(c.especialidad); const pc = esc(profCorto(c.profesional));
  if (st==='atendida'){
    const exs = Array.isArray(S.exams) ? S.exams.filter(e=>String(e.fecha||'').slice(0,10)===String(c.fecha).slice(0,10)) : [];
    const imagen = /ecograf|oftalmo|tecnolog/i.test(c.especialidad||'');
    const ctrl = imagen ? '' : `<button class="btn sec" onclick="repetir('${jsq(c.especialidad)}','${jsq(c.profesional)}')">${/kine|masoter|fonoaud|psicol|nutri/i.test(c.especialidad||'')?'Pedir la próxima sesión':'Pedir control'} con ${pc}</button>`;
    return `<div class="past ok" role="note">${ic('check')}<div><p><b>${esp}, ${hr} hrs: atendida.</b></p>
      ${exs.length?`<a class="btn sec" href="#docs">${ic('doc')}Ver ${exs.length===1?'el resultado':'los '+exs.length+' resultados'} de ese día</a>`
        :`<p class="muted">Si le pidieron exámenes o un informe, aparecerán en <a href="#docs">Exámenes y documentos</a> cuando el centro los publique.</p>`}
      ${ctrl?`<p class="muted" style="margin-top:8px">Si su profesional le indicó volver:</p>${ctrl}`:''}</div></div>`;
  }
  if (st==='no_vino') return `<div class="past info" role="note">${ic('info')}<div><p><b>${esp}, ${hr} hrs: quedó registrada como «no asistió».</b></p>
      <p>¿Quiere pedir otra hora?</p>
      <button class="btn pri" onclick="repetir('${jsq(c.especialidad)}','${jsq(c.profesional)}')">Pedir otra hora con ${pc}</button>
      <p class="muted small" style="margin-top:8px">¿Sí vino? <a href="${wa('Hola, mi hora de '+c.especialidad+' de hoy a las '+hhmm(c.hora_inicio)+' aparece como no asistida, pero sí fui.')}" target="_blank" rel="noopener">Avísenos por WhatsApp</a> y lo corregimos.</p></div></div>`;
  if (st==='en_curso') return `<div class="past" role="note">${ic('clock')}<div><p><b>${esp}, ${hr} hrs: su atención está en curso.</b></p></div></div>`;
  return `<div class="past" role="note">${ic('clock')}<div><p><b>${esp}, ${hr} hrs: esta hora ya pasó.</b></p><p class="muted">Recepción todavía no la cierra en el sistema. Más tarde aparecerá aquí cómo quedó.</p></div></div>`;
}
/* Inicio: UNA sola tarjeta de pendiente real (examen nuevo > remedios de hoy > qué le toca) */
function examNuevos(){ if(!Array.isArray(S.exams)) return 0; const seen=new Set(load('cmc_exseen_'+activeRut())||[]); return S.exams.filter(e=>!seen.has(String(e.id))).length; }
function pendienteCard(){
  if (restringido()) return '';

  if (n) return `<a class="tool-teaser" style="margin-top:12px" href="#docs"><span class="ic" style="background:var(--bad-bg);color:var(--bad)">${ic('doc')}</span><span class="tx"><b>${n===1?'Tiene un resultado nuevo':'Tiene '+n+' resultados nuevos'}</b><span>Toque para verlo${n===1?'':'s'}</span></span>${chev()}</a>`;

/* Inicio: la familia en una sola tarjeta compacta (de la v4) */
function familiaRow(){
  const ms = members().filter(m=>rutClean(m.rut)!==activeRut()); if (!ms.length) return '';
  const row = m => { const p=m.proxima; return `<button class="fr" onclick="openPersona('${jsq(m.rut)}')"><span class="ava" aria-hidden="true">${esc(initials(m.nombre))}</span><span class="tx"><b>${esc(first(m.nombre))}${rutClean(m.rut)===ownerRut()?' (usted)':''}</b><span>${p?esc(p.especialidad)+' · '+fCorta(p.fecha)+' · '+esc(hhmm(p.hora_inicio)):'Sin horas próximas'}</span></span>${chev()}</button>`; };
  return `<h2 style="margin-top:20px;margin-bottom:10px">Mi familia</h2><div class="card famcard">${ms.slice(0,4).map(row).join('')}</div>
    ${ms.length>4?`<a class="btn sec" style="margin-top:10px" href="#familia">Ver a toda la familia</a>`:''}`;
}

/* ── Buscador de días y horas (lo usan "Cambiar" y "Pedir hora") ── */
async function getSlots(idProf, fecha){
  let arr, mod='presencial';
  if (DEMO){ await loadScript(STATIC+'demo.js'); await sleep(120); arr = window.CMC_DEMO_SLOTS(idProf, fecha); mod = TELE_SIEMPRE.has(idProf)||(TELE_DIAS[idProf]&&TELE_DIAS[idProf].includes(pDate(fecha).getDay())) ? 'online':'presencial'; }
  else { const r = await api('/agendar/api/slots?id_prof='+idProf+'&fecha='+fecha, {}, 20000); arr = r.slots||[]; mod = r.modalidad||'presencial'; }
  const prof = (S.catMap[idProf]&&profName(idProf)) || '';
  let out = arr.map(s=>({hora_inicio:hhmm(s.hora_inicio), hora_fin:hhmm(s.hora_fin), id_profesional:+(s.id_profesional||idProf), profesional:s.profesional||prof, fecha:fecha, modalidad:mod}));
  if (fecha===iso(today())){ const n=new Date(); const lim=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); out=out.filter(s=>s.hora_inicio>lim); }
  return out;
}
function profName(id){ for(const g of (S.cat||[])) for(const e of g.especialidades) for(const p of (e.profesionales||[])) if(+p.id===+id) return p.nombre; return ''; }
/* f = {ids:[…], days:null|{list,more}|{error}, slots:{fecha:[…]}} */
async function loadDays(f, onUpdate){
  if (f.days || f._loading) return; f._loading=true;
  f.days = {list:[], more:true};
  const fechas=[]; for(let i=0;i<24 && fechas.length<16;i++){ const d=dAdd(i); if(d.getDay()!==0) fechas.push(iso(d)); }
  let fails=0, busy=false;
  const step = async fe => {
    const res = await Promise.all(f.ids.map(id=>getSlots(id,fe).catch(e=>{ fails++; if(e.kind==='busy') busy=true; if(e.kind==='auth') toLogin(); return []; })));
    const all = res.flat().sort((a,b)=>a.hora_inicio.localeCompare(b.hora_inicio));
    f.slots[fe]=all; if(all.length){ f.days.list.push(fe); f.days.list.sort(); }
  };
  try{
    for (let i=0;i<fechas.length;i+=(f.ids.length>1?2:3)){
      await Promise.all(fechas.slice(i,i+(f.ids.length>1?2:3)).map(step));
      if (f.dead) return; onUpdate();
      if (f.days.list.length>=6) break;
    }
    f.days.more=false;
    if (!f.days.list.length && fails) f.days = {error: busy?'Hay mucha gente consultando horas en este momento. Espere un minuto y vuelva a intentar.':'No pudimos revisar las horas libres. Revise su señal e intente de nuevo.'};
    onUpdate();
  } finally { f._loading=false; }
}

  if (!days.list.length && !days.more) return `<div class="note info">${ic('info')}<div><b>No encontramos horas libres en las próximas semanas.</b><br>Le podemos avisar por WhatsApp apenas se libere una.</div></div>

  if (!days.list.length) return skel(3,68)+`<p class="muted small" style="margin-top:10px">Buscando días con horas libres…</p>`;

function startAgendar(o={}){

  track('wiz_abre');

}
function agPersona(){ const a=S.ag; const m = a && a.quien ? (memberByRut(a.quien) || {rut:a.quien,nombre:S.d.nombre,sexo:S.d.sexo,edad:edadDe(S.d.fecha_nacimiento)}) : null;
  if (m && m.edad==null && rutClean(m.rut)===activeRut()) m.edad=edadDe(S.d.fecha_nacimiento); if (m && !m.sexo && rutClean(m.rut)===activeRut()) m.sexo=S.d.sexo; return m; }
function agRegla(esp, m){
  if (!m) return null; const r = EDAD[esp.especialidad]; const n = first(m.nombre);
  if (r && m.edad!=null){
    if (r.min && m.edad < r.min) return {msg: esp.especialidad+' atiende desde los '+r.min+' años.'+(r.alt?' Para '+n+' corresponde '+r.alt+'.':''), alt:r.alt};
    if (r.max && m.edad > r.max) return {msg: esp.especialidad+' es hasta los '+r.max+' años.'+(r.alt?' Para '+n+' corresponde '+r.alt+'.':''), alt:r.alt};
  }
  if (SOLO_MUJER.has(esp.especialidad) && m.sexo && !String(m.sexo).toUpperCase().startsWith('F')) return {msg: esp.especialidad+' atiende solo a mujeres.'};
  return null;
}

function buildControles(){
  const last={}, next={};
  for (const h of (S.d.historial||[])){ if(estadoCita(h)==='no_vino') continue; const e=(h.especialidad||'').trim(); if(e && (!last[e]||h.fecha>last[e].fecha)) last[e]=h; }
  for (const c of citas()){ const e=(c.especialidad||'').trim(); if(e && (!next[e]||c.fecha<next[e].fecha)) next[e]=c; }
  return [...new Set([...Object.keys(next),...Object.keys(last)])].map(e=>({esp:e,last:last[e]||null,next:next[e]||null}))
    .sort((a,b)=> (!!b.next-!!a.next) || ((b.last?b.last.fecha:'')>(a.last?a.last.fecha:'')?1:-1));
}

function vChart(t, list){

  const X=i=>P+i*(W-2*P)/(pts.length-1), Y=v=>P+ (H-2*P)*(1-(v-lo)/(hi-lo));

  const dots = k => pts.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v[k]).toFixed(1)}" r="3.5" fill="#fff" stroke="#1172AB" stroke-width="2"/>`).join('');

async function agSubmit(ev){

  const b=$('#aBtn'); b.disabled=true; b.textContent='Un momento…';
  try{

async function agVerify(ev){
  ev.preventDefault(); const code=($('#aotp').value||'').replace(/\D/g,''); if(code.length!==6){ AG.err='El código tiene 6 números.'; return render(); }

}

/* ════════════════════════════════════════════════════════════════════
   Entrada: RUT → código por WhatsApp (o link)

const L_ = {step:'rut', rut:'', masked:'', err:'', sent:0};
function toLogin(msg){ S.d=null; L_.step='rut'; L_.err=msg||''; renderLogin(); }
function renderLogin(){
  $('#top').hidden=true; $('#nav').hidden=true; renderBands();
  let body;
  if (L_.step==='rut') body = `
    <h1 style="font-size:2rem">Mis horas en el centro médico</h1>

      <p class="hint" id="rutH">Con puntos o sin puntos. Si termina en K, escríbala.</p>
      <div id="rutE">${L_.err?`<p class="err" role="alert">${ic('warn','style="width:22px;height:22px;flex:none"')}<span>${esc(L_.err)}</span></p>`:''}</div>
      <div class="btns" style="margin-top:20px"><button class="btn pri" id="lgBtn" type="submit">${ic('wa')}Recibir mi código por WhatsApp</button>
        <button class="btn sec" type="button" onclick="pedirLink()">Prefiero un link para entrar</button></div></form>
    <p class="muted small" style="margin-top:16px">Le enviamos un mensaje al WhatsApp que tiene registrado en el centro.</p>
    <p style="margin-top:14px"><a href="?demo=1" style="font-weight:600">Ver un ejemplo con datos inventados</a></p>`;
  else if (L_.step==='code') body = `
    <span class="step">Paso 2 de 2</span><h1>Escriba el código que le llegó</h1>
    <p class="lead">Lo enviamos por WhatsApp${L_.masked?' a la ficha del RUT '+esc(L_.masked):''}. Son 6 números.</p>
    <form onsubmit="verificar(event)" novalidate style="margin-top:18px">
      <label class="lbl sr" for="otp">Código de 6 números</label>
      <input id="otp" class="inp otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" aria-describedby="otpE" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6); if(this.value.length===6) verificar()">
      <div id="otpE">${L_.err?`<p class="err" role="alert">${ic('warn','style="width:22px;height:22px;flex:none"')}<span>${esc(L_.err)}</span></p>`:''}</div>
      <div class="btns" style="margin-top:20px"><button class="btn pri" id="otpBtn" type="submit">Entrar</button>
      <button class="btn sec" type="button" id="resend" onclick="pedirCodigo()" disabled>Enviar otro código</button>
      <button class="btn sec" type="button" onclick="L_.step='rut';L_.err='';renderLogin()">Cambiar el RUT</button></div></form>
    <p class="muted small" style="margin-top:14px">El código vence en 10 minutos.</p>`;
  else body = `<div class="done-ic">${ic('wa')}</div><h1>Revise su WhatsApp</h1>
    <p class="lead">Le enviamos un link. Tóquelo y entra directo, sin código. Vence en 30 minutos.</p>
    <div class="btns" style="margin-top:20px"><button class="btn sec" onclick="L_.step='rut';renderLogin()">Volver</button></div>`;
  $('#app').classList.add('noNav');
  $('#app').innerHTML = `<div class="wrap login view"><div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><img class="logo" src="/static/isotipo.png" alt="" width="64" height="64"><p style="font-family:var(--f-head);font-weight:700;color:var(--navy);line-height:1.2">Centro Médico<br>Carampangue</p></div>${body}
    <div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--line)"><p class="small muted">¿No le llega el mensaje o no tiene WhatsApp registrado?</p>
    <div class="row2" style="margin-top:10px"><a class="btn sec" href="${wa('Hola, quiero activar mi portal del paciente.')}" target="_blank" rel="noopener">${ic('wa')}WhatsApp</a><a class="btn sec" href="tel:${FIJO_TEL}">${ic('phone')}Llamar</a></div>
    <p class="sos">¿Es una emergencia? Llame al <a href="tel:131">SAMU 131</a></p></div></div>`;
  const inp = $('#rut')||$('#otp'); inp && setTimeout(()=>inp.focus(),60);
  if (L_.step==='code'){ const rb=$('#resend'); const tick=()=>{ if(!document.body.contains(rb)) return; const w=Math.max(0,30-Math.floor((Date.now()-L_.sent)/1000)); rb.textContent=w?'Enviar otro código (en '+w+' s)':'Enviar otro código'; rb.disabled=!!w; if(w) setTimeout(tick,1000); }; tick(); }

function rutInput(el){ el.value = rutFmt(el.value).slice(0,12); L_.rut = rutClean(el.value); if(L_.err){ L_.err=''; $('#rutE').innerHTML=''; el.removeAttribute('aria-invalid'); } }
async function pedirCodigo(ev){
  ev && ev.preventDefault && ev.preventDefault();
  const e = rutMsg(L_.rut); if (e){ L_.err=e.replace('la cédula','su cédula'); return renderLogin(); }
  const b = $('#lgBtn')||$('#resend'); if(b){ b.disabled=true; b.textContent='Enviando…'; }
  try{ const r = await apiLogin('/portal/api/request-code',{rut:rutApi(L_.rut)}); L_.masked = r.rut_masked||''; L_.step='code'; L_.err= r.demo&&r.hint ? r.hint : ''; L_.sent=Date.now(); renderLogin(); say('Código enviado por WhatsApp.'); }
  catch(x){ L_.err = loginMsg(x); renderLogin(); }
}
async function pedirLink(){
  const e = rutMsg(L_.rut); if (e){ L_.err=e; return renderLogin(); }
  try{ const r = await apiLogin('/portal/api/request-link',{rut:rutApi(L_.rut)}); track('magic_link_pide'); if(r.demo){ L_.err=r.hint||''; L_.step='code'; L_.sent=Date.now(); } else L_.step='link'; renderLogin(); }
  catch(x){ L_.err = loginMsg(x); renderLogin(); }
}
async function verificar(ev){
  ev && ev.preventDefault && ev.preventDefault();
  const code = ($('#otp').value||'').replace(/\D/g,''); if (code.length!==6){ L_.err='El código tiene 6 números.'; return renderLogin(); }
  const b=$('#otpBtn'); if(b){ b.disabled=true; b.textContent='Entrando…'; }
  try{ await apiLogin('/portal/api/verify-code',{rut:rutApi(L_.rut), code}); L_.err=''; await boot(); }
  catch(x){ L_.err = x.status===401 ? 'Ese código no es correcto o ya venció. Revíselo o pida otro.' : loginMsg(x); renderLogin(); }
}
async function apiLogin(url, body){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),20000); let r;
  try{ r = await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal}); }
  catch(e){ throw new NetErr('offline','No hay conexión. Revise su señal e intente de nuevo.'); } finally{ clearTimeout(t); }
  let d=null; try{ d=await r.json(); }catch(e){}
  if (r.ok) return d||{};
  throw new NetErr('bad', (d&&typeof d.detail==='string'&&d.detail)||'', r.status, d);
}
function loginMsg(x){
  if (x.status===404) return x.message && /WhatsApp/.test(x.message) ? 'Su RUT está en el centro, pero aún no tiene WhatsApp registrado. Escríbanos al +56 9 6661 0737 y lo activamos.' : 'No encontramos ese RUT en el centro. Revíselo, o escríbanos si es su primera vez.';
  if (x.status===429) return 'Pidió varios códigos seguidos. Espere unos minutos y vuelva a intentar.';
  if (x.status===400) return 'Revise el RUT: algún número no calza.';
  return x.message || 'No pudimos enviar el mensaje. Intente de nuevo en un momento.';
}
async function logout(){
  try{ if(!DEMO) await fetch('/portal/api/logout',{method:'POST',credentials:'same-origin'}); }catch(e){}
  store('cmc_app_citas'); store(VQ); try{ sessionStorage.clear(); Object.keys(localStorage).filter(k=>/^cmc_(rem|tomas|toca)_/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  if (DEMO){ location.href = location.pathname; return; }
  history.replaceState(null,'',location.pathname); S.d=null; toLogin();
}

(function(){ const fz=load('cmc_app_fz'); if(fz&&fz!=='100') document.documentElement.classList.add('fz-'+fz); })();
if (!DEMO && 'serviceWorker' in navigator && location.pathname.startsWith('/portal/')) { try{ navigator.serviceWorker.register('/portal/sw.js',{scope:'/portal/'}).catch(()=>{}); }catch(e){} }
async function boot(){
  try{
    await loadAll(); S.offline=false;
    if (!location.hash) history.replaceState(null,'','#inicio');
    if (Q.get('action')==='agendar' || location.hash==='#agendar'){ history.replaceState(null,'','#inicio'); render(); startAgendar(); return; }
    render();
    setTimeout(()=>{ if(restringido()) return; loadScript(STATIC+'herramientas.js').then(()=>CMC_H.precargar()).catch(()=>{});
      if (S.exams==null && !DEMO) api('/portal/api/examenes').then(r=>{ S.exams=r.examenes||[]; if(route().name==='inicio') render(); }).catch(()=>{}); }, 400);
  }catch(e){
    if (e.kind==='auth' || (e.status===404 && e.kind==='bad')){ toLogin(e.status===404?'No encontramos su ficha. Escríbanos por WhatsApp y lo revisamos.':''); return; }
    const c = load('cmc_app_citas');
    if ((e.kind==='offline'||e.kind==='timeout') && c){ S.offline=true; track('offline'); S.d={nombre:c.nombre, rut:c.rut, citas_futuras:c.citas, historial:[], diagnosticos:[], demo:false}; S.family=[]; S.links=[]; S.vitals=[]; S.exams=[]; render(); return; }
    $('#top').hidden=true; $('#nav').hidden=true; renderBands();
    $('#app').innerHTML = `<div class="wrap view" style="padding-top:40px"><h1>No pudimos abrir su portal</h1>${errorBlock(e,'boot()')}</div>`;
  }
}
boot();
