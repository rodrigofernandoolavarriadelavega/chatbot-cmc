<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Médico y Dental Carampangue · Sala de Espera</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   CENTRO MÉDICO Y DENTAL CARAMPANGUE · Pantalla de sala de espera
   Estilo CÁLIDO y CERCANO · zona rural de Arauco · luz de día de campo
   Logos reales embebidos · 100% autocontenido (funciona offline)
   ══════════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap');

:root{
  --sky:#E3F1F9; --cream:#FBF6EE; --paper:#ffffff;
  --aqua:#4FBECE; --aqua-deep:#2C9DB0; --blue:#1172AB; --navy:#0F3F68;
  --wood:#9a6f4e; --green:#7FB069; --green-soft:#A7CE8E;
  --coral:#EE8B6B; --amber:#F4C25E;
  --text:#234055; --mute:#6E879A;
  --shadow:0 22px 50px rgba(15,63,104,.10);
  --shadow-sm:0 8px 22px rgba(15,63,104,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--cream);
  font-family:'Nunito',-apple-system,sans-serif;color:var(--text);
  -webkit-font-smoothing:antialiased;cursor:none}

/* ── Fondo: cielo de día cálido + sol suave ───────────────────────── */
.bg{position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#E3F1F9 0%,#EEF6F4 38%,#FBF6EE 100%)}
.sun{position:fixed;top:-10vh;right:-6vw;width:46vh;height:46vh;z-index:0;border-radius:50%;
  background:radial-gradient(circle,rgba(244,194,94,.55),rgba(244,194,94,.12) 45%,transparent 70%);
  filter:blur(6px);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
.cloud{position:fixed;z-index:0;background:#fff;border-radius:50%;opacity:.85;
  filter:blur(2px);box-shadow:0 8px 30px rgba(15,63,104,.05)}
.blob{position:fixed;z-index:0;border-radius:50%;filter:blur(60px);opacity:.5;mix-blend-mode:multiply}
.blob.b1{width:40vw;height:40vw;left:-8vw;top:30vh;background:radial-gradient(circle,#cfeaf0,transparent 65%);animation:float1 26s ease-in-out infinite alternate}
.blob.b2{width:34vw;height:34vw;right:-6vw;bottom:18vh;background:radial-gradient(circle,#fde6d6,transparent 65%);animation:float2 30s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(6vw,-4vh)}}
@keyframes float2{to{transform:translate(-5vw,3vh)}}

/* ── Colinas (Arauco) abajo, sobre el ticker ──────────────────────── */
.hills{position:fixed;left:0;right:0;bottom:6.4vh;z-index:1;width:100%;height:22vh;pointer-events:none}
.hills svg{width:100%;height:100%;display:block}

/* ── Topbar ───────────────────────────────────────────────────────── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:12;
  display:flex;align-items:center;justify-content:space-between;padding:3vh 5vw 0}
.topbar .logo img{height:6vh;display:block;filter:drop-shadow(0 6px 14px rgba(15,63,104,.12))}
.clock{text-align:right;line-height:1}
.clock .t{font-size:3.4vh;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.clock .t .sec{color:var(--aqua-deep);font-weight:600}
.clock .d{font-size:1.5vh;font-weight:600;color:var(--mute);text-transform:capitalize;margin-top:.5vh}

/* ── Stage / panels ───────────────────────────────────────────────── */
.stage{position:fixed;inset:0;z-index:6}
.panel{position:absolute;inset:13vh 8vw 11vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  opacity:0;transform:translateY(14px);visibility:hidden;
  transition:opacity 1.1s ease,transform 1.1s ease;pointer-events:none}
.panel.active{opacity:1;transform:translateY(0);visibility:visible;
  transition:opacity 1.2s ease .7s,transform 1.3s cubic-bezier(.2,.7,.2,1) .7s,visibility 0s}
/* la bienvenida (foto pantalla completa) se disuelve aún más lento hacia el fondo claro */
.panel.welcome{transition:opacity 1.8s ease,transform 1.1s ease}

.kicker{font-size:1.7vh;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--aqua-deep);margin-bottom:2.4vh;opacity:0}
.panel.active .kicker{animation:rise .8s .5s forwards}
.title{font-family:'Quicksand';font-size:7vh;font-weight:700;line-height:1.08;letter-spacing:-.01em;
  color:var(--navy);max-width:20ch;text-wrap:balance;opacity:0}
.panel.active .title{animation:rise .9s .65s forwards}
.title .hl{color:var(--aqua-deep)}
.subtitle{font-size:2.7vh;font-weight:500;color:var(--mute);margin-top:2.6vh;max-width:34ch;
  line-height:1.55;opacity:0}
.panel.active .subtitle{animation:rise .9s .85s forwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* Bienvenida: isotipo real con halo cálido */
.medallion{position:relative;width:23vh;height:23vh;display:grid;place-items:center;margin-bottom:2.6vh;opacity:0}
.panel.active .medallion{animation:pop 1.1s .2s cubic-bezier(.2,.9,.3,1.2) forwards}
.medallion::before{content:"";position:absolute;inset:-8%;border-radius:50%;
  background:radial-gradient(circle,rgba(79,190,206,.22),rgba(244,194,94,.14) 55%,transparent 72%);
  animation:breathe 7s ease-in-out infinite}
.medallion .disc{position:absolute;inset:4%;border-radius:50%;background:var(--paper);
  box-shadow:0 20px 50px rgba(15,63,104,.14),inset 0 0 0 6px rgba(255,255,255,.9)}
.medallion img{position:relative;width:58%;filter:drop-shadow(0 6px 12px rgba(15,63,104,.14));animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

/* Bienvenida: foto real del edificio a pantalla completa (solo este panel) */
.welcome-hero{position:absolute;inset:-13vh -8vw -11vh;z-index:0;
  background-size:cover;background-position:center 42%;opacity:0;transform:scale(1.06)}
.panel.active .welcome-hero{animation:heroin 1.4s ease forwards,herozoom 22s ease-out 1.4s forwards}
.welcome-hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(8,40,66,.28) 0%,rgba(8,40,66,.40) 45%,rgba(8,40,66,.82) 100%),
  radial-gradient(120% 90% at 50% 30%,transparent 40%,rgba(8,40,66,.35) 100%)}
@keyframes heroin{from{opacity:0}to{opacity:1}}
@keyframes herozoom{from{transform:scale(1.06)}to{transform:scale(1)}}
/* texto del panel bienvenida sobre la foto → claro */
.panel.welcome .kicker{color:#bfeaf4}
.panel.welcome .title{color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.panel.welcome .title .hl{color:#8fe3f1}
.panel.welcome .subtitle{color:rgba(255,255,255,.92);text-shadow:0 2px 14px rgba(0,0,0,.4)}

/* Cards cálidas (blancas, muy redondeadas, sombra suave) */
.soft{background:var(--paper);border-radius:28px;box-shadow:var(--shadow)}

/* Especialidades */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4vh 1.8vw;width:100%;max-width:1500px;margin-top:1vh}
.svc{padding:3.4vh 1.4vw 3vh;display:flex;flex-direction:column;align-items:center;gap:1.4vh;
  opacity:0;transform:translateY(26px)}
.panel.active .svc{animation:rise .75s forwards}
.svc .ic{width:9vh;height:9vh;border-radius:50%;display:grid;place-items:center}
.svc .ic svg{width:4.6vh;height:4.6vh;stroke-width:1.7}
.svc .nm{font-family:'Quicksand';font-size:2.2vh;font-weight:700;color:var(--navy)}
.svc .px{font-size:1.6vh;font-weight:600;color:var(--mute)}
.svc .px b{color:var(--aqua-deep);font-weight:800}

/* Consejo / Sabías */
.tipicon{font-size:11vh;margin-bottom:2vh;opacity:0;filter:drop-shadow(0 10px 20px rgba(15,63,104,.12))}
.panel.active .tipicon{animation:pop 1s .3s forwards}
.bigquote{font-family:'Quicksand';font-size:6vh;font-weight:700;line-height:1.2;max-width:22ch;
  text-wrap:balance;color:var(--navy);opacity:0}
.panel.active .bigquote{animation:rise 1s .5s forwards}
.bigquote .hl{color:var(--coral)}

/* Agendar */
.steps{display:flex;gap:2vw;margin-top:4.5vh;flex-wrap:wrap;justify-content:center}
.step{padding:3.4vh 2vw;width:22vw;min-width:230px;opacity:0;transform:translateY(26px)}
.panel.active .step{animation:rise .8s forwards}
.step .n{width:7vh;height:7vh;border-radius:50%;display:grid;place-items:center;margin:0 auto 2vh;
  font-family:'Quicksand';font-size:3vh;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--aqua),var(--aqua-deep));box-shadow:0 10px 24px rgba(79,190,206,.4)}
.step .st{font-size:2.1vh;font-weight:600;line-height:1.45;color:var(--text)}
.wa{margin-top:5vh;display:inline-flex;align-items:center;gap:1.6vw;padding:2.6vh 3.6vw;border-radius:999px;
  background:linear-gradient(135deg,#34d36e,#1fa564);box-shadow:0 18px 40px rgba(37,179,98,.35);opacity:0;position:relative}
.panel.active .wa{animation:rise 1s .95s forwards}
.wa::before{content:"";position:absolute;inset:-4px;border-radius:999px;border:3px solid rgba(52,211,110,.45);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.13);opacity:0}}
.wa svg{width:5.4vh;height:5.4vh;fill:#fff}
.wa .num{font-family:'Quicksand';font-size:4.2vh;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.wa .lb{font-size:1.55vh;font-weight:700;color:rgba(255,255,255,.92);text-align:left;text-transform:uppercase;letter-spacing:.12em}

/* Equipo */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8vh 1.8vw;max-width:1340px;margin-top:1vh}
.doc{display:flex;align-items:center;gap:1.3vw;padding:2.4vh 1.5vw;text-align:left;opacity:0;transform:translateY(22px)}
.panel.active .doc{animation:rise .7s forwards}
.doc .av{width:7vh;height:7vh;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-family:'Quicksand';font-size:2.4vh;font-weight:700;color:#fff}
.doc .nm{font-family:'Quicksand';font-size:2vh;font-weight:700;color:var(--navy);line-height:1.2}
.doc .sp{font-size:1.55vh;font-weight:700;color:var(--aqua-deep);margin-top:.5vh}

/* ── Dots ─────────────────────────────────────────────────────────── */
.dots{position:fixed;left:50%;transform:translateX(-50%);bottom:8.2vh;z-index:12;display:flex;gap:1vw}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(15,63,104,.16);transition:all .5s ease}
.dots i.on{width:32px;border-radius:999px;background:linear-gradient(90deg,var(--aqua),var(--blue))}

/* ── Ticker ───────────────────────────────────────────────────────── */
.ticker{position:fixed;bottom:0;left:0;right:0;z-index:12;height:6.4vh;display:flex;align-items:center;
  overflow:hidden;background:#fff;border-top:1px solid #eadfce;box-shadow:0 -6px 20px rgba(15,63,104,.05)}
.ticker .tag{flex:0 0 auto;background:linear-gradient(135deg,var(--aqua),var(--aqua-deep));color:#fff;
  font-weight:800;font-size:1.45vh;letter-spacing:.06em;text-transform:uppercase;padding:1.1vh 1.8vw;
  margin-left:2vw;border-radius:999px}
.ticker .wrap{flex:1;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ticker .track{display:inline-flex;white-space:nowrap;animation:scroll 46s linear infinite;
  font-size:1.8vh;font-weight:700;color:var(--mute)}
.ticker .track span{padding:0 3vw;position:relative}
.ticker .track span::before{content:"❤";position:absolute;left:.7vw;color:var(--coral);font-size:1.2vh;top:50%;transform:translateY(-50%)}
@keyframes scroll{to{transform:translateX(-50%)}}

@media (max-aspect-ratio:1/1){
  .grid{grid-template-columns:repeat(2,1fr)} .team{grid-template-columns:1fr}
  .title{font-size:5.4vh} .bigquote{font-size:4.6vh} .steps{flex-direction:column} .step{width:80vw}
  .hills{height:14vh}
}
</style>
</head>

const stage=document.getElementById('stage'), slides=[];
const add=h=>{const d=document.createElement('section');d.className='panel';d.innerHTML=h;stage.appendChild(d);slides.push(d);};

add(`
  <div class="welcome-hero" style="background-image:url(${EDIFICIO})"></div>
  <div class="kicker">Estás en tu centro de salud</div>
  <h1 class="title">¡Bienvenido/a!<br>Qué bueno <span class="hl">tenerte por acá</span>.</h1>
  <p class="subtitle">Gracias por confiar en nosotros. En un ratito te atendemos. Ponte cómodo/a.</p>
`);
add(`
  <div class="kicker">Lo que hacemos por ti</div>
  <h2 class="title" style="font-size:5.2vh;margin-bottom:1.4vh">Nuestras especialidades</h2>
  <div class="grid">${CONFIG.especialidades.map((e,i)=>{const c=SVCCOLOR[e.color]||SVCCOLOR.aqua;return `
    <div class="svc soft" style="animation-delay:${.65+i*.08}s">
      <div class="ic" style="background:${c[0]};color:${c[1]}">${ICONS[e.ic]||''}</div>
      <div class="nm">${e.nm}</div><div class="px">${e.px}</div>
    </div>`;}).join('')}</div>
`);
add(`<div class="kicker">Consejo del día</div><div class="tipicon" data-tip="ic"></div><p class="bigquote" data-tip="tx"></p>`);
add(`
  <div class="kicker">Agenda sin llamar</div>
  <h2 class="title" style="font-size:5.6vh">Pide tu hora por <span class="hl" style="color:#1fa564">WhatsApp</span></h2>
  <div class="steps">
    <div class="step soft" style="animation-delay:.75s"><div class="n">1</div><div class="st">Escríbenos al número de abajo</div></div>
    <div class="step soft" style="animation-delay:.9s"><div class="n">2</div><div class="st">Elige especialidad y el horario que te acomode</div></div>
    <div class="step soft" style="animation-delay:1.05s"><div class="n">3</div><div class="st">Recibe tu confirmación y recordatorio</div></div>
  </div>
  <div class="wa"><div>${WA_ICON}</div><div><div class="lb">Escríbenos a</div><div class="num">${CONFIG.whatsapp}</div></div></div>
`);
add(`<div class="kicker">¿Sabías que…?</div><div class="tipicon" data-sab="ic"></div><p class="bigquote" data-sab="tx"></p>`);
add(`
  <div class="kicker">Te atendemos con cariño</div>
  <h2 class="title" style="font-size:4.8vh;margin-bottom:1.4vh">Nuestro equipo</h2>
  <div class="team">${CONFIG.equipo.map((d,i)=>{
    const ini=d.n.replace(/^Dr[a]?\.\s*/,'').split(' ').map(w=>w[0]).slice(0,2).join('');
    const cs=[['#4FBECE','#1172AB'],['#F4C25E','#E07350'],['#7FB069','#2C9DB0']][i%3];
    return `<div class="doc soft" style="animation-delay:${.65+i*.07}s"><div class="av" style="background:linear-gradient(135deg,${cs[0]},${cs[1]})">${ini}</div><div><div class="nm">${d.n}</div><div class="sp">${d.s}</div></div></div>`;
  }).join('')}</div>
`);

slides[0].classList.add('welcome');

const tline=CONFIG.ticker.map(t=>`<span>${t}</span>`).join('');
document.getElementById('ticker').innerHTML=tline+tline;
const dots=document.getElementById('dots');
slides.forEach(()=>dots.appendChild(document.createElement('i')));

const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function tick(){const n=new Date();
  const h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0'),s=String(n.getSeconds()).padStart(2,'0');
  document.getElementById('clock').innerHTML=`${h}:${m}<span class="sec">:${s}</span>`;
  document.getElementById('date').textContent=`${DIAS[n.getDay()]}, ${n.getDate()} de ${MESES[n.getMonth()]}`;}
tick();setInterval(tick,1000);

let idx=-1,ci=0,si=0;
function show(i){
  slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
  const p=slides[i];
  p.querySelectorAll('.svc,.step,.doc,.title,.kicker,.subtitle,.bigquote,.tipicon,.medallion,.wa').forEach(el=>{el.style.animation='none';el.offsetHeight;el.style.animation='';});
  const tip=p.querySelector('[data-tip]');
  if(tip){const c=CONFIG.consejos[ci++%CONFIG.consejos.length];p.querySelector('[data-tip="ic"]').textContent=c.ic;p.querySelector('[data-tip="tx"]').innerHTML=c.tx;}
  const sab=p.querySelector('[data-sab]');
  if(sab){const c=CONFIG.sabias[si++%CONFIG.sabias.length];p.querySelector('[data-sab="ic"]').textContent=c.ic;p.querySelector('[data-sab="tx"]').innerHTML=c.tx;}
}
function next(){idx=(idx+1)%slides.length;show(idx);}
next();setInterval(next,CONFIG.panelSeconds*1000);

if('wakeLock'in navigator){const req=()=>navigator.wakeLock.request('screen').catch(()=>{});req();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')req();});}
</script>
</body>
</html>
