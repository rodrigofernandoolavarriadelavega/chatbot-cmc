<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F3F68">
<meta name="description" content="Sus horas, pagos y documentos del Centro Médico Carampangue.">
<title>Mi portal · Centro Médico Carampangue</title>
<link rel="icon" href="/static/favicon-circle-64.png">
<link rel="apple-touch-icon" href="/static/favicon-circle-192.png">
<link rel="preload" href="/static/fonts/montserrat-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ═══ Portal del Paciente CMC — portal_app (v6)
   Una tarea por pantalla · texto 18px · toques ≥56px · cero CDN. ═══ */
@font-face{font-family:"Montserrat";src:url(/static/fonts/montserrat-var-latin.woff2) format("woff2");font-weight:400 800;font-display:swap}
@font-face{font-family:"Inter";src:url(/static/fonts/inter-var-latin.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{
  --navy:#0F3F68;--navy-2:#0B3154;--blue:#1172AB;--aqua:#4FBECE;--aqua-soft:#E3F4F6;
  --bone:#F6F3EE;--card:#FFFFFF;--line:#E4DED4;--line-2:#D6CEC1;
  --ink:#14212D;--ink-2:#3B4A57;--muted:#55636F;
  --ok:#11734B;--ok-bg:#E5F4EC;--warn:#8A5300;--warn-bg:#FFF3DC;--bad:#A3261B;--bad-bg:#FCEBE8;
  --r-s:12px;--r:18px;--r-l:24px;
  --sh-1:0 1px 2px rgba(15,63,104,.06),0 1px 1px rgba(15,63,104,.04);
  --sh-2:0 2px 6px rgba(15,63,104,.06),0 10px 24px -8px rgba(15,63,104,.16);
  --f-head:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.fz-115{font-size:115%}html.fz-130{font-size:130%}
body{font-family:var(--f-body);font-size:1.125rem;line-height:1.5;color:var(--ink);background:var(--bone);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ── Barra superior ── */
.top{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;background:#fff;box-shadow:var(--sh-1);padding:3px}
.brand b{font-family:var(--f-head);font-weight:700;font-size:.95rem;line-height:1.15;letter-spacing:-.005em}
.brand small{display:block;font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.top .sp{flex:1}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px 0 8px;margin-left:-8px;border:0;background:none;color:var(--navy);font-weight:600;font-size:1.05rem;cursor:pointer;border-radius:12px}
.back svg{width:24px;height:24px}
.who{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 12px 0 6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;cursor:pointer;font-weight:600;font-size:.95rem;color:var(--navy);max-width:48vw}
.who i{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:14px;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.demo-band{background:var(--warn-bg);color:#5C3A00;font-size:.95rem;font-weight:600;text-align:center;padding:8px 16px;border-bottom:1px solid #F0DDB4}
.off-band{background:#EEF1F4;color:var(--ink-2);font-size:.95rem;text-align:center;padding:8px 16px}

main{padding:8px 0 calc(var(--nav-h) + 32px + env(safe-area-inset-bottom))}
main.noNav{padding-bottom:40px}
.view{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Tipografía ── */
h1{font-family:var(--f-head);font-weight:700;font-size:1.75rem;line-height:1.2;letter-spacing:-.02em;color:var(--navy);margin:14px 0 6px}
h2{font-family:var(--f-head);font-weight:700;font-size:1.3rem;line-height:1.25;letter-spacing:-.01em;color:var(--navy);margin:28px 0 12px}
h3{font-family:var(--f-head);font-weight:700;font-size:1.1rem;color:var(--navy)}
.lead{color:var(--ink-2);font-size:1.125rem}
.step{display:inline-block;font-weight:700;font-size:.95rem;color:var(--blue);margin-top:12px}
.muted{color:var(--muted)}
.small{font-size:1rem}

/* ── Tarjetas ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:20px}
.card+.card{margin-top:12px}
.stack>*+*{margin-top:12px}

/* Boleto de la hora */
.ticket{position:relative;background:linear-gradient(160deg,#134D7D 0%,var(--navy) 55%,var(--navy-2) 100%);color:#fff;border-radius:var(--r-l);padding:22px 20px 20px;box-shadow:var(--sh-2);overflow:hidden}
.ticket::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(79,190,206,.35),transparent 70%);pointer-events:none}
.ticket .eyebrow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;color:#CFE9F0}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;border-radius:999px;padding:4px 12px;line-height:1.4}
.pill.today{background:var(--aqua);color:#06303F}
.pill.soon{background:rgba(255,255,255,.16);color:#fff}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--aqua-soft);color:#0B5563}
.ticket .when{font-family:var(--f-head);font-weight:700;font-size:1.6rem;line-height:1.2;margin-top:10px;letter-spacing:-.01em}
.ticket .hour{font-family:var(--f-head);font-weight:800;font-size:2.6rem;line-height:1.05;letter-spacing:-.02em;margin-top:2px}
.ticket .hour small{font-size:1.1rem;font-weight:600;opacity:.85;margin-left:6px}
.ticket .who-doc{margin-top:10px;font-size:1.125rem;color:#E8F3F8}
.ticket .who-doc b{display:block;color:#fff;font-weight:600}
.ticket .mod{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.3);font-size:1.05rem;color:#E8F3F8}
.ticket .mod svg{width:24px;height:24px;flex:none;margin-top:1px}
.ticket .btns{margin-top:18px}
.ticket .btn.light{background:#fff;color:var(--navy)}
.ticket .btn.ghostL{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}

/* ── Botones ── */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:12px 20px;border-radius:16px;border:0;font-family:var(--f-head);font-weight:700;font-size:1.1rem;line-height:1.25;text-align:center;text-decoration:none;cursor:pointer;transition:transform .12s ease,background-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.985)}
.btn svg{width:24px;height:24px;flex:none}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(17,114,171,.6)}
.btn.pri:hover{background:#0E6599}
.btn.aqua{background:var(--aqua);color:#06303F;box-shadow:0 6px 16px -6px rgba(79,190,206,.7)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line-2)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.link{background:none;color:var(--bad);min-height:52px;text-decoration:underline;text-underline-offset:3px;font-family:var(--f-body);font-weight:600}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btns>*+*{margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{font-size:1rem;padding:10px 12px}

/* Lista de acciones (tipo ajustes iOS, ícono + texto + flecha) */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;text-decoration:none;color:var(--ink);cursor:pointer}
.li:first-child{border-top:0}
.li:active{background:#FAF8F4}
.li .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--aqua-soft);color:var(--navy)}
.li .ic svg{width:24px;height:24px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:1.125rem;color:var(--navy)}
.li .tx span{display:block;font-size:1rem;color:var(--muted)}
.li .chev{width:22px;height:22px;color:#9AA6B0;flex:none}

/* Cita en lista */
.appt{display:flex;gap:14px;align-items:center}
.date{width:64px;flex:none;text-align:center;border-radius:14px;background:var(--aqua-soft);color:var(--navy);padding:8px 0;line-height:1.1}
.date small{display:block;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.date b{display:block;font-family:var(--f-head);font-size:1.6rem;font-weight:800}
.appt .tx b{font-family:var(--f-head);font-size:1.15rem;color:var(--navy)}

/* Notas / avisos */
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-s);padding:14px 16px;font-size:1.05rem;line-height:1.45}
.note svg{width:24px;height:24px;flex:none;margin-top:1px}
.note.info{background:var(--aqua-soft);color:#0B4552}
.note.warn{background:var(--warn-bg);color:#5C3A00}
.note.bad{background:var(--bad-bg);color:#7A1C14}
.note.ok{background:var(--ok-bg);color:#0B5536}
.note b{font-weight:700}

/* Pares dato/valor */
.kv{display:grid;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0;padding-top:0}
.kv dt{font-size:.95rem;font-weight:600;color:var(--muted)}
.kv dd{font-size:1.125rem;color:var(--ink)}

/* Elección (días / horas) */
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:68px;padding:12px 18px;border-radius:16px;background:#fff;border:1.5px solid var(--line-2);text-align:left;cursor:pointer;color:var(--navy)}
.choice b{font-family:var(--f-head);font-weight:700;font-size:1.15rem}
.choice span{color:var(--muted);font-size:1rem}
.choice[aria-pressed=true]{border-color:var(--blue);background:#EEF6FB;box-shadow:0 0 0 3px rgba(17,114,171,.18)}
.choice[disabled]{opacity:.6;cursor:not-allowed}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hour-b{min-height:58px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;font-family:var(--f-head);font-weight:700;font-size:1.2rem;color:var(--navy);cursor:pointer}
.hour-b[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.group-t{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink-2);margin:18px 0 10px;font-size:1.05rem}

/* Campos */
label.lbl{display:block;font-weight:700;color:var(--navy);margin:16px 0 6px;font-size:1.05rem}
.hint{font-size:1rem;color:var(--muted);margin-top:4px}
.inp{width:100%;min-height:60px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;padding:12px 16px;font-size:1.3rem;font-family:var(--f-head);font-weight:600;letter-spacing:.02em;color:var(--ink)}
.inp.sm{font-size:1.125rem;font-family:var(--f-body);font-weight:500;letter-spacing:0}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(17,114,171,.18)}
.inp[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 4px rgba(163,38,27,.12)}
.err{color:var(--bad);font-weight:600;font-size:1.02rem;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.check{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;font-size:1.02rem;line-height:1.45}
.check input{width:28px;height:28px;flex:none;accent-color:var(--blue);margin-top:1px}
.prefix{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:14px;background:#fff;overflow:hidden}
.prefix span{padding:0 4px 0 16px;font-family:var(--f-head);font-weight:600;font-size:1.2rem;color:var(--muted);white-space:nowrap}
.prefix .inp{border:0;box-shadow:none;min-height:58px;padding-left:6px}
.prefix:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(17,114,171,.18)}

/* Ayuda humana */
.help{margin-top:28px}
.help .row2 .btn{min-height:56px}
.sos{margin-top:12px;text-align:center;font-size:1rem;color:var(--muted)}
.sos a{font-weight:700;color:var(--bad)}

/* Esqueleto */
.sk{background:linear-gradient(90deg,#ECE7DF 25%,#F4F0EA 37%,#ECE7DF 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:14px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Resultado de examen (neutro, sin semáforo) */
.exam{border-top:1px solid var(--line);padding:14px 0}
.exam:first-child{border-top:0;padding-top:0}
.exam .val{font-family:var(--f-head);font-weight:700;font-size:1.4rem;color:var(--navy)}
.exam .ref{font-size:1rem;color:var(--muted)}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--nav-h);text-decoration:none;color:#56636E;font-size:13px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.nav a svg{width:26px;height:26px}
.nav a[aria-current=page]{color:var(--navy)}
.nav a[aria-current=page] .dot{background:var(--aqua-soft)}
.nav .dot{display:grid;place-items:center;width:56px;height:32px;border-radius:999px;transition:background .2s}
html.fz-130 .brand span,html.fz-115 .brand span{display:none}
@media (min-width:430px){html.fz-115 .brand span{display:block}}
.demo-band,.off-band{font-size:14px}

/* Hoja inferior (elegir persona) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,24,38,.45);z-index:50;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bone);border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#CFC7BA;margin:2px auto 8px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:60;max-width:520px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;font-weight:600;box-shadow:var(--sh-2);animation:up .25s ease}

/* Login */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-top:32px;padding-bottom:40px}
.login .logo{width:64px;height:64px;border-radius:18px;background:#fff;box-shadow:var(--sh-2);padding:6px;margin-bottom:18px}
.otp{font-size:2rem;letter-spacing:.4em;text-align:center;padding-left:.4em}

/* Éxito */
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:18px 0 6px}
.done-ic svg{width:40px;height:40px}
.strike{text-decoration:line-through;color:var(--muted)}

@media (min-width:700px){
  body{background:radial-gradient(1200px 500px at 50% -200px,#EAF4F7,transparent),var(--bone)}
  h1{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.top,.nav,.help,.btns,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<a href="#app" class="sr">Ir al contenido</a>
<div id="bands"></div>
<header class="top" id="top" hidden><div class="wrap" id="topIn"></div></header>
<main id="app" tabindex="-1"><div class="wrap"><div class="sk" style="height:220px;margin-top:20px"></div><div class="sk" style="height:72px;margin-top:14px"></div><div class="sk" style="height:72px;margin-top:10px"></div></div></main>
<nav class="nav" id="nav" aria-label="Secciones" hidden></nav>
<div id="live" class="sr" aria-live="polite"></div>
<div id="layer"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   Datos fijos (fuente: código del repo, no inventados)
   ═══════════════════════════════════════════════════════════════════ */
const WA_NUM = '56966610737';                 // bot/recepción WhatsApp
const FIJO = '(44) 296 5226', FIJO_TEL = '+56442965226';
const DIRECCION = 'Monsalve 102, esquina República, Carampangue';
const DIR_REF = 'frente a la antigua estación de trenes';
const MAPS = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Centro Médico Carampangue, Monsalve 102, Carampangue');
// Espejo de config.ABONO_REGLAS (solo las que exigen abono al agendar, gate_bot=True).
// Si cambian los montos en config.py hay que actualizar aquí (ver informe: falta API).
const ABONO = {
  78:{esp:'Psiquiatría',monto:60000,txt:'el valor total de la consulta'},
  65:{esp:'Gastroenterología',monto:35000,txt:'el valor total de la consulta'},
  79:{esp:'Neurología',monto:65000,txt:'el valor total de la consulta'},
  81:{esp:'Nutriología y Diabetología',monto:60000,txt:'el valor total de la consulta'},
  76:{esp:'Estética Facial',monto:15000,txt:'la evaluación (si ese día se hace el tratamiento, se descuenta)'},
};
// Espejo de medilink.PROFESIONALES: telemedicina / telemedicina_dias / modalidad_a_eleccion
const TELE_SIEMPRE = new Set([78,79,81]);
const TELE_DIAS = {74:[1,2,3,4,5]};          // JS: lunes=1 … viernes=5 (sábado presencial)
const A_ELECCION = new Set([82]);
const DENTAL = /odontolog|ortodon|endodon|implant|estética facial|estetica facial/i;

/* ════════════════════════════════════════════════════════════════════
   Estado
   ═══════════════════════════════════════════════════════════════════ */
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
const S = { d:null, perfil:null, family:null, exams:null, cat:null, offline:false, flow:null, busy:false };
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_C = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ── Utilidades ── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp = n => '$' + Math.round(n).toLocaleString('es-CL');

function rutFmt(r){ const c=rutClean(r); if(c.length<2) return c; const b=c.slice(0,-1), dv=c.slice(-1); return b.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+dv; }

   Red: fetch con tiempo límite y errores con nombre
   ═══════════════════════════════════════════════════════════════════ */
class NetErr extends Error{ constructor(kind,msg,status,data){ super(msg); this.kind=kind; this.status=status; this.data=data; } }
async function api(url, opts={}, timeout=15000){
  if (DEMO) throw new NetErr('demo','En el modo de ejemplo no se usa la red.');
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), timeout);
  let r;
  try{ r = await fetch(url, {credentials:'same-origin', ...opts, headers:{'Content-Type':'application/json', ...(opts.headers||{})}, signal:ctrl.signal}); }
  catch(e){ throw new NetErr(navigator.onLine===false?'offline':'timeout', navigator.onLine===false?'Su teléfono no tiene señal en este momento.':'La conexión está muy lenta. Intente de nuevo.'); }
  finally{ clearTimeout(t); }
  let data = null; try{ data = await r.json(); }catch(e){}
  if (r.ok) return data || {};
  const det = data && data.detail; const msg = typeof det==='string' ? det : (det && det.mensaje) || '';
  if (r.status===401) throw new NetErr('auth', msg||'Su sesión terminó.', 401, data);
  if (r.status===429) throw new NetErr('busy', msg||'Hay mucha gente consultando en este momento. Espere un minuto y vuelva a intentar.', 429, data);
  if (r.status>=500) throw new NetErr('server', msg||'El sistema de horas no respondió. Intente en unos minutos.', r.status, data);
  throw new NetErr('bad', msg||'No se pudo completar.', r.status, data);
}

  const msg = e && e.message ? e.message : 'Algo no funcionó.';
  return `<div class="note bad" role="alert">${ic('warn')}<div><b>No pudimos completar esto.</b><br>${esc(msg)}</div></div>
    <div class="btns" style="margin-top:14px">${retry?`<button class="btn pri" onclick="${retry}">Intentar de nuevo</button>`:''}
    <a class="btn sec" href="${wa(ctx||'Hola, tuve un problema en el portal del paciente.')}" target="_blank" rel="noopener">${ic('wa')}Escribir por WhatsApp</a>

function ticketHTML(c, opts={}){
  const n = daysFrom(c.fecha); const mod = modalidad(c);
  const pill = n===0 ? '<span class="pill today">Hoy</span>' : n===1 ? '<span class="pill soon">Mañana</span>' : n!=null && n<=7 ? `<span class="pill soon">En ${n} días</span>` : '';
  const modTxt = mod==='video' ? `${ic('video')}<span><b>Teleconsulta por videollamada.</b> Le enviamos el link de Medilink por WhatsApp antes de la hora. No necesita instalar nada.</span>`
    : mod==='eleccion' ? `${ic('info')}<span>Presencial o por videollamada, según lo que usted eligió al agendar. Si es videollamada, el link le llega por WhatsApp.</span>`
    : `${ic('pin')}<span>${DIRECCION}<br><span style="opacity:.85">Llegue 10 minutos antes con su cédula.</span></span>`;
  return `<article class="ticket" aria-label="Hora de ${esc(c.especialidad)}">
    <div class="eyebrow">${opts.label||'Su próxima hora'} ${pill}</div>
    <div class="when">${fLarga(c.fecha,true)}</div>
    <div class="hour">${esc(hhmm(c.hora_inicio))}<small>hrs</small></div>
    <div class="who-doc"><b>${esc(c.especialidad)}</b>${esc(c.profesional)}</div>
    <div class="mod">${modTxt}</div>
    ${opts.btns?`<div class="btns">${opts.btns}</div>`:''}
  </article>`;
}
function checkinKey(c){ return 'cmc_app_ci_'+c.fecha+'_'+(c.id||''); }

    </div>
    ${mod!=='video'?`<a class="btn sec" style="margin-top:10px" href="${wa(shareText(c))}" target="_blank" rel="noopener">${ic('share')}Enviar por WhatsApp a un familiar</a>`:''}

    <h2>Qué llevar</h2>
    <div class="card"><ul style="padding-left:20px" class="stack">${llevar.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>

    ${helpBlock('Hola, consulto por mi hora de '+c.especialidad+' del '+fCorta(c.fecha)+' a las '+hhmm(c.hora_inicio)+'.')}`;

function abonoNote(c, ab){
  return `<div class="note warn" style="margin-top:12px">${ic('wallet')}<div><b>Esta hora lleva abono de ${clp(ab.monto)}</b> (${esc(ab.txt)}).<br>
    La hora queda apartada por 24 horas mientras se paga el abono. Si avisa con 24 horas o más de anticipación, se le devuelve o lo usa para otra hora. <a href="#pagos">Ver cómo pagar</a></div></div>`;
}
function shareText(c){ const m=modalidad(c); return `Hora en el Centro Médico Carampangue\n${c.especialidad} con ${c.profesional}\n${fLarga(c.fecha)} a las ${hhmm(c.hora_inicio)} hrs\n${m==='video'?'Teleconsulta: el link llega por WhatsApp.':'📍 '+DIRECCION+' ('+DIR_REF+')'}`; }
function gcal(c){
  const d=pDate(c.fecha); const [h,m]=hhmm(c.hora_inicio).split(':').map(Number); const s=new Date(d); s.setHours(h,m); const e=new Date(s.getTime()+30*6e4);
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(c.especialidad+' · Centro Médico Carampangue')+'&dates='+f(s)+'/'+f(e)+'&ctz=America/Santiago&details='+encodeURIComponent(c.profesional)+'&location='+encodeURIComponent(modalidad(c)==='video'?'Videollamada (link por WhatsApp)':DIRECCION);
}
function agendarUrl(esp){ const p = new URLSearchParams(); const r=activeRut(); if(r && !DEMO) p.set('rut', rutApi(r)); if(esp) p.set('esp', esp); if(DEMO) p.set('demo','1'); const q=p.toString(); return '/agendar'+(q?'?'+q:''); }

async function checkin(id){
  const c = citaById(id); if(!c || S.busy) return; S.busy=true;
  try{
    if (!DEMO) await api('/portal/api/checkin',{method:'POST',body:JSON.stringify({id_cita:String(c.id),especialidad:c.especialidad,hora:hhmm(c.hora_inicio)})});
    store(checkinKey(c), 1); track('checkin'); toast('Listo. Le esperamos a las '+hhmm(c.hora_inicio)+'.'); say('Confirmado. Recepción sabe que viene.'); render();
  }catch(e){ if(e.kind==='auth') return toLogin(); toast(e.message||'No se pudo avisar. Intente de nuevo.'); }
  finally{ S.busy=false; }
}

async function anular(id){
  const c = citaById(id); const b=$('#anBtn'); if(!c||S.busy) return; S.busy=true; b.disabled=true; b.textContent='Anulando…';
  try{
    if (DEMO){ await new Promise(r=>setTimeout(r,700)); DEMO_PEOPLE[demoActive].citas_futuras = DEMO_PEOPLE[demoActive].citas_futuras.filter(x=>String(x.id)!==String(id)); S.d=demoData(); }
    else { await api('/agendar/api/cancelar',{method:'POST',body:JSON.stringify({rut:rutApi(activeRut()), id_cita:String(c.id)})},25000); track('cita_anula'); }
    S.flow = {anulada:c};
    if(!DEMO){ try{ await loadAll(); }catch(e){} }
    location.replace('#listo/anulada');
  }catch(e){
    if(e.kind==='auth') return toLogin();
    $('#anErr').innerHTML = `<div style="margin-top:14px">${errorBlock(e,null,'Hola, quiero anular mi hora de '+c.especialidad+' del '+fCorta(c.fecha)+' a las '+hhmm(c.hora_inicio)+'.')}</div>`;
    b.disabled=false; b.textContent='Sí, anular mi hora';
  } finally { S.busy=false; }
}

/* ── Cambiar día u hora: nueva hora PRIMERO, después se libera la antigua ── */
function startCambio(id){
  const c = citaById(id); if(!c) return;
  S.flow = {id:String(c.id), old:c, idProf:+c.id_profesional, days:null, dia:null, slots:{}, hora:null, err:''};
  saveFlow(); track('cita_cambia_inicia'); go('cambiar/'+c.id+'/dia');
}
function saveFlow(){ try{ sessionStorage.setItem('cmc_app_flow', JSON.stringify(S.flow)); }catch(e){} }
function restoreFlow(id){ if(S.flow && S.flow.id===String(id)) return S.flow; try{ const f=JSON.parse(sessionStorage.getItem('cmc_app_flow')||'null'); if(f&&f.id===String(id)){ S.flow=f; return f; } }catch(e){} return null; }

VIEWS.cambiar = (r) => {
  const f = restoreFlow(r.id); const c = citaById(r.id);
  if (!f || !c){ setTimeout(()=>go(c?'hora/'+r.id:'horas'),0); return ''; }
  const head = (n,t) => `<span class="step">Paso ${n} de 3</span><h1>${t}</h1>`;
  const actual = `<p class="muted small" style="margin-top:4px">Hora actual: ${esc(c.especialidad)}, ${fCorta(c.fecha)} a las ${esc(hhmm(c.hora_inicio))} con ${esc(c.profesional)}.</p>`;
  if (r.sub==='hora' && f.dia){
    const sl = f.slots[f.dia]||[];
    const am = sl.filter(s=>hhmm(s.hora_inicio)<'13:00'), pm = sl.filter(s=>hhmm(s.hora_inicio)>='13:00');
    const grp = (t,icn,a) => a.length?`<div class="group-t">${ic(icn,'style="width:22px;height:22px"')}${t}</div><div class="hours" role="group" aria-label="${t}">${a.map(s=>`<button class="hour-b" aria-pressed="${f.hora&&f.hora.hora_inicio===s.hora_inicio}" onclick="pickHora('${esc(s.hora_inicio)}')">${esc(hhmm(s.hora_inicio))}</button>`).join('')}</div>`:'';
    return `${head(2,'¿A qué hora el '+fCorta(f.dia)+'?')}${actual}
      ${f.err?`<div class="note bad" role="alert" style="margin-top:12px">${ic('warn')}<div>${esc(f.err)}</div></div>`:''}
      ${sl.length?grp('En la mañana','sun',am)+grp('En la tarde','moon',pm):`<div class="note info" style="margin-top:12px">${ic('info')}<div>Ya no quedan horas ese día. Elija otro.</div></div>`}
      <button class="btn sec" style="margin-top:20px" onclick="history.back()">Elegir otro día</button>
      ${helpBlock('Hola, quiero cambiar mi hora de '+c.especialidad+'.')}`;
  }
  if (r.sub==='revisar' && f.dia && f.hora){
    const tel = f.tel != null ? f.tel : telLocal((S.perfil&&S.perfil.phone)||'');
    return `${head(3,'Revise y confirme el cambio')}
      <div class="card" style="margin-top:14px"><dl>
        <div class="kv"><dt>Hora actual (se libera)</dt><dd class="strike">${fLarga(c.fecha)} · ${esc(hhmm(c.hora_inicio))} hrs</dd></div>
        <div class="kv"><dt>Hora nueva</dt><dd><b style="font-family:var(--f-head);font-size:1.25rem;color:var(--navy)">${fLarga(f.dia)} · ${esc(hhmm(f.hora.hora_inicio))} hrs</b><br>${esc(c.especialidad)} con ${esc(c.profesional)}</dd></div>
      </dl></div>
      ${modalidad({...c,fecha:f.dia})==='video'?`<div class="note info" style="margin-top:12px">${ic('video')}<div>Esta hora es por <b>videollamada</b>. El link de Medilink le llega por WhatsApp.</div></div>`:''}
      <label class="lbl" for="tel">Celular para avisarle</label>
      <div class="prefix"><span>+56 9</span><input id="tel" class="inp" inputmode="numeric" autocomplete="tel-national" maxlength="9" value="${esc(tel)}" aria-describedby="telH" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,8);S.flow.tel=this.value;saveFlow()"></div>
      <p class="hint" id="telH">Los 8 números después del 9.</p>
      <label class="check" style="margin-top:16px"><input type="checkbox" id="consent" ${f.consent?'checked':''} onchange="S.flow.consent=this.checked;saveFlow()"><span>Acepto que el centro use mis datos para gestionar esta hora (<a href="/privacidad" target="_blank" rel="noopener">Ley 21.719</a>).</span></label>
      <div class="note info" style="margin-top:12px">${ic('info')}<div>Primero reservamos su hora nueva. Recién cuando quede lista, liberamos la anterior. Así nunca queda sin hora.</div></div>
      <div id="cbErr">${f.err?`<div class="err" role="alert" style="margin-top:12px">${ic('warn','style="width:22px;height:22px;flex:none"')}<span>${esc(f.err)}</span></div>`:''}</div>
      <div class="btns" style="margin-top:20px"><button class="btn pri" id="cbBtn" onclick="confirmarCambio()">Cambiar mi hora al ${esc(fCorta(f.dia))} a las ${esc(hhmm(f.hora.hora_inicio))}</button>
      <button class="btn sec" onclick="history.back()">Elegir otra hora</button></div>`;
  }
  // Paso 1: día
  const days = f.days;
  let list;
  if (!days) list = `<div class="choices" aria-busy="true">${'<div class="sk" style="height:68px"></div>'.repeat(4)}</div><p class="muted small" style="margin-top:10px">Buscando días con horas libres…</p>`;
  else if (days.error) list = errorBlock({message:days.error},"reloadDays()",'Hola, quiero cambiar mi hora de '+c.especialidad+' del '+fCorta(c.fecha)+'.');
  else if (!days.list.length) list = `<div class="note info">${ic('info')}<div><b>${esc(c.profesional)} no tiene horas libres en las próximas semanas.</b><br>Escríbanos y le avisamos apenas se abra un cupo.</div></div>${helpBlock('Hola, quiero cambiar mi hora de '+c.especialidad+' pero no encontré horas libres.')}`;
  else list = `<div class="choices">${days.list.map(d=>{ const same = d===c.fecha; const n=(f.slots[d]||[]).length;
      return `<button class="choice" ${same?'disabled':''} onclick="pickDia('${d}')"><span><b>${fLarga(d)}</b><br><span>${same?'Es el día de su hora actual':n===1?'1 hora libre':n+' horas libres'}</span></span>${same?'':ic('chev','class="chev" style="width:22px;height:22px;color:#9AA6B0"')}</button>`; }).join('')}</div>
      ${days.more?`<p class="muted small" style="margin-top:10px" aria-live="polite">Buscando más días…</p>`:''}
      ${days.list.includes(c.fecha)?`<p class="muted small" style="margin-top:10px">Para moverla a otra hora del mismo día, escríbanos por WhatsApp.</p>`:''}`;
  return `${head(1,'¿Qué día le acomoda?')}${actual}<div style="margin-top:16px">${list}</div>`;
};

function reloadDays(){ S.flow.days=null; render(); }
function sinPasadas(fecha, arr){
  if (fecha!==iso(today())) return arr;
  const n=new Date(); const lim=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  return arr.filter(s=>s.hora_inicio>lim);
}
async function getSlots(idProf, fecha){
  if (DEMO){ await new Promise(r=>setTimeout(r,250)); return sinPasadas(fecha, demoSlots(idProf,fecha)); }
  const r = await api('/agendar/api/slots?id_prof='+idProf+'&fecha='+fecha, {}, 20000);
  return sinPasadas(fecha, (r.slots||[]).map(s=>({hora_inicio:hhmm(s.hora_inicio), hora_fin:hhmm(s.hora_fin)})));
}
let _loadingDays = false;
async function loadDays(){
  const f=S.flow; if(!f || f.days || _loadingDays) return; _loadingDays=true;
  f.days = {list:[], more:true}; const id=f.id;
  const fechas=[]; for(let i=0;i<21 && fechas.length<14;i++){ const d=today(); d.setDate(d.getDate()+i); if(d.getDay()!==0) fechas.push(iso(d)); }
  let fails=0, busy=false;
  const step = async (fe) => { try{ const s = await getSlots(f.idProf, fe); f.slots[fe]=s||[]; if(s&&s.length){ f.days.list.push(fe); f.days.list.sort(); } }catch(e){ fails++; if(e.kind==='busy') busy=true; if(e.kind==='auth'){ toLogin(); } } };
  try{
    for (let i=0;i<fechas.length;i+=3){
      await Promise.all(fechas.slice(i,i+3).map(step));
      if (S.flow!==f) return;
      if (route().name==='cambiar' && (route().sub||'dia')==='dia') render();
      if (f.days.list.length>=6) break;
    }
    f.days.more=false;
    if (!f.days.list.length && fails) f.days = {error: busy?'Hay mucha gente consultando horas en este momento. Espere un minuto y vuelva a intentar.':'No pudimos revisar las horas libres. Revise su señal e intente de nuevo.'};
    saveFlow();
    if (route().name==='cambiar' && route().id===id) render();
  } finally { _loadingDays=false; }
}
function pickDia(d){ S.flow.dia=d; S.flow.hora=null; S.flow.err=''; saveFlow(); go('cambiar/'+S.flow.id+'/hora'); }
function pickHora(h){ const s=(S.flow.slots[S.flow.dia]||[]).find(x=>x.hora_inicio===h); S.flow.hora=s; S.flow.err=''; saveFlow(); go('cambiar/'+S.flow.id+'/revisar'); }
function telLocal(p){ const d=String(p||'').replace(/\D/g,''); return d.startsWith('569')&&d.length===11?d.slice(3):d.length===9&&d[0]==='9'?d.slice(1):''; }
async function confirmarCambio(){
  const f=S.flow; const c=citaById(f.id); const b=$('#cbBtn'); if(!c||S.busy) return;
  const tel = ($('#tel').value||'').replace(/\D/g,''); const cons = $('#consent').checked;
  const showErr = m => { f.err=m; $('#cbErr').innerHTML=`<div class="err" role="alert" style="margin-top:12px">${ic('warn','style="width:22px;height:22px;flex:none"')}<span>${esc(m)}</span></div>`; };
  if (tel.length!==8){ $('#tel').setAttribute('aria-invalid','true'); $('#tel').focus(); return showErr('Escriba los 8 números de su celular (después del +56 9).'); }
  if (!cons) return showErr('Para cambiar la hora, marque la casilla de aceptación de datos.');
  S.busy=true; b.disabled=true; b.textContent='Reservando su hora nueva…'; f.err='';
  const nueva = {...c, id:null, fecha:f.dia, hora_inicio:f.hora.hora_inicio};
  try{
    let aviso = '';
    if (DEMO){
      await new Promise(r=>setTimeout(r,900));
      const P=DEMO_PEOPLE[demoActive]; const nid = Date.now()%100000;
      P.citas_futuras = P.citas_futuras.filter(x=>String(x.id)!==String(c.id)).concat([{...nueva,id:nid}]); S.d=demoData(); nueva.id=nid;
    } else {
      const res = await api('/agendar/api/reservar',{method:'POST',body:JSON.stringify({consent:true, rut:rutApi(activeRut()), telefono:'569'+tel, id_profesional:+c.id_profesional, fecha:f.dia, hora_inicio:f.hora.hora_inicio, hora_fin:f.hora.hora_fin, es_tercero: !!S.d.is_dependent})},30000);
      nueva.id = res.id_cita;
      b.textContent='Liberando su hora anterior…';
      try{ await api('/agendar/api/cancelar',{method:'POST',body:JSON.stringify({rut:rutApi(activeRut()), id_cita:String(c.id), telefono:'569'+tel})},25000); }
      catch(e){ aviso = 'Su hora NUEVA quedó lista, pero no alcanzamos a liberar la anterior ('+fCorta(c.fecha)+' a las '+hhmm(c.hora_inicio)+'). Anúlela desde "Mis horas" o escríbanos y lo hacemos por usted.'; }
      track('cita_cambia_exito');
      try{ await loadAll(); }catch(e){}
    }
    S.flow = {cambio:{old:c, nueva, aviso}}; try{ sessionStorage.removeItem('cmc_app_flow'); }catch(e){}
    location.replace('#listo/cambio');
  }catch(e){
    S.busy=false; b.disabled=false; b.textContent='Cambiar mi hora al '+fCorta(f.dia)+' a las '+hhmm(f.hora.hora_inicio);
    if (e.kind==='auth') return toLogin();
    const det = e.data && e.data.detail;
    if (det && det.error==='cupo_tomado'){ f.slots[f.dia]=(f.slots[f.dia]||[]).filter(s=>s.hora_inicio!==f.hora.hora_inicio); f.hora=null; f.err='Esa hora se acaba de ocupar. Elija otra, por favor.'; saveFlow(); return go('cambiar/'+f.id+'/hora'); }
    if (det && det.error==='duplicado') return showErr('Ya tiene una hora con este profesional ese día. Elija otro día o escríbanos por WhatsApp.');
    if (e.kind==='timeout' || e.kind==='offline') return showErr('Se cortó la conexión. Antes de intentar de nuevo, revise en "Mis horas" si la hora nueva quedó tomada.');
    showErr(e.message);
  } finally { S.busy=false; }
}

    <form onsubmit="pedirCodigo(event)" novalidate style="margin-top:20px">
      <label class="lbl" for="rut">Su RUT</label>
      <input id="rut" class="inp" inputmode="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="12.345.678-9" value="${esc(rutFmt(L_.rut))}" aria-describedby="rutH rutE" ${L_.err?'aria-invalid="true"':''} oninput="rutInput(this)" maxlength="12">
      <p class="hint" id="rutH">Con puntos o sin puntos. Si termina en K, escríbala.</p>
      <div id="rutE">${L_.err?`<p class="err" role="alert">${ic('warn','style="width:22px;height:22px;flex:none"')}<span>${esc(L_.err)}</span></p>`:''}</div>
      <div class="btns" style="margin-top:20px">
        <button class="btn pri" id="lgBtn" type="submit">${ic('wa')}Recibir mi código por WhatsApp</button>
        <button class="btn sec" type="button" onclick="pedirLink()">Prefiero un link para entrar</button>
      </div>
    </form>
    <p class="muted small" style="margin-top:16px">Le enviamos un mensaje al WhatsApp que tiene registrado en el centro.</p>
    <p style="margin-top:14px"><a href="?demo=1" style="font-weight:600">Ver un ejemplo con datos inventados</a></p>`;
  else if (L_.step==='code') body = `
    <span class="step">Paso 2 de 2</span>
    <h1>Escriba el código que le llegó</h1>
    <p class="lead">Lo enviamos por WhatsApp${L_.masked?' a la ficha del RUT '+esc(L_.masked):''}. Son 6 números.</p>
    <form onsubmit="verificar(event)" novalidate style="margin-top:18px">
      <label class="lbl sr" for="otp">Código de 6 números</label>
      <input id="otp" class="inp otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" aria-describedby="otpE" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6); if(this.value.length===6) verificar()">
      <div id="otpE">${L_.err?`<p class="err" role="alert">${ic('warn','style="width:22px;height:22px;flex:none"')}<span>${esc(L_.err)}</span></p>`:''}</div>
      <div class="btns" style="margin-top:20px"><button class="btn pri" id="otpBtn" type="submit">Entrar</button>
      <button class="btn sec" type="button" id="resend" onclick="pedirCodigo()" disabled>Enviar otro código</button>
      <button class="btn sec" type="button" onclick="L_.step='rut';L_.err='';renderLogin()">Cambiar el RUT</button></div>
    </form>
    <p class="muted small" style="margin-top:14px">El código vence en 10 minutos.</p>`;
  else if (L_.step==='link') body = `
    <div class="done-ic">${ic('wa')}</div>
    <h1>Revise su WhatsApp</h1>
    <p class="lead">Le enviamos un link. Tóquelo y entra directo, sin código. Vence en 30 minutos.</p>
    <div class="btns" style="margin-top:20px"><button class="btn sec" onclick="L_.step='rut';renderLogin()">Volver</button></div>`;
  $('#app').classList.add('noNav');
  $('#app').innerHTML = `<div class="wrap login view"><div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><img class="logo" style="margin:0" src="/static/isotipo.png" alt="" width="64" height="64"><p style="font-family:var(--f-head);font-weight:700;color:var(--navy);line-height:1.2">Centro Médico<br>Carampangue</p></div>${body}
    <div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--line)"><p class="small muted">¿No le llega el mensaje o no tiene WhatsApp registrado?</p>
    <div class="row2" style="margin-top:10px"><a class="btn sec" href="${wa('Hola, quiero activar mi portal del paciente.')}" target="_blank" rel="noopener">${ic('wa')}WhatsApp</a><a class="btn sec" href="tel:${FIJO_TEL}">${ic('phone')}Llamar</a></div></div></div>`;
  const inp = $('#rut')||$('#otp'); inp && setTimeout(()=>inp.focus(),60);
  if (L_.step==='code'){ const rb=$('#resend'); const wait=Math.max(0,30-Math.floor((Date.now()-L_.sent)/1000)); if(rb){ if(wait>0){ rb.textContent='Enviar otro código (en '+wait+' s)'; const t=setInterval(()=>{ const w=Math.max(0,30-Math.floor((Date.now()-L_.sent)/1000)); if(!document.body.contains(rb)) return clearInterval(t); rb.textContent=w?'Enviar otro código (en '+w+' s)':'Enviar otro código'; rb.disabled=!!w; if(!w) clearInterval(t); },1000);} else rb.disabled=false; } }
}
function rutInput(el){ const pos=el.value.length; el.value = rutFmt(el.value).slice(0,12); L_.rut = rutClean(el.value); if(L_.err){ L_.err=''; $('#rutE').innerHTML=''; el.removeAttribute('aria-invalid'); } }
function rutCheck(){
  const r = L_.rut;
  if (!r) return 'Escriba su RUT.';
  if (r.length<8) return 'Le faltan números al RUT. Revise que esté completo, con el número después del guion.';
  if (!rutOk(r)) return 'El número después del guion no corresponde a ese RUT. Revíselo en su cédula.';
  return '';
}
async function pedirCodigo(ev){
  ev && ev.preventDefault && ev.preventDefault();
  const e = rutCheck(); if (e){ L_.err=e; return renderLogin(); }
  const b = $('#lgBtn')||$('#resend'); if(b){ b.disabled=true; b.textContent='Enviando…'; }
  try{
    const r = await apiLogin('/portal/api/request-code',{rut:rutApi(L_.rut)});
    L_.masked = r.rut_masked||''; L_.step='code'; L_.err= r.demo&&r.hint ? r.hint : ''; L_.sent=Date.now(); renderLogin(); say('Código enviado por WhatsApp.');
  }catch(x){ L_.err = loginMsg(x); renderLogin(); }
}
async function pedirLink(){
  const e = rutCheck(); if (e){ L_.err=e; return renderLogin(); }
  try{ const r = await apiLogin('/portal/api/request-link',{rut:rutApi(L_.rut)}); track('magic_link_pide'); if(r.demo){ L_.err=r.hint||''; L_.step='code'; L_.sent=Date.now(); } else L_.step='link'; renderLogin(); }
  catch(x){ L_.err = loginMsg(x); renderLogin(); }
}
async function verificar(ev){
  ev && ev.preventDefault && ev.preventDefault();
  const code = ($('#otp').value||'').replace(/\D/g,''); if (code.length!==6){ L_.err='El código tiene 6 números.'; return renderLogin(); }
  const b=$('#otpBtn'); if(b){ b.disabled=true; b.textContent='Entrando…'; }
  try{ await apiLogin('/portal/api/verify-code',{rut:rutApi(L_.rut), code}); L_.err=''; await boot(); }
  catch(x){ L_.err = x.status===401 ? 'Ese código no es correcto o ya venció. Revíselo o pida otro.' : loginMsg(x); renderLogin(); }
}
async function apiLogin(url, body){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),20000); let r;
  try{ r = await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal}); }
  catch(e){ throw new NetErr('offline','No hay conexión. Revise su señal e intente de nuevo.'); } finally{ clearTimeout(t); }
  let d=null; try{ d=await r.json(); }catch(e){}
  if (r.ok) return d||{};
  throw new NetErr('bad', (d&&typeof d.detail==='string'&&d.detail)||'', r.status, d);
}
function loginMsg(x){
  if (x.status===404) return x.message && /WhatsApp/.test(x.message) ? 'Su RUT está en el centro, pero aún no tiene WhatsApp registrado. Escríbanos al +56 9 6661 0737 y lo activamos.' : 'No encontramos ese RUT en el centro. Revíselo, o escríbanos si es su primera vez.';
  if (x.status===429) return 'Pidió varios códigos seguidos. Espere unos minutos y vuelva a intentar.';
  if (x.status===400) return 'Revise el RUT: algún número no calza.';
  return x.message || 'No pudimos enviar el mensaje. Intente de nuevo en un momento.';
}
async function logout(){
  try{ if(!DEMO) await fetch('/portal/api/logout',{method:'POST',credentials:'same-origin'}); }catch(e){}
  store('cmc_app_citas'); try{ sessionStorage.clear(); }catch(e){}
  if (DEMO){ location.href = location.pathname; return; }
  location.hash=''; S.d=null; toLogin();
}

/* ════════════════════════════════════════════════════════════════════
   Arranque
   ═══════════════════════════════════════════════════════════════════ */
(function(){ const fz=load('cmc_app_fz'); if(fz&&fz!=='100') document.documentElement.classList.add('fz-'+fz); })();
async function boot(){
  try{
    await loadAll(); S.offline=false;
    if (!location.hash) history.replaceState(null,'','#inicio');
    render();
  }catch(e){
    if (e.kind==='auth' || e.status===404 && !DEMO && e.kind==='bad'){ toLogin(e.status===404?'No encontramos su ficha. Escríbanos por WhatsApp y lo revisamos.':''); return; }
    const c = load('cmc_app_citas');
    if ((e.kind==='offline'||e.kind==='timeout') && c){ S.offline=true; track('offline'); S.d={nombre:c.nombre, rut:c.rut, citas_futuras:c.citas, historial:[], demo:false}; S.family=[]; render(); return; }
    $('#top').hidden=true; $('#nav').hidden=true; renderBands();
    $('#app').innerHTML = `<div class="wrap view" style="padding-top:40px"><img class="logo" src="/static/isotipo.png" alt="" width="56" height="56" style="width:56px;border-radius:16px;background:#fff;padding:5px;box-shadow:var(--sh-1)"><h1>No pudimos abrir su portal</h1>${errorBlock(e,'boot()')}</div>`;
  }
}
boot();
</script>
</body>
</html>
