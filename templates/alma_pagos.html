<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pagos — Alma CMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --aqua:   #4FBECE;
    --aqua-s: #e8f8fb;
    --blue:   #1172AB;
    --navy:   #0F3F68;
    --navy2:  #0c3556;
    --bg:     #F7FBFD;
    --border: #d6e4ec;
    --text:   #0F3F68;
    --mute:   #62788a;
    --red:    #e84545;
    --green:  #23c25e;
    --sh-sm:  0 1px 3px rgba(15,63,104,.08);
    --sh-md:  0 8px 30px rgba(15,63,104,.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Montserrat', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }

  /* ── Topbar ── */
  .pg-topbar {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 20px; height: 54px;
    box-shadow: var(--sh-sm); position: sticky; top: 0; z-index: 20;
  }
  .pg-topbar h1 {
    font-size: 15px; font-weight: 700; margin: 0; color: var(--navy);
  }
  .pg-topbar .spacer { flex: 1; }
  .pg-topbar .date-nav {
    display: flex; align-items: center; gap: 6px;
  }
  .pg-topbar .date-nav button {
    background: none; border: 1px solid var(--border); color: var(--blue);
    border-radius: 7px; padding: 5px 9px; font-family: inherit;
    font-size: 12px; font-weight: 600; cursor: pointer; transition: all .14s;
  }
  .pg-topbar .date-nav button:hover { background: var(--aqua-s); border-color: var(--aqua); }
  .pg-topbar .date-nav input[type=date] {
    font-family: inherit; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 9px; color: var(--navy); background: #fff; cursor: pointer;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--aqua); color: #fff; border: 0;
    border-radius: 9px; padding: 8px 16px;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .15s; box-shadow: 0 2px 8px rgba(79,190,206,.3);
  }
  .btn-primary:hover { background: var(--blue); box-shadow: 0 4px 14px rgba(17,114,171,.35); }
  .btn-primary svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── KPI strip ── */
  .kpi-strip {
    display: flex; gap: 12px; padding: 14px 20px;
    flex-wrap: wrap;
  }
  .kpi {
    background: #fff; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 18px;
    min-width: 140px; box-shadow: var(--sh-sm);
    flex: 1;
  }
  .kpi .label { font-size: 10px; font-weight: 700; text-transform: uppercase;
                 letter-spacing: .1em; color: var(--mute); margin-bottom: 4px; }
  .kpi .value { font-size: 22px; font-weight: 800; color: var(--navy); }
  .kpi .value.green { color: var(--green); }

  /* ── Tabla de pagos ── */
  .table-wrap {
    margin: 0 20px 24px;
    background: #fff; border-radius: 14px; border: 1px solid var(--border);
    box-shadow: var(--sh-sm); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: linear-gradient(180deg, var(--navy), var(--navy2));
    color: #b8d4e8; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    padding: 10px 12px; text-align: left; white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr:hover { background: var(--aqua-s); }
  tbody td { padding: 10px 12px; vertical-align: middle; }
  .td-actions { display: flex; gap: 5px; }
  .btn-icon {
    background: none; border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 7px; cursor: pointer; color: var(--mute);
    transition: all .13s; display: grid; place-items: center;
  }
  .btn-icon:hover { background: var(--aqua-s); border-color: var(--aqua); color: var(--blue); }
  .btn-icon.del:hover { background: #fff0f0; border-color: var(--red); color: var(--red); }
  .btn-icon svg { width: 14px; height: 14px; }

  /* Pill previsión */
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  }
  .pill.fonasa   { background: #dff5ea; color: #1a7a42; }
  .pill.particular { background: #e8f2fb; color: var(--blue); }

  /* Pill método */
  .pill.metodo { background: var(--aqua-s); color: var(--blue); }

  /* Empty state */
  .empty {
    text-align: center; padding: 40px 20px; color: var(--mute);
    font-size: 13px; font-weight: 600;
  }

  /* ── Modal ── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(15,63,104,.45); z-index: 100;
    align-items: flex-start; justify-content: center;
    padding: 30px 16px; overflow-y: auto;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; border-radius: 18px;
    box-shadow: var(--sh-md); width: 100%; max-width: 620px;
    padding: 28px; position: relative;
  }
  .modal h2 {
    font-size: 17px; font-weight: 800; color: var(--navy);
    margin: 0 0 20px;
  }
  .modal-close {
    position: absolute; top: 18px; right: 18px;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    width: 32px; height: 32px; display: grid; place-items: center;
    cursor: pointer; color: var(--mute); transition: all .13s;
  }
  .modal-close:hover { background: #fff0f0; border-color: var(--red); color: var(--red); }
  .modal-close svg { width: 16px; height: 16px; }

  /* Form grid */
  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .field label {
    display: block; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--mute); margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%; font-family: inherit; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 12px; color: var(--navy); background: #fff;
    transition: border-color .13s;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--aqua);
    box-shadow: 0 0 0 3px rgba(79,190,206,.15);
  }
  .field .hint {
    font-size: 10px; color: var(--mute); margin-top: 3px;
  }
  /* Suggested value indicator */
  .field input.suggested, .field select.suggested {
    background: #fafeff;
    border-color: var(--aqua);
  }

  /* Toggle previsión */
  .seg-toggle {
    display: flex; gap: 0; border: 1px solid var(--border);
    border-radius: 9px; overflow: hidden; width: 100%;
  }
  .seg-toggle button {
    flex: 1; border: 0; background: none; font-family: inherit;
    font-size: 12px; font-weight: 700; padding: 9px 8px;
    cursor: pointer; transition: all .13s; color: var(--mute);
  }
  .seg-toggle button.active {
    background: var(--aqua); color: #fff;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  }

  /* Método de pago — 4 botones */
  .metodo-grid {
    display: grid; grid-template-columns: repeat(4,1fr); gap: 6px;
  }
  .metodo-btn {
    border: 1px solid var(--border); border-radius: 9px;
    background: #fff; font-family: inherit; font-size: 11px; font-weight: 700;
    padding: 9px 4px; cursor: pointer; transition: all .13s; color: var(--mute);
    text-align: center;
  }
  .metodo-btn.active {
    background: var(--navy); color: #fff; border-color: var(--navy);
  }

  /* Bonif row (solo si fonasa) */
  .bonif-row { display: none; }
  .bonif-row.show { display: contents; }

  /* Form actions */
  .form-actions {
    display: flex; gap: 10px; justify-content: flex-end;
    margin-top: 22px;
  }
  .btn-cancel {
    background: none; border: 1px solid var(--border); color: var(--mute);
    border-radius: 9px; padding: 9px 18px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .13s;
  }
  .btn-cancel:hover { background: #f5f8fa; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 200;
    background: var(--navy); color: #fff; border-radius: 12px;
    padding: 12px 20px; font-size: 13px; font-weight: 600;
    box-shadow: var(--sh-md);
    transform: translateY(80px); opacity: 0;
    transition: transform .25s cubic-bezier(.4,0,.2,1), opacity .25s;
    pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: #1a7a42; }
  .toast.error   { background: var(--red); }

  /* Loading */
  .loading { text-align: center; padding: 28px; color: var(--mute); font-size: 13px; font-weight: 600; }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .full { grid-column: 1; }
    .metodo-grid { grid-template-columns: repeat(2,1fr); }
    .kpi-strip { gap: 8px; padding: 12px; }
    .kpi { min-width: 120px; }
    .table-wrap { margin: 0 12px 20px; font-size: 12px; }
    .pg-topbar { padding: 0 12px; }
  }
</style>
</head>
<body>

<!-- Topbar -->
<div class="pg-topbar">
  <h1>Pagos</h1>
  <div class="date-nav">
    <button id="btnPrevDay" title="Dia anterior">&#8592;</button>
    <input type="date" id="pickerFecha">
    <button id="btnNextDay" title="Dia siguiente">&#8594;</button>
    <button id="btnHoy">Hoy</button>
  </div>
  <div class="spacer"></div>
  <button class="btn-primary" id="btnNuevoPago">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Registrar pago
  </button>
</div>

<!-- KPI strip -->
<div class="kpi-strip" id="kpiStrip">
  <div class="kpi"><div class="label">Pagos del dia</div><div class="value" id="kpiN">—</div></div>
  <div class="kpi"><div class="label">Copagos</div><div class="value" id="kpiCopago">—</div></div>
  <div class="kpi"><div class="label">Bonif. Imed</div><div class="value" id="kpiBonif">—</div></div>
  <div class="kpi"><div class="label">Total recaudado</div><div class="value green" id="kpiTotal">—</div></div>
</div>

<!-- Tabla -->
<div class="table-wrap">
  <table id="tablaPagos">
    <thead>
      <tr>
        <th>#</th>
        <th>Hora</th>
        <th>Paciente</th>
        <th>RUT</th>
        <th>Profesional</th>
        <th>Area</th>
        <th>Prevision</th>
        <th>Copago</th>
        <th>Bonif.</th>
        <th>Metodo</th>
        <th>Folio</th>
        <th>Origen</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tablaPagosBody">
      <tr><td colspan="13" class="loading">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<!-- ── Modal formulario ── -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" id="modalClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <h2 id="modalTitle">Registrar pago</h2>

    <div class="form-grid" id="formGrid">

      <!-- Paciente / RUT -->
      <div class="field full">
        <label>Paciente</label>
        <input type="text" id="fNombre" placeholder="Nombre completo" autocomplete="off">
      </div>
      <div class="field">
        <label>RUT</label>
        <input type="text" id="fRut" placeholder="12.345.678-9" autocomplete="off">
        <div class="hint">Al ingresar RUT se pre-llena el paciente.</div>
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fFecha">
      </div>

      <!-- Profesional / Area -->
      <div class="field">
        <label>Profesional</label>
        <select id="fProf">
          <option value="">— Seleccionar —</option>
        </select>
      </div>
      <div class="field">
        <label>Area</label>
        <input type="text" id="fArea" placeholder="Ej: Medicina General">
        <div class="hint">Se sugiere segun profesional.</div>
      </div>

      <!-- Previsión -->
      <div class="field full">
        <label>Prevision</label>
        <div class="seg-toggle">
          <button class="active" data-prev="particular" id="btnParticular">Particular</button>
          <button data-prev="fonasa" id="btnFonasa">Fonasa MLE</button>
        </div>
      </div>

      <!-- Copago + Bonif -->
      <div class="field">
        <label>Copago paciente ($)</label>
        <input type="number" id="fCopago" min="0" step="1" placeholder="0">
        <div class="hint" id="hintCopago"></div>
      </div>
      <div class="field bonif-row" id="rowBonif">
        <label>Bonif. Imed ($)</label>
        <input type="number" id="fBonif" min="0" step="1" placeholder="0">
        <div class="hint" id="hintBonif"></div>
      </div>

      <!-- Método de pago -->
      <div class="field full">
        <label>Metodo de pago</label>
        <div class="metodo-grid">
          <button class="metodo-btn active" data-metodo="efectivo">Efectivo</button>
          <button class="metodo-btn" data-metodo="transferencia">Transferencia</button>
          <button class="metodo-btn" data-metodo="debito">Debito</button>
          <button class="metodo-btn" data-metodo="credito">Credito</button>
        </div>
        <div class="hint" id="hintMetodo"></div>
      </div>

      <!-- Folio / codigo transferencia -->
      <div class="field">
        <label>Folio</label>
        <input type="text" id="fFolio" placeholder="N° folio (opcional)">
      </div>
      <div class="field" id="rowCodTransf" style="display:none">
        <label>Codigo transferencia</label>
        <input type="text" id="fCodTransf" placeholder="Opcional">
      </div>

      <!-- Procedimiento / Origen -->
      <div class="field full">
        <label>Procedimiento</label>
        <input type="text" id="fProcedimiento" placeholder="Ej: Consulta medica, Control kine sesion 3...">
      </div>
      <div class="field">
        <label>Origen</label>
        <select id="fOrigen">
          <option value="presencial">Presencial</option>
          <option value="telefono">Telefono</option>
          <option value="chat">Chat WhatsApp</option>
        </select>
      </div>
      <div class="field">
        <label>ID Cita Medilink</label>
        <input type="text" id="fIdCita" placeholder="Opcional">
      </div>

    </div><!-- /form-grid -->

    <div class="form-actions">
      <button class="btn-cancel" id="btnCancelarModal">Cancelar</button>
      <button class="btn-primary" id="btnGuardarPago">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        Guardar
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const TOKEN = "__TOKEN__";
const qp = TOKEN ? ("?token=" + encodeURIComponent(TOKEN)) : "";

// ── Profesionales (cargados al inicio) ──────────────────────────────────────
let PROFESIONALES = [];
let AREAS_FONASA  = [];
let _editingId    = null;
let _prevision    = "particular";
let _metodo       = "efectivo";

// ── Fecha activa ─────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return d.toLocaleDateString('en-CA'); // YYYY-MM-DD en locale neutro
}
let _fecha = todayStr();
document.getElementById('pickerFecha').value = _fecha;

function setFecha(f) {
  _fecha = f;
  document.getElementById('pickerFecha').value = f;
  cargarPagos();
}

document.getElementById('pickerFecha').addEventListener('change', e => setFecha(e.target.value));
document.getElementById('btnPrevDay').addEventListener('click', () => {
  const d = new Date(_fecha + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  setFecha(d.toLocaleDateString('en-CA'));
});
document.getElementById('btnNextDay').addEventListener('click', () => {
  const d = new Date(_fecha + 'T12:00:00');
  d.setDate(d.getDate() + 1);
  setFecha(d.toLocaleDateString('en-CA'));
});
document.getElementById('btnHoy').addEventListener('click', () => setFecha(todayStr()));

// ── Helpers ──────────────────────────────────────────────────────────────────
const fmt$ = n => n == null ? '—' : '$' + Number(n).toLocaleString('es-CL');
const fmtHora = s => s ? s.slice(0,5) : '—';

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._tmr);
  t._tmr = setTimeout(() => t.className = 'toast', 2800);
}

// ── Cargar profesionales + arancel ──────────────────────────────────────────
async function initData() {
  try {
    const [rProfs, rArancel] = await Promise.all([
      fetch('/alma/api/agenda/profesionales' + qp),
      fetch('/alma/api/pagos/arancel' + qp),
    ]);
    if (rProfs.ok) {
      const d = await rProfs.json();
      PROFESIONALES = d.profesionales || [];
      const sel = document.getElementById('fProf');
      PROFESIONALES.forEach(p => {
        const o = document.createElement('option');
        o.value = p.id;
        o.textContent = p.nombre + ' — ' + p.especialidad;
        o.dataset.esp = p.especialidad;
        sel.appendChild(o);
      });
    }
    if (rArancel.ok) {
      const d = await rArancel.json();
      AREAS_FONASA = d.areas_fonasa || [];
    }
  } catch(e) {
    console.warn('initData error:', e);
  }
}

// ── Cargar pagos del día ──────────────────────────────────────────────────
async function cargarPagos() {
  const tbody = document.getElementById('tablaPagosBody');
  tbody.innerHTML = '<tr><td colspan="13" class="loading">Cargando...</td></tr>';
  try {
    const r = await fetch('/alma/api/pagos' + qp + '&fecha=' + _fecha);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    renderKPIs(d);
    renderTabla(d.pagos || []);
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="13" class="empty">Error al cargar pagos.</td></tr>';
    console.error(e);
  }
}

function renderKPIs(d) {
  document.getElementById('kpiN').textContent = d.total || 0;
  document.getElementById('kpiCopago').textContent = fmt$(d.total_copago);
  document.getElementById('kpiBonif').textContent  = fmt$(d.total_bonif);
  document.getElementById('kpiTotal').textContent  = fmt$(d.total_recaudado);
}

function renderTabla(pagos) {
  const tbody = document.getElementById('tablaPagosBody');
  if (!pagos.length) {
    tbody.innerHTML = '<tr><td colspan="13" class="empty">Sin pagos registrados para este dia.</td></tr>';
    return;
  }
  tbody.innerHTML = pagos.map((p, i) => `
    <tr>
      <td style="color:var(--mute);font-size:11px">${i+1}</td>
      <td>${fmtHora(p.hora)}</td>
      <td style="font-weight:600">${esc(p.paciente_nombre)}</td>
      <td style="color:var(--mute)">${esc(p.rut || '—')}</td>
      <td>${esc(p.profesional || '—')}</td>
      <td>${esc(p.area || '—')}</td>
      <td><span class="pill ${p.prevision}">${p.prevision === 'fonasa' ? 'Fonasa' : 'Particular'}</span></td>
      <td style="font-weight:700;color:var(--navy)">${fmt$(p.copago)}</td>
      <td style="color:var(--mute)">${p.bonificacion ? fmt$(p.bonificacion) : '—'}</td>
      <td><span class="pill metodo">${capitalize(p.metodo_pago)}</span></td>
      <td style="color:var(--mute);font-size:11px">${esc(p.folio || '—')}</td>
      <td style="color:var(--mute);font-size:11px">${capitalize(p.origen)}</td>
      <td>
        <div class="td-actions">
          <button class="btn-icon" title="Editar" onclick="abrirEditar(${p.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon del" title="Eliminar" onclick="eliminarPago(${p.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          </button>
        </div>
      </td>
    </tr>
  `).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}

// ── Modal — abrir nuevo ───────────────────────────────────────────────────────
document.getElementById('btnNuevoPago').addEventListener('click', () => abrirNuevo());

function abrirNuevo(preData = {}) {
  _editingId = null;
  document.getElementById('modalTitle').textContent = 'Registrar pago';
  resetForm();
  // Pre-fill con datos externos (ej: botón "Pago" del chat)
  if (preData.paciente_nombre) document.getElementById('fNombre').value = preData.paciente_nombre;
  if (preData.rut) {
    document.getElementById('fRut').value = preData.rut;
    cargarSugerencia(preData.rut, preData.id_cita || null);
  }
  if (preData.id_cita) {
    document.getElementById('fIdCita').value = preData.id_cita;
    if (!preData.rut) cargarSugerencia(null, preData.id_cita);
  }
  document.getElementById('fFecha').value = _fecha;
  document.getElementById('modalBg').classList.add('open');
}

// Escuchar mensajes del panel admin_v2 (botón Pago en conversación)
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'ALMA_ABRIR_PAGO') {
    abrirNuevo(e.data.payload || {});
  }
});

function abrirEditar(id) {
  _editingId = id;
  document.getElementById('modalTitle').textContent = 'Editar pago';
  // Buscar fila en la tabla actual
  fetch('/alma/api/pagos' + qp + '&fecha=' + _fecha)
    .then(r => r.json())
    .then(d => {
      const p = (d.pagos || []).find(x => x.id === id);
      if (!p) { showToast('No se encontró el registro', 'error'); return; }
      resetForm();
      document.getElementById('fNombre').value      = p.paciente_nombre || '';
      document.getElementById('fRut').value         = p.rut || '';
      document.getElementById('fFecha').value       = p.fecha || '';
      document.getElementById('fArea').value        = p.area || '';
      document.getElementById('fCopago').value      = p.copago || 0;
      document.getElementById('fBonif').value       = p.bonificacion || 0;
      document.getElementById('fFolio').value       = p.folio || '';
      document.getElementById('fCodTransf').value   = p.codigo_transferencia || '';
      document.getElementById('fProcedimiento').value = p.procedimiento || '';
      document.getElementById('fIdCita').value      = p.id_cita || '';
      setPrevision(p.prevision || 'particular');
      setMetodo(p.metodo_pago || 'efectivo');
      // Profesional
      if (p.id_profesional) {
        document.getElementById('fProf').value = p.id_profesional;
      }
      // Origen
      document.getElementById('fOrigen').value = p.origen || 'presencial';
      document.getElementById('modalBg').classList.add('open');
    });
}

function cerrarModal() {
  document.getElementById('modalBg').classList.remove('open');
  _editingId = null;
}
document.getElementById('modalClose').addEventListener('click', cerrarModal);
document.getElementById('btnCancelarModal').addEventListener('click', cerrarModal);
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBg')) cerrarModal();
});

// ── Formulario helpers ────────────────────────────────────────────────────────
function resetForm() {
  ['fNombre','fRut','fArea','fCopago','fBonif','fFolio','fCodTransf','fProcedimiento','fIdCita']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('fFecha').value = _fecha;
  document.getElementById('fProf').value  = '';
  document.getElementById('fOrigen').value = 'presencial';
  setPrevision('particular');
  setMetodo('efectivo');
  document.getElementById('hintCopago').textContent = '';
  document.getElementById('hintBonif').textContent  = '';
}

function setPrevision(p) {
  _prevision = p;
  document.getElementById('btnParticular').classList.toggle('active', p === 'particular');
  document.getElementById('btnFonasa').classList.toggle('active',     p === 'fonasa');
  const rowB = document.getElementById('rowBonif');
  rowB.classList.toggle('show', p === 'fonasa');
  // Mostrar/ocultar campo metodo credito hint (dental-only)
  updateMetodoHint();
}

function setMetodo(m) {
  _metodo = m;
  document.querySelectorAll('.metodo-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.metodo === m);
  });
  const rowCT = document.getElementById('rowCodTransf');
  rowCT.style.display = (m === 'transferencia') ? '' : 'none';
  updateMetodoHint();
}

function updateMetodoHint() {
  const hint = document.getElementById('hintMetodo');
  if (_metodo === 'credito' || _metodo === 'debito') {
    hint.textContent = 'Tarjetas solo disponibles en area dental.';
  } else {
    hint.textContent = '';
  }
}

// Eventos toggle previsión
document.getElementById('btnParticular').addEventListener('click', () => {
  setPrevision('particular');
  recalcSugerencia();
});
document.getElementById('btnFonasa').addEventListener('click', () => {
  setPrevision('fonasa');
  recalcSugerencia();
});

// Eventos botones método
document.querySelectorAll('.metodo-btn').forEach(b => {
  b.addEventListener('click', () => setMetodo(b.dataset.metodo));
});

// Cuando cambia profesional → sugerir area + copago
document.getElementById('fProf').addEventListener('change', function() {
  const opt = this.options[this.selectedIndex];
  if (opt && opt.dataset.esp) {
    document.getElementById('fArea').value = opt.dataset.esp;
    recalcSugerencia();
  }
});

// Cuando pierde foco el RUT → buscar sugerencia
document.getElementById('fRut').addEventListener('blur', function() {
  if (this.value.trim()) cargarSugerencia(this.value.trim(), null);
});

// ── Cargar sugerencia desde API ───────────────────────────────────────────────
async function cargarSugerencia(rut, id_cita) {
  let url = '/alma/api/pagos/sugerencia' + qp;
  if (rut)     url += '&rut='     + encodeURIComponent(rut);
  if (id_cita) url += '&id_cita=' + encodeURIComponent(id_cita);
  try {
    const r = await fetch(url);
    if (!r.ok) return;
    const s = await r.json();
    // Solo rellenar si los campos están vacíos (no pisar edición manual)
    const fNombre = document.getElementById('fNombre');
    if (!fNombre.value && s.paciente_nombre) fNombre.value = s.paciente_nombre;
    if (s.id_profesional) document.getElementById('fProf').value = s.id_profesional;
    if (s.area) document.getElementById('fArea').value = s.area;
    if (s.prevision) setPrevision(s.prevision);
    if (s.id_cita) document.getElementById('fIdCita').value = s.id_cita;
    // Sugerir montos
    aplicarSugerenciaMontos(s);
  } catch(e) {
    console.warn('cargarSugerencia error:', e);
  }
}

function recalcSugerencia() {
  // Recalcula montos localmente con la tabla N3 que ya conocemos del init
  const area  = document.getElementById('fArea').value.trim();
  const idProf = parseInt(document.getElementById('fProf').value) || null;
  // Pedir nueva sugerencia al server con los datos actuales
  const rut = document.getElementById('fRut').value.trim();
  // Uso ligero: solo si tenemos area o prof
  if (!area && !idProf) return;
  cargarSugerencia(rut || null, null);
}

function aplicarSugerenciaMontos(s) {
  const fC = document.getElementById('fCopago');
  const fB = document.getElementById('fBonif');
  // Marcar como sugerido visualmente
  if (s.copago_sugerido != null && !fC._edited) {
    fC.value = s.copago_sugerido;
    fC.classList.add('suggested');
  }
  if (s.bonif_sugerida != null && s.bonif_sugerida > 0 && !fB._edited) {
    fB.value = s.bonif_sugerida;
    fB.classList.add('suggested');
  }
  // Hints
  if (s.fuente === 'fonasa_n3') {
    document.getElementById('hintCopago').textContent =
      'Arancel N3: total $' + s.total_arancel?.toLocaleString('es-CL') +
      ' · Cod. ' + (s.codigo_fonasa || '');
    document.getElementById('hintBonif').textContent =
      'Bonificacion Imed sugerida';
  } else if (s.fuente === 'particular') {
    document.getElementById('hintCopago').textContent =
      s.copago_sugerido ? 'Precio particular' : '';
    document.getElementById('hintBonif').textContent = '';
  }
}

// Marcar como editado manualmente (para no pisar con sugerencia posterior)
['fCopago','fBonif'].forEach(id => {
  document.getElementById(id).addEventListener('input', function() {
    this._edited = true;
    this.classList.remove('suggested');
  });
});

// ── Guardar ───────────────────────────────────────────────────────────────────
document.getElementById('btnGuardarPago').addEventListener('click', guardarPago);

async function guardarPago() {
  const nombre = document.getElementById('fNombre').value.trim();
  if (!nombre) { showToast('Ingresa el nombre del paciente', 'error'); return; }

  const idProfRaw = document.getElementById('fProf').value;
  const profOpt   = document.querySelector(`#fProf option[value="${idProfRaw}"]`);

  const body = {
    fecha:               document.getElementById('fFecha').value,
    hora:                new Date().toLocaleTimeString('es-CL', {hour:'2-digit',minute:'2-digit'}),
    paciente_nombre:     nombre,
    rut:                 document.getElementById('fRut').value.trim(),
    id_profesional:      idProfRaw ? parseInt(idProfRaw) : null,
    profesional:         profOpt ? profOpt.textContent.split(' — ')[0].trim() : '',
    area:                document.getElementById('fArea').value.trim(),
    prevision:           _prevision,
    copago:              parseInt(document.getElementById('fCopago').value) || 0,
    bonificacion:        parseInt(document.getElementById('fBonif').value)  || 0,
    metodo_pago:         _metodo,
    folio:               document.getElementById('fFolio').value.trim(),
    codigo_transferencia: document.getElementById('fCodTransf').value.trim(),
    procedimiento:       document.getElementById('fProcedimiento').value.trim(),
    origen:              document.getElementById('fOrigen').value,
    id_cita:             document.getElementById('fIdCita').value.trim(),
    creado_por:          'recepcion',
  };

  const btn = document.getElementById('btnGuardarPago');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    let url, method;
    if (_editingId) {
      url    = '/alma/api/pagos/' + _editingId + qp;
      method = 'PATCH';
    } else {
      url    = '/alma/api/pagos' + qp;
      method = 'POST';
    }
    const r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || 'Error ' + r.status);
    }
    cerrarModal();
    showToast(_editingId ? 'Pago actualizado' : 'Pago registrado', 'success');
    cargarPagos();
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Guardar';
  }
}

// ── Eliminar ──────────────────────────────────────────────────────────────────
async function eliminarPago(id) {
  if (!confirm('¿Eliminar este registro de pago?')) return;
  try {
    const r = await fetch('/alma/api/pagos/' + id + qp, { method: 'DELETE' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    showToast('Registro eliminado', 'success');
    cargarPagos();
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
initData().then(() => cargarPagos());
</script>
