<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMC · Panel del Día · v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ALMA · sistema premium claro — Panel del Día · VERSIÓN 1
   Montserrat + aqua/navy · valorización a nivel profesional · cards 16px
═══════════════════════════════════════════════════════════════════════════ */
:root{
  --aqua:#4FBECE; --aqua-s:#e8f8fb; --blue:#1172AB; --navy:#0F3F68; --navy2:#0c3556;
  --bg:#F4FAFD; --card:#ffffff; --border:#d6e4ec; --line:#eaf1f5;
  --text:#0F3F68; --mute:#62788a; --mute2:#90a6b6;
  --red:#e84545; --red-s:#fdecec; --green:#1fb257; --green-s:#e7f9ee;
  --orange:#f0900c; --orange-s:#fef3e2; --gold:#caa11a;
  --purple:#7c5cff; --purple-s:#f0ecff;
  --sh-xs:0 1px 2px rgba(15,63,104,.06);
  --sh-sm:0 1px 3px rgba(15,63,104,.08);
  --sh-md:0 10px 34px rgba(15,63,104,.13);
  --sh-lg:0 20px 50px rgba(15,63,104,.20);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);
  background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;}
.mono{font-family:'Space Grotesk','Montserrat',sans-serif;font-variant-numeric:tabular-nums;}
#bgwrap{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 55% at 12% 8%,#e9f6fb,transparent 60%),
  radial-gradient(55% 55% at 92% 95%,#eaf3fb,transparent 60%),
  linear-gradient(165deg,#f7fcfe,#eef6fb);}
.card{position:relative;border-radius:16px;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh-sm);}
::selection{background:var(--aqua-s);}

/* ───────── topbar ───────── */
#top{height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff;
  border-bottom:1px solid var(--border);box-shadow:var(--sh-sm);position:relative;z-index:30;}
.brand{display:flex;align-items:center;gap:11px;}
.brand .orb{width:34px;height:34px;border-radius:10px;
  background:radial-gradient(circle at 32% 26%,#8af0fb,var(--blue) 60%,var(--navy));
  box-shadow:0 4px 16px rgba(79,190,206,.45),inset 0 2px 6px rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;}
.brand h1{font-size:14.5px;font-weight:800;color:var(--navy);letter-spacing:.2px;}
.brand h1 b{color:var(--blue);}
.brand .sub{font-size:8.5px;font-weight:700;color:var(--mute);letter-spacing:.18em;text-transform:uppercase;margin-top:2px;}
.brand .vtag{font-size:9px;font-weight:800;color:#fff;background:var(--navy);padding:2px 7px;border-radius:6px;margin-left:8px;letter-spacing:.08em;vertical-align:2px;}
.spacer{flex:1;}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:4px;gap:3px;}
.seg button{font-family:inherit;font-size:12px;font-weight:700;color:var(--mute);background:none;border:0;
  padding:8px 15px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(15,63,104,.28);}
.seg button:not(.on):hover{color:var(--blue);background:var(--aqua-s);}
.dpick{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:6px 10px;}
.dpick svg{width:15px;height:15px;color:var(--blue);}
.dpick input{font-family:inherit;font-size:12px;font-weight:700;color:var(--navy);border:0;background:none;outline:none;cursor:pointer;}
.dpick .sep{color:var(--mute2);font-weight:700;font-size:11px;}
.datebox{text-align:right;min-width:128px;}
.datebox .d{font-size:13.5px;font-weight:800;color:var(--navy);text-transform:capitalize;}
.datebox .h{font-size:11px;font-weight:600;color:var(--mute);}

/* ───────── layout ───────── */
#grid{position:absolute;top:48px;left:0;right:0;bottom:0;display:grid;
  grid-template-columns:288px 12px minmax(0,1fr) 12px minmax(0,1.55fr);gap:0;padding:10px 14px;}
.col{min-height:0;display:flex;flex-direction:column;gap:7px;}
/* manijas redimensionables entre macrocolumnas */
.gutter{position:relative;cursor:col-resize;display:flex;align-items:center;justify-content:center;z-index:20;}
.gutter::before{content:'';width:3px;height:34px;border-radius:3px;background:var(--border);
  transition:background .15s,height .15s,box-shadow .15s;}
.gutter:hover::before,.gutter.active::before{background:var(--aqua);height:66px;box-shadow:0 0 0 3px var(--aqua-s);}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none;}
.col-scroll{overflow-y:auto;overflow-x:hidden;padding-right:4px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;}
.col-scroll::-webkit-scrollbar{width:6px;}
.col-scroll::-webkit-scrollbar-thumb{background:#cfe0ea;border-radius:10px;}
.col-scroll::-webkit-scrollbar-thumb:hover{background:#b3cedd;}
.col-head{display:flex;align-items:center;gap:8px;padding:0 2px;}
.col-title{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);white-space:nowrap;}
.col-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.col-head .badge{font-size:9.5px;font-weight:700;color:var(--mute);letter-spacing:.02em;}

/* ───────── KPI (compactas) ───────── */
.kcard{padding:9px 12px;border-radius:12px;position:relative;overflow:hidden;flex:none;
  background:#fff;border:1px solid var(--border);box-shadow:var(--sh-xs);transition:box-shadow .2s;}
.kcard:hover{box-shadow:var(--sh-md);}
.kcard::after{content:'';position:absolute;right:-22px;top:-22px;width:64px;height:64px;border-radius:50%;opacity:.5;}
.kcard.real::after{background:var(--green-s);} .kcard.esp::after{background:var(--aqua-s);} .kcard.pot::after{background:var(--orange-s);}
.kcard .ktop{display:flex;align-items:center;gap:8px;position:relative;z-index:1;}
.kcard .ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;}
.kcard .ic svg{width:13px;height:13px;}
.kcard.real .ic{background:var(--green-s);color:var(--green);}
.kcard.esp .ic{background:var(--aqua-s);color:var(--blue);}
.kcard.pot .ic{background:var(--orange-s);color:var(--orange);}
.kcard .klab{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);}
.kcard .kchip{margin-left:auto;margin-top:0;}
.kcard .kval{font-size:23px;font-weight:800;color:var(--navy);margin-top:5px;line-height:.95;letter-spacing:-.6px;position:relative;z-index:1;}
.kcard .kval .c{font-size:13px;font-weight:800;vertical-align:5px;margin-right:1px;color:var(--mute2);}
.kcard.pot .kval{color:var(--orange);}
.kcard .ksub{font-size:9.5px;font-weight:600;color:var(--mute);margin-top:4px;line-height:1.4;position:relative;z-index:1;}
.kcard .ksub b{font-weight:800;color:var(--navy);}
.kbar{height:5px;border-radius:999px;background:var(--line);margin-top:6px;overflow:hidden;position:relative;z-index:1;}
.kbar i{display:block;height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);}
.kcard.real .kbar i{background:linear-gradient(90deg,var(--green),#5fd98e);}
.kcard.esp .kbar i{background:linear-gradient(90deg,var(--aqua),#8ae0ec);}
.kcard.pot .kbar i{background:linear-gradient(90deg,var(--orange),#ffc061);}
.kchip{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:7px;position:relative;z-index:1;}
.kchip svg{width:11px;height:11px;}
.kchip.up{background:var(--green-s);color:var(--green);}
.kchip.down{background:var(--red-s);color:var(--red);}
.kchip.flat{background:var(--line);color:var(--mute);}
.kmini{display:flex;gap:6px;margin-top:7px;}
.kmini .m{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 8px;text-align:center;}
.kmini .m .v{font-size:14px;font-weight:800;color:var(--navy);}
.kmini .m .l{font-size:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-top:1px;}
.kmini .m.fon .v{color:var(--blue);} .kmini .m.par .v{color:var(--purple);}

/* ───────── cards profesional (densas, una fila) ───────── */
.pcard{flex:none;display:flex;align-items:center;gap:10px;border-radius:11px;background:#fff;border:1px solid var(--border);
  box-shadow:var(--sh-xs);padding:7px 11px;position:relative;overflow:visible;border-left:3px solid var(--ac,#ccc);
  transition:box-shadow .15s,transform .15s;}
.pcard:hover{box-shadow:var(--sh-md);transform:translateY(-1px);z-index:5;}
.pcard[draggable=true]{cursor:grab;}
.pcard.dragging{opacity:.45;cursor:grabbing;}
.pcard.over{box-shadow:inset 0 0 0 2px var(--aqua);}
.pav{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;box-shadow:inset 0 1px 3px rgba(255,255,255,.35);}
.pbody{flex:1;min-width:0;}
.pline1{display:flex;align-items:center;gap:7px;}
.pline1 .nm{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.pline1 .occ{font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;flex:none;background:var(--green-s);color:var(--green);}
.pline1 .occ.full{background:var(--orange-s);color:var(--orange);} .pline1 .occ.empty{background:var(--line);color:var(--mute);}
.pline2{display:flex;align-items:center;gap:8px;font-size:9px;font-weight:700;color:var(--mute);margin-top:2px;}
.pline2 .ar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}
.pmet{display:flex;gap:6px;flex:none;font-weight:800;font-size:9.5px;}
.pmet .at{color:var(--green);} .pmet .f{color:var(--blue);} .pmet .p{color:var(--purple);} .pmet .n{color:var(--red);} .pmet .n.z{color:var(--mute2);}
.pval{flex:none;text-align:right;}
.pval .v{font-size:12.5px;font-weight:800;color:var(--green);font-family:'Space Grotesk';}
.pval .l{font-size:7.5px;font-weight:800;text-transform:uppercase;color:var(--mute2);letter-spacing:.04em;}
.pgrip{flex:none;color:var(--mute2);opacity:0;font-size:12px;transition:opacity .15s;}
.pcard:hover .pgrip{opacity:.45;}

/* ───────── popup agenda ───────── */
.apop{position:fixed;z-index:200;width:312px;background:#fff;border:1px solid var(--border);
  border-radius:15px;box-shadow:var(--sh-lg);padding:0;opacity:0;transform:translateY(6px) scale(.98);
  pointer-events:none;transition:opacity .16s,transform .16s;overflow:hidden;}
.apop.show{opacity:1;transform:translateY(0) scale(1);}
.apop .ah{padding:12px 15px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 62%,#0b2f4f));
  color:#fff;display:flex;align-items:center;justify-content:space-between;}
.apop .ah .t{font-size:12.5px;font-weight:800;}
.apop .ah .s{font-size:10px;font-weight:700;opacity:.9;margin-top:2px;}
.apop .ah .cap{font-size:10px;font-weight:800;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:8px;}
.apop .abody{max-height:316px;overflow-y:auto;padding:6px;}
.apop .abody::-webkit-scrollbar{width:6px;} .apop .abody::-webkit-scrollbar-thumb{background:#cfe0ea;border-radius:8px;}
.arow{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;transition:background .12s;}
.arow:hover{background:var(--bg);}
.arow .hr{font-size:11.5px;font-weight:800;color:var(--navy);width:44px;flex:none;}
.arow .info{flex:1;min-width:0;}
.arow .info .nm{font-size:11.5px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.arow .info .ob{font-size:9.5px;font-weight:600;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.arow .rt{text-align:right;flex:none;}
.arow .rt .mt{font-size:11px;font-weight:800;color:var(--navy);}
.arow .rt .bd{font-size:8.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:6px;margin-top:3px;display:inline-block;}
.bd.atendido{background:var(--green-s);color:var(--green);} .bd.agendado{background:var(--aqua-s);color:var(--blue);}
.bd.cancelado{background:var(--red-s);color:var(--red);} .bd.anulado{background:var(--red-s);color:var(--red);}
.bd.cambio_hora{background:var(--orange-s);color:var(--orange);}
.arow.muted{opacity:.5;}
.arow .slotfree{font-size:10.5px;font-weight:700;color:var(--mute2);font-style:italic;}
.apop .afoot{padding:10px 15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--mute);}
.apop .afoot b{color:var(--navy);font-weight:800;}

/* ───────── tabla comparativa ───────── */
.tcard{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:16px;background:#fff;
  border:1px solid var(--border);box-shadow:var(--sh-sm);overflow:hidden;}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid var(--line);}
.tbar .tt{font-size:12px;font-weight:800;color:var(--navy);}
.tbar .tt span{font-size:10.5px;font-weight:700;color:var(--mute);margin-left:7px;}
.toggle{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--mute);cursor:pointer;user-select:none;}
.toggle .sw{width:34px;height:19px;border-radius:999px;background:#cfdde7;position:relative;transition:background .2s;flex:none;}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:var(--sh-xs);transition:left .2s;}
.toggle.on .sw{background:var(--blue);} .toggle.on .sw::after{left:17px;}
.tbtn{font-family:inherit;font-size:10.5px;font-weight:700;color:var(--blue);background:var(--aqua-s);
  border:1px solid #cfeaf1;border-radius:8px;padding:5px 10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
.tbtn:hover{background:#d8f2f7;}
.tbtn svg{width:12px;height:12px;}
.twrap{flex:1;overflow:auto;}
.twrap::-webkit-scrollbar{width:8px;height:8px;} .twrap::-webkit-scrollbar-thumb{background:#cfe0ea;border-radius:8px;}
table{width:100%;border-collapse:collapse;font-size:11.5px;}
thead th{position:sticky;top:0;z-index:6;background:#f3f9fc;
  font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);
  text-align:right;padding:6px 11px;border-bottom:2px solid var(--border);white-space:nowrap;cursor:grab;user-select:none;}
thead th:first-child{text-align:left;}
thead th .colgrip{opacity:0;font-size:9px;color:var(--mute2);margin-left:4px;transition:opacity .15s;}
thead th:hover .colgrip{opacity:1;}
thead th:hover{color:var(--blue);background:#eef7fb;}
thead th.sorted{color:var(--blue);background:#e2f3fa;}
thead th .sortarr{font-size:8.5px;color:var(--blue);margin-left:3px;}
.grp td{background:var(--bg);padding:3px 11px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--border);}
.grp td .gl{display:inline-flex;align-items:center;gap:7px;}
.grp td .gl .d{width:8px;height:8px;border-radius:3px;}
.grp td .gl .n{color:var(--mute);font-size:8.5px;font-weight:700;margin-left:4px;}
tbody tr.prow{border-bottom:1px solid var(--line);transition:background .12s;}
tbody tr.prow:hover{background:#fafdff;}
tbody tr.prow.off{opacity:.46;}
tbody tr.prow td{padding:4px 11px;text-align:right;vertical-align:middle;}
tbody tr.prow td:first-child{text-align:left;}
.tprof{display:flex;align-items:center;gap:8px;cursor:grab;}
.tprof .grip{color:#c2d4e0;font-size:12px;line-height:1;flex:none;letter-spacing:-2px;}
.tprof .av{width:25px;height:25px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;}
.tprof .nn{min-width:0;}
.tprof .nn .a{font-size:11.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.tprof .nn .b{font-size:9px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:5px;}
.tprof .nn .b .pt{width:5px;height:5px;border-radius:50%;}
.st-on{color:var(--green);} .st-off{color:var(--mute2);}
.num{font-weight:800;color:var(--navy);}
.num.real{color:var(--green);}
.num.pot{color:var(--orange);}
.diffcell .big{font-weight:800;}
.diffcell .pc{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:5px;display:inline-block;}
.pc.neg{background:var(--red-s);color:var(--red);} .pc.pos{background:var(--green-s);color:var(--green);} .pc.zero{background:var(--line);color:var(--mute);}
.diffcell.neg .big{color:var(--red);} .diffcell.pos .big{color:var(--green);} .diffcell.zero .big{color:var(--mute);}
tr.prow.dragging{opacity:.35;}
tr.prow.drop-target{box-shadow:inset 0 2px 0 var(--blue);}
th.col-dragging{opacity:.4;}
th.col-drop{box-shadow:inset 2px 0 0 var(--blue);}
tfoot td{position:sticky;bottom:0;background:#eef7fb;border-top:2px solid var(--border);
  padding:7px 11px;text-align:right;font-weight:800;color:var(--navy);font-size:11.5px;}
tfoot td:first-child{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);}
tfoot td .real{color:var(--green);} tfoot td .pot{color:var(--orange);}

/* ───────── estados ───────── */
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mute);text-align:center;padding:30px;}
.state .ic{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);}
.state .ic svg{width:26px;height:26px;color:var(--mute2);}
.state .t{font-size:14px;font-weight:800;color:var(--navy);}
.state .s{font-size:12px;font-weight:600;max-width:280px;line-height:1.5;}
.skel{border-radius:14px;background:linear-gradient(100deg,#eef5f9 30%,#f7fbfd 50%,#eef5f9 70%);
  background-size:200% 100%;animation:sk 1.3s linear infinite;}
@keyframes sk{from{background-position:200% 0;}to{background-position:-200% 0;}}
.spin{width:34px;height:34px;border:3px solid var(--aqua-s);border-top-color:var(--blue);border-radius:50%;animation:rot .8s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}

/* ───────── responsive ───────── */
@media(max-width:1480px){#grid{grid-template-columns:290px minmax(320px,1fr) minmax(560px,1.4fr);gap:13px;padding:14px 18px;}}
@media(max-width:1200px){
  body{overflow:auto;} #grid{position:static;display:flex;flex-direction:column;height:auto;padding:16px;}
  .col{height:auto;} .col-scroll{overflow:visible;} .gutter{display:none;}
  .central .col-scroll{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px;}
  .tcard{min-height:520px;}
}
@media(max-width:560px){.seg button{padding:7px 10px;font-size:11px;} .central .col-scroll{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="bgwrap"></div>

<div id="top">
  <div class="brand">
    <div class="orb">A</div>
    <div>
      <h1>Panel del <b>Día</b><span class="vtag">v1</span></h1>
      <div class="sub">Centro Médico Carampangue</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="segPeriodo">
    <button data-p="dia" class="on">Día</button>
    <button data-p="semana">Semana</button>
    <button data-p="mes">Mes</button>
    <button data-p="rango">Rango</button>
  </div>
  <div class="dpick" id="dpDia">

<script>
/* ════════════════════════════════════════════════════════════════════════
   PANEL DEL DÍA · v1 — Centro Médico Carampangue
   Valorización a NIVEL PROFESIONAL (una sola tarifaSlot) → Real ≤ Esperada ≤ Potencial.
   Self-contained · mock determinista · datos reales = tocar CONFIG/AREAS + ETL Medilink.
   ════════════════════════════════════════════════════════════════════════ */

/* 1 · CONFIG — único lugar a tocar para datos reales */
const CONFIG = {
  copagoFonasaDefault: 9000,          // ingreso por atención Fonasa (referencial)
  fallbackTicket: 18000,              // ticket particular de respaldo sin histórico
  diasHabiles: { dia:1, semana:5, mes:22 },

};

/* Áreas: color, etiqueta, ticket particular histórico, ingreso Fonasa por atención */
const AREAS = {
  general:    {label:'Medicina General',   color:'#1172AB', ticket:18000, fonasa:9000},
  cardio:     {label:'Cardiología',        color:'#e84545', ticket:35000, fonasa:18000},
  gastro:     {label:'Gastroenterología',  color:'#e07b39', ticket:40000, fonasa:20000},
  gineco:     {label:'Ginecología',        color:'#e84f9a', ticket:32000, fonasa:16000},
  orl:        {label:'Otorrinolaringología',color:'#2f9e8f',ticket:30000, fonasa:15000},
  traumato:   {label:'Traumatología',      color:'#b8782c', ticket:30000, fonasa:15000},
  eco:        {label:'Ecografía',          color:'#0d8fb0', ticket:25000, fonasa:13000},
  matrona:    {label:'Matrona',            color:'#d6488f', ticket:16000, fonasa:null},
  kine:       {label:'Kinesiología',       color:'#1fb257', ticket:20000, fonasa:null},
  nutricion:  {label:'Nutrición',          color:'#caa11a', ticket:25000, fonasa:null},
  psicologia: {label:'Psicología',         color:'#7c5cff', ticket:25000, fonasa:null},
  psiquiatria:{label:'Psiquiatría',        color:'#5b6cff', ticket:60000, fonasa:null},
  fono:       {label:'Fonoaudiología',     color:'#13b5b1', ticket:22000, fonasa:null},
  dental:     {label:'Odontología',        color:'#3aa0c7', ticket:35000, fonasa:null},
  estetica:   {label:'Estética Facial',    color:'#c77fb0', ticket:60000, fonasa:null},
};

/* 2 · DATOS — profesionales CMC + agenda mock determinista */
const NOMS_F = ['Camila','Rosa','Juan','María','Pedro','Ana','Luis','Marta','José','Paola','Diego','Ingrid','Nicolás','Liliana','Sofía','Tomás','Elena','Ricardo','Valentina','Héctor','Patricia','Andrés','Carla','Mateo'];
let _seed = 42; const rnd = ()=>{ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; };
const pick = a => a[Math.floor(rnd()*a.length)];
const NOW_MIN = 13*60+20;   // hora simulada "ahora"

const ACTIVOS = new Set(['agendado','atendido']);
const NO_ATEND = new Set(['cancelado','anulado','cambio_hora']);

/* tarifaSlot — cadena de prioridad, a nivel profesional (hoisteada: invocable al materializar) */
function tarifaSlot(p){
  if(p.tarifa!=null) return p.tarifa;                       // 1 · tarifa del profesional
  const a=AREAS[p.area];
  if(a && a.tarifaEsp!=null) return a.tarifaEsp;            // 2 · tarifa de la especialidad
  if(p.fonasaOpt) return a?.fonasa ?? CONFIG.copagoFonasaDefault; // 3 · Fonasa si aplica
  if(p.ticket!=null) return p.ticket;                       // 4 · ticket histórico profesional
  if(a && a.ticket!=null) return a.ticket;                  // 5 · ticket histórico área
  return CONFIG.fallbackTicket;                             // 6 · fallback configurable
}

function mkAgenda(prof, ocup){
  const ag=[]; const [h0,h1]=prof.jornada; let cap=Math.floor(((h1-h0)*60)/prof.slot);
  prof._cap = cap;
  for(let i=0;i<cap;i++){
    const min=h0*60+i*prof.slot; const hh=String(Math.floor(min/60)).padStart(2,'0'); const mm=String(min%60).padStart(2,'0');
    const hora=`${hh}:${mm}`;
    if(rnd()>ocup){ ag.push({hora,libre:true}); continue; }
    const tipo = prof.fonasaOpt && rnd()<prof.fonasaMix ? 'fonasa' : 'particular';  // solo para contar
    const past = min < NOW_MIN; let estado; const r=rnd();
    if(past){ estado = r<0.82?'atendido': r<0.90?'cancelado': r<0.96?'cambio_hora':'anulado'; }
    else    { estado = r<0.93?'agendado': r<0.97?'cambio_hora':'cancelado'; }
    const tarifa = tarifaSlot(prof);
    const monto = estado==='atendido' ? tarifa : 0;
    ag.push({hora,paciente:pick(NOMS_F)+' '+pick(['G.','M.','S.','R.','P.','V.','C.','L.']),tipo,estado,monto,esperado:tarifa,
             obs: estado==='cambio_hora'?'Reprogramó a otra fecha': estado==='cancelado'?'Canceló esta mañana': estado==='anulado'?'Anulada en recepción': ''});
  }
  return ag;
}

/* lista base — agenda se construye para TODOS (presentes y ausentes-hoy) */
const BASE = [
  {id:73,nombre:'Dr. Andrés Abarca',   area:'general',   fonasaOpt:true, fonasaMix:.6, tarifa:null, ticket:17500, slot:15, jornada:[8,16],  hoy:true,  ocup:.78},
  {id:1, nombre:'Dr. Rodrigo Olavarría',area:'general',  fonasaOpt:true, fonasaMix:.5, tarifa:null, ticket:18500, slot:15, jornada:[16,21], hoy:true,  ocup:.62},
  {id:13,nombre:'Dr. Alonso Márquez',  area:'general',   fonasaOpt:true, fonasaMix:.7, tarifa:null, ticket:17000, slot:20, jornada:[9,14],  hoy:false, ocup:.55},
  {id:60,nombre:'Dr. Miguel Millán',   area:'cardio',    fonasaOpt:true, fonasaMix:.4, tarifa:null, ticket:36000, slot:20, jornada:[15,19], hoy:true,  ocup:.92},
  {id:65,nombre:'Dr. Nicolás Quijano', area:'gastro',    fonasaOpt:true, fonasaMix:.3, tarifa:null, ticket:42000, slot:20, jornada:[10,14], hoy:true,  ocup:.45},
  {id:61,nombre:'Dr. Tirso Rejón',     area:'gineco',    fonasaOpt:true, fonasaMix:.5, tarifa:null, ticket:32000, slot:20, jornada:[9,13],  hoy:false, ocup:.6},
  {id:23,nombre:'Dr. Manuel Borrego',  area:'orl',       fonasaOpt:true, fonasaMix:.5, tarifa:null, ticket:30000, slot:20, jornada:[11,15], hoy:false, ocup:.55},
  {id:64,nombre:'Dr. Claudio Barraza', area:'traumato',  fonasaOpt:true, fonasaMix:.5, tarifa:null, ticket:31000, slot:15, jornada:[9,13],  hoy:true,  ocup:.7},
  {id:68,nombre:'David Pardo',         area:'eco',       fonasaOpt:true, fonasaMix:.45,tarifa:null, ticket:26000, slot:15, jornada:[8,13],  hoy:true,  ocup:.84},
  {id:67,nombre:'Sarai Gómez',         area:'matrona',   fonasaOpt:false,fonasaMix:0,  tarifa:16000,ticket:16000, slot:30, jornada:[9,14],  hoy:true,  ocup:.66},
  {id:77,nombre:'Luis Armijo',         area:'kine',      fonasaOpt:false,fonasaMix:0,  tarifa:20000,ticket:20000, slot:40, jornada:[8,14],  hoy:true,  ocup:.74},
  {id:21,nombre:'Leonardo Etcheverry', area:'kine',      fonasaOpt:false,fonasaMix:0,  tarifa:20000,ticket:20000, slot:40, jornada:[14,20], hoy:false, ocup:.6},
  {id:52,nombre:'Gisela Pinto',        area:'nutricion', fonasaOpt:false,fonasaMix:0,  tarifa:null, ticket:25000, slot:60, jornada:[10,14], hoy:true,  ocup:.5},
  {id:74,nombre:'Jorge Montalba',      area:'psicologia',fonasaOpt:false,fonasaMix:0,  tarifa:null, ticket:25000, slot:45, jornada:[15,20], hoy:true,  ocup:.88},
  {id:49,nombre:'Juan Pablo Rodríguez',area:'psicologia',fonasaOpt:false,fonasaMix:0,  tarifa:null, ticket:25000, slot:45, jornada:[9,13],  hoy:false, ocup:.6},
  {id:78,nombre:'Dr. Unibazo',         area:'psiquiatria',fonasaOpt:false,fonasaMix:0, tarifa:60000,ticket:60000, slot:30, jornada:[17,20], hoy:true,  ocup:1.0},
  {id:70,nombre:'Juana Arratia',       area:'fono',      fonasaOpt:false,fonasaMix:0,  tarifa:null, ticket:22000, slot:30, jornada:[9,13],  hoy:true,  ocup:0},
  {id:55,nombre:'Dra. Javiera Burgos', area:'dental',    fonasaOpt:false,fonasaMix:0,  tarifa:null, ticket:38000, slot:60, jornada:[9,15],  hoy:true,  ocup:.83},
  {id:72,nombre:'Dr. Carlos Jiménez',  area:'dental',    fonasaOpt:false,fonasaMix:0,  tarifa:null, ticket:34000, slot:30, jornada:[10,16], hoy:false, ocup:.6},
  {id:76,nombre:'Dra. V. Fuentealba',  area:'estetica',  fonasaOpt:false,fonasaMix:0,  tarifa:null, ticket:62000, slot:30, jornada:[11,17], hoy:true,  ocup:.4},
];

const PROFS = BASE.map(p=>{
  const prof={...p};
  prof.agenda = mkAgenda(prof, prof.ocup);   // agenda para TODOS (día representativo)
  prof._m = metricsDay(prof);                // métricas crudas de un día
  return prof;
});

/* 3 · MOTOR DE CÁLCULO */
function metricsDay(p){
  let real=0, esp=0, nAt=0,nFon=0,nPar=0,nNo=0, ocupados=0;
  for(const c of p.agenda){
    if(c.libre) continue; ocupados++;
    if(c.estado==='atendido'){ real+=c.monto; nAt++; (c.tipo==='fonasa'?nFon++:nPar++); }
    if(NO_ATEND.has(c.estado)){ nNo++; }
    if(ACTIVOS.has(c.estado)){ esp += (c.estado==='atendido'? c.monto : tarifaSlot(p)); }
  }
  const cap=p._cap||0; const pot=cap*tarifaSlot(p);
  return {real, esp, pot, cap, nAt, nFon, nPar, nNo, ocupados};
}
function diasPeriodo(){
  if(STATE.periodo==='rango') return Math.max(1, rangoDiasHabiles());
  return CONFIG.diasHabiles[STATE.periodo] ?? 1;
}
function avance(){
  if(STATE.periodo==='dia') return Math.min(1, Math.max(.15, NOW_MIN/(21*60)));
  return CONFIG.avancePeriodo[STATE.periodo] ?? 0.5;
}
/* métricas de display ya escaladas al período activo */
function dm(p){
  const m=p._m;
  if(STATE.periodo==='dia'){
    if(!p.hoy) return {real:0,esperada:0,potencial:0,cap:0,nAt:0,nFon:0,nPar:0,nNo:0,ocupados:0};
    return {real:m.real,esperada:m.esp,potencial:m.pot,cap:m.cap,nAt:m.nAt,nFon:m.nFon,nPar:m.nPar,nNo:m.nNo,ocupados:m.ocupados};
  }
  const dias=diasPeriodo(), av=avance(), R=Math.round;
  const esperada=R(m.esp*dias), potencial=R(m.pot*dias), real=R(esperada*av);
  return {real,esperada,potencial,cap:R(m.cap*dias),
    nAt:R(m.nAt*dias*av), nFon:R(m.nFon*dias*av), nPar:R(m.nPar*dias*av), nNo:R(m.nNo*dias*av),
    ocupados:R(m.ocupados*dias)};
}
/* población visible según período: hoy = presentes · período = todos */
function periodProfs(){ return STATE.periodo==='dia' ? PROFS.filter(p=>p.hoy) : PROFS.slice(); }
const pct = (dif, base) => base ? (dif/base*100) : 0;
function totales(list){
  return list.reduce((t,p)=>{ const m=dm(p); t.real+=m.real;t.esp+=m.esperada;t.pot+=m.potencial;t.cap+=m.cap;
    t.nAt+=m.nAt;t.nFon+=m.nFon;t.nPar+=m.nPar;t.nNo+=m.nNo; return t; },
    {real:0,esp:0,pot:0,cap:0,nAt:0,nFon:0,nPar:0,nNo:0});
}

/* 4 · ESTADO + formato */
const STATE = {
  periodo:'dia', fecha:new Date(), desde:null, hasta:null,
  soloDisponibles:false, ordenFilas:null, centerOrder:BASE.map(p=>p.id),
  ordenCols:['real','esp','dif1','pot','dif2'],
  sortCol:null, sortDir:'desc',          // orden por columna (null = agrupado por área)
};
const clp = n => '$'+Math.round(n).toLocaleString('es-CL');
const clpc = n => { const s=clp(n); return `<span class="c">$</span>${s.slice(1)}`; };
const initials = nm => nm.replace(/^(Dr\.|Dra\.)\s*/,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function rangoDiasHabiles(){
  if(!STATE.desde||!STATE.hasta) return 1;
  let d=new Date(STATE.desde), end=new Date(STATE.hasta), n=0;
  while(d<=end){ if(d.getDay()!==0) n++; d.setDate(d.getDate()+1); }
  return n||1;
}
const lblPeriodo = ()=>({dia:'Hoy',semana:'Esta semana',mes:'Este mes',rango:'Rango'}[STATE.periodo]);
const lblPeriodoLow = ()=>({dia:'hoy',semana:'la semana',mes:'el mes',rango:'el rango'}[STATE.periodo]);

/* 5 · RENDER · KPI */
const SVG = {
  cash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>',
  rocket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8a2 2 0 0 0-3 0zM12 15l-3-3a22 22 0 0 1 8-10c1.5 0 4 0 4 0s0 2.5 0 4a22 22 0 0 1-10 8zM9 12H4s.5-2.8 2-4 5 0 5 0M12 15v5s2.8-.5 4-2 0-5 0-5"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 7l10 10M9 17h8V9"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7L9 4H5a2 2 0 0 0-2 2z"/></svg>',
};
function chipVar(dif, base){
  const p = pct(dif, base);
  if(Math.abs(p)<0.5) return `<div class="kchip flat">Sin cambios vs período anterior</div>`;
  const up=p>0; return `<div class="kchip ${up?'up':'down'}">${up?SVG.up:SVG.down}${up?'+':''}${p.toFixed(1)}% vs anterior</div>`;
}
function renderKPI(){
  const t = totales(periodProfs());
  const prevReal=t.real*0.92, prevEsp=t.esp*1.04, prevPot=t.pot*0.99;
  const occ = t.pot? (t.real/t.pot*100):0, fillEsp = t.pot? (t.esp/t.pot*100):0;
  document.getElementById('kpiWrap').innerHTML = `
    <div class="kcard real">
      <div class="ktop"><div class="ic">${SVG.cash}</div><div class="klab">Venta real</div>${chipVar(t.real-prevReal, prevReal)}</div>
      <div class="kval mono">${clpc(t.real)}</div>
      <div class="ksub">Atendidos / pagados · ${t.nAt} atenciones</div>
      <div class="kbar"><i style="width:${Math.min(100,occ)}%"></i></div>
      <div class="kmini">
        <div class="m fon"><div class="v mono">${t.nFon}</div><div class="l">Fonasa</div></div>
        <div class="m par"><div class="v mono">${t.nPar}</div><div class="l">Particular</div></div>
      </div>
    </div>
    <div class="kcard esp">
      <div class="ktop"><div class="ic">${SVG.cal}</div><div class="klab">Venta esperada</div>${chipVar(t.esp-prevEsp, prevEsp)}</div>
      <div class="kval mono">${clpc(t.esp)}</div>
      <div class="ksub">Todos los agendados activos · faltan <b>${clp(Math.max(0,t.esp-t.real))}</b></div>
      <div class="kbar"><i style="width:${Math.min(100,fillEsp)}%"></i></div>
    </div>
    <div class="kcard pot">
      <div class="ktop"><div class="ic">${SVG.rocket}</div><div class="klab">Potencial máximo</div>${chipVar(t.pot-prevPot, prevPot)}</div>
      <div class="kval mono">${clpc(t.pot)}</div>
      <div class="ksub">Todos los cupos llenos · sobre la mesa <b>${clp(Math.max(0,t.pot-t.real))}</b></div>
      <div class="kbar"><i style="width:100%"></i></div>
    </div>
    <div class="kcard" style="background:linear-gradient(160deg,#0f3f68,#10557f);border:0;color:#fff">
      <div class="ktop"><div class="ic" style="background:rgba(255,255,255,.16);color:#fff">${SVG.warn}</div><div class="klab" style="color:#bfe2ee">Oportunidad perdida</div></div>
      <div class="kval mono" style="color:#fff">${clpc(t.pot-t.real)}</div>
      <div class="ksub" style="color:#cfe6f1">Diferencia entre lo vendido y el máximo posible ${lblPeriodoLow()==='hoy'?'de hoy':'de '+lblPeriodoLow()}. <b style="color:#fff">${pct(t.pot-t.real,t.pot).toFixed(0)}%</b> de capacidad ociosa.</div>
    </div>`;
}

/* 6 · RENDER · centro (disponibles / activos del período) + popup */
function avatarStyle(p){ const c=AREAS[p.area].color; return `background:linear-gradient(140deg,${c},color-mix(in srgb,${c} 60%,#0b2f4f))`; }
function profEstado(p, m, dia){
  if(dia && !p.hoy) return ['empty','No disponible'];
  if(m.cap>0 && m.ocupados>=m.cap) return ['full','Agenda llena'];
  if(m.ocupados===0) return ['empty','Sin pacientes'];
  return ['on','Disponible'];
}
function renderDispo(){
  const wrap=document.getElementById('dispoWrap');
  const dia = STATE.periodo==='dia';
  const base = dia ? PROFS.filter(p=>p.hoy) : PROFS.slice();
  const visIds=new Set(base.map(p=>p.id));
  base.forEach(p=>{ if(!STATE.centerOrder.includes(p.id)) STATE.centerOrder.push(p.id); });
  const list = STATE.centerOrder.map(id=>PROFS.find(p=>p.id===id)).filter(p=>p&&visIds.has(p.id));

  document.getElementById('cTitle').textContent = dia ? 'Disponibles hoy' : 'Activos en '+lblPeriodoLow();
  document.getElementById('lblDispo').textContent = dia ? `${list.length} de ${PROFS.length}` : `${list.length} profesionales`;
  if(!list.length){ wrap.innerHTML = stateBox('empty','Sin profesionales','No hay actividad registrada para este período.'); return; }

  wrap.innerHTML = list.map(p=>{
    const a=AREAS[p.area]; const m=dm(p);
    const occPct = m.cap? Math.round(m.ocupados/m.cap*100):0;
    const occCls = occPct>=100?'full':occPct===0?'empty':'';
    const ausente = !dia && !p.hoy;
    return `
    <div class="pcard" draggable="true" style="--ac:${a.color}" data-id="${p.id}" title="${m.ocupados}/${m.cap} cupos">
      <div class="pav" style="${avatarStyle(p)}">${initials(p.nombre)}</div>
      <div class="pbody">
        <div class="pline1"><span class="nm">${p.nombre}</span><span class="occ ${occCls}">${occPct}%</span></div>
        <div class="pline2"><span class="ar">${a.label}${p.fonasaOpt?' · Fon':''}${ausente?' · ausente':''}</span>
          <span class="pmet"><span class="at">${m.nAt}</span>at <span class="f">${m.nFon}</span>F <span class="p">${m.nPar}</span>P <span class="n ${m.nNo?'':'z'}">${m.nNo}</span>no</span></div>
      </div>
      <div class="pval"><div class="v">${clp(m.real)}</div><div class="l">real</div></div>
      <span class="pgrip">⠿</span>
    </div>`;
  }).join('');
  wireCenterDnD();
}
function wireCenterDnD(){
  document.querySelectorAll('#dispoWrap .pcard').forEach(card=>{
    const p=PROFS.find(x=>x.id==card.dataset.id);
    card.addEventListener('mouseenter',()=>{ if(!cdrag) showAgenda(card); });
    card.addEventListener('mousemove',e=>{ if(!cdrag) positionPop(e); });
    card.addEventListener('mouseleave',hideAgenda);
    card.addEventListener('dragstart',e=>{ cdrag=card.dataset.id; card.classList.add('dragging'); hideAgenda(); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend',()=>{ card.classList.remove('dragging'); document.querySelectorAll('#dispoWrap .over').forEach(x=>x.classList.remove('over')); });
    card.addEventListener('dragover',e=>{ if(cdrag){ e.preventDefault(); card.classList.add('over'); } });
    card.addEventListener('dragleave',()=>card.classList.remove('over'));
    card.addEventListener('drop',e=>{ e.preventDefault(); if(cdrag&&cdrag!==card.dataset.id){
      const o=STATE.centerOrder; const from=o.indexOf(+cdrag), to=o.indexOf(+card.dataset.id);
      o.splice(to,0,o.splice(from,1)[0]); cdrag=null; renderDispo(); } });
  });
}
let cdrag=null;

const apop=document.getElementById('apop');
function showAgenda(card){
  const p=PROFS.find(x=>x.id==card.dataset.id); if(!p) return;
  const a=AREAS[p.area]; const m=p._m;
  const cap=p._cap||0; const ocup=m.ocupados;
  const dia = STATE.periodo==='dia';
  let realSum=0, espSum=0;
  const rows = p.agenda.map(c=>{
    if(c.libre) return `<div class="arow muted"><div class="hr mono">${c.hora}</div><div class="info"><div class="slotfree">Cupo libre</div></div><div class="rt"><div class="bd" style="background:var(--line);color:var(--mute)">Disponible</div></div></div>`;
    if(c.estado==='atendido') realSum+=c.monto;
    if(ACTIVOS.has(c.estado)) espSum += c.estado==='atendido'?c.monto:tarifaSlot(p);
    const mlab  = c.estado==='atendido' ? clp(c.monto) : (NO_ATEND.has(c.estado)?'—':clp(c.esperado));
    const tipoTxt = c.tipo==='fonasa'?'Fonasa':'Particular';
    const estLabel = {atendido:'Atendido',agendado:'Agendado',cancelado:'Cancelado',anulado:'Anulado',cambio_hora:'Cambió hora'}[c.estado];
    return `<div class="arow ${NO_ATEND.has(c.estado)?'muted':''}">
      <div class="hr mono">${c.hora}</div>
      <div class="info"><div class="nm">${c.paciente}</div><div class="ob">${tipoTxt}${c.obs?' · '+c.obs:''}</div></div>
      <div class="rt"><div class="mt mono">${mlab}</div><div class="bd ${c.estado}">${estLabel}</div></div>
    </div>`;
  }).join('');
  apop.style.setProperty('--ac',a.color);
  apop.innerHTML = `
    <div class="ah" style="--ac:${a.color}">
      <div><div class="t">${p.nombre}</div><div class="s">${a.label} · ${p.jornada[0]}:00–${p.jornada[1]}:00${dia?'':' · día tipo'}</div></div>
      <div class="cap">${ocup}/${cap}</div>
    </div>
    <div class="abody">${rows || '<div class="arow muted" style="justify-content:center;padding:24px">Sin agenda registrada</div>'}</div>
    <div class="afoot"><span>Real: <b>${clp(realSum)}</b></span><span>Esperado: <b>${clp(espSum)}</b></span></div>`;
  apop.classList.add('show');
}
function positionPop(e){
  if(!apop.classList.contains('show')) return;
  const w=apop.offsetWidth||312, h=apop.offsetHeight||300;
  let x=e.clientX+18, y=e.clientY-20;
  if(x+w>window.innerWidth-12) x=e.clientX-w-18;
  if(y+h>window.innerHeight-12) y=window.innerHeight-h-12;
  if(y<12) y=12;
  apop.style.left=x+'px'; apop.style.top=y+'px';
}
function hideAgenda(){ apop.classList.remove('show'); }

/* 7 · RENDER · tabla comparativa + drag filas/columnas */
const COL_DEFS = {
  real:{lab:'Venta real',  val:m=>`<span class="num real mono">${clp(m.real)}</span>`},
  esp: {lab:'V. esperada', val:m=>`<span class="num mono">${clp(m.esperada)}</span>`},
  dif1:{lab:'Real vs esp.',val:m=>diffCell(m.real-m.esperada,m.esperada)},
  pot: {lab:'Potencial',   val:m=>`<span class="num pot mono">${clp(m.potencial)}</span>`},
  dif2:{lab:'Real vs pot.',val:m=>diffCell(m.real-m.potencial,m.potencial)},
};
function diffCell(dif,base){
  const p=pct(dif,base); const sign = dif>0?'pos':dif<0?'neg':'zero'; const arrow = dif>0?'+':'';
  return `<div class="diffcell ${sign}"><span class="big mono">${arrow}${clp(dif)}</span><span class="pc ${sign} mono">${Math.abs(p).toFixed(0)}%</span></div>`;
}
function orderedProfs(){
  let list=[...PROFS];
  if(STATE.ordenFilas){ list.sort((a,b)=>STATE.ordenFilas.indexOf(a.id)-STATE.ordenFilas.indexOf(b.id)); }
  if(STATE.soloDisponibles) list=list.filter(p=>p.hoy);
  return list;
}
/* fila de profesional (reutilizada en vista agrupada y ordenada) */
function rowHTML(p){
  const a=AREAS[p.area]; const m=dm(p);
  const tds = STATE.ordenCols.map(k=>`<td data-col="${k}">${COL_DEFS[k].val(m)}</td>`).join('');
  return `<tr class="prow ${p.hoy?'':'off'}" draggable="true" data-id="${p.id}">
    <td><div class="tprof"><span class="grip">⠿</span>
      <div class="av" style="${avatarStyle(p)}">${initials(p.nombre)}</div>
      <div class="nn"><div class="a">${p.nombre}</div>
        <div class="b"><span class="pt" style="background:${a.color}"></span>${a.label} · <span class="${p.hoy?'st-on':'st-off'}">${p.hoy?'Disponible':'No disp.'}</span></div></div>
    </div></td>${tds}</tr>`;
}
/* valor numérico de una columna para ordenar */
function sortVal(p,k){ const m=dm(p);
  switch(k){ case 'real':return m.real; case 'esp':return m.esperada; case 'dif1':return m.real-m.esperada;
    case 'pot':return m.potencial; case 'dif2':return m.real-m.potencial; default:return 0; } }
const sortLabel = ()=> STATE.sortCol==='nombre' ? 'nombre' : (COL_DEFS[STATE.sortCol]?.lab||'');
/* clic en encabezado: descendente → ascendente → vuelve a agrupado por área */
function cycleSort(col){
  if(STATE.sortCol!==col){ STATE.sortCol=col; STATE.sortDir=(col==='nombre')?'asc':'desc'; }
  else { const first=(col==='nombre')?'asc':'desc';
    if(STATE.sortDir===first) STATE.sortDir=(first==='asc')?'desc':'asc';
    else STATE.sortCol=null; }
  renderTable();
}
function renderTable(){
  const wrap=document.getElementById('tableWrap');
  let list=orderedProfs();
  const sorted = STATE.sortCol!=null;
  document.getElementById('tSpan').textContent = sorted
    ? `${list.length} prof. · ordenado por ${sortLabel()} ${STATE.sortDir==='asc'?'↑':'↓'}`
    : `${list.length} profesionales · ${lblPeriodoLow()}`;
  if(!list.length){ wrap.innerHTML = stateBox('empty','Sin profesionales','No hay profesionales que coincidan con el filtro.'); return; }
  const arrowFor = k => STATE.sortCol===k ? `<span class="sortarr">${STATE.sortDir==='asc'?'▲':'▼'}</span>` : '';
  const th0 = `<th data-col="nombre" class="${STATE.sortCol==='nombre'?'sorted':''}" title="Clic: ordenar por nombre">Profesional${arrowFor('nombre')}</th>`;
  const ths = STATE.ordenCols.map(k=>`<th draggable="true" data-col="${k}" class="${STATE.sortCol===k?'sorted':''}" title="Clic: ordenar · Arrastra: mover">${COL_DEFS[k].lab}${arrowFor(k)}<span class="colgrip">⇄</span></th>`).join('');
  let body='';
  if(sorted){
    const arr=list.slice();
    if(STATE.sortCol==='nombre') arr.sort((a,b)=> a.nombre.localeCompare(b.nombre)*(STATE.sortDir==='asc'?1:-1));
    else { const dir=STATE.sortDir==='asc'?1:-1; arr.sort((a,b)=> dir*(sortVal(a,STATE.sortCol)-sortVal(b,STATE.sortCol))); }
    body = arr.map(rowHTML).join('');
  } else {
    const seen=new Set(); const groups=[];
    list.forEach(p=>{ if(!seen.has(p.area)){ seen.add(p.area); groups.push(p.area);} });
    groups.forEach(area=>{
      const a=AREAS[area]; const inArea=list.filter(p=>p.area===area); const tg=totales(inArea);
      body += `<tr class="grp"><td colspan="${1+STATE.ordenCols.length}"><span class="gl"><span class="d" style="background:${a.color}"></span>${a.label}<span class="n">· ${inArea.length} · real ${clp(tg.real)} · potencial ${clp(tg.pot)}</span></span></td></tr>`;
      inArea.forEach(p=>{ body += rowHTML(p); });
    });
  }
  const t=totales(list);
  const tfootTds = STATE.ordenCols.map(k=>{
    if(k==='real') return `<td><span class="real mono">${clp(t.real)}</span></td>`;
    if(k==='esp')  return `<td><span class="mono">${clp(t.esp)}</span></td>`;
    if(k==='pot')  return `<td><span class="pot mono">${clp(t.pot)}</span></td>`;
    if(k==='dif1') return `<td>${diffCell(t.real-t.esp,t.esp)}</td>`;
    if(k==='dif2') return `<td>${diffCell(t.real-t.pot,t.pot)}</td>`;
    return '<td></td>';
  }).join('');
  wrap.innerHTML = `<table>
    <thead><tr>${th0}${ths}</tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td>Total ${lblPeriodoLow()} · ${list.length} prof.</td>${tfootTds}</tr></tfoot>
  </table>`;
  wireRowDnD(wrap); wireColDnD(wrap);
}
let dragRowId=null;
function wireRowDnD(wrap){
  wrap.querySelectorAll('tr.prow').forEach(tr=>{
    tr.addEventListener('dragstart',e=>{ dragRowId=tr.dataset.id; tr.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    tr.addEventListener('dragend',()=>{ tr.classList.remove('dragging'); wrap.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target')); });
    tr.addEventListener('dragover',e=>{ if(dragRowId===null) return; e.preventDefault(); tr.classList.add('drop-target'); });
    tr.addEventListener('dragleave',()=>tr.classList.remove('drop-target'));
    tr.addEventListener('drop',e=>{
      e.preventDefault(); if(dragRowId===null||dragRowId===tr.dataset.id) return;
      const order = (STATE.ordenFilas||PROFS.map(p=>p.id)).slice();
      const from=order.indexOf(+dragRowId), to=order.indexOf(+tr.dataset.id);
      order.splice(to,0,order.splice(from,1)[0]);
      STATE.ordenFilas=order; dragRowId=null; renderTable();
    });
  });
}
let dragCol=null, colDragged=false;
function wireColDnD(wrap){
  wrap.querySelectorAll('thead th[data-col]').forEach(th=>{
    // clic = ordenar por esa columna (si no venimos de un arrastre)
    th.addEventListener('click',()=>{ if(colDragged){ colDragged=false; return; } cycleSort(th.dataset.col); });
    if(th.getAttribute('draggable')!=='true') return;   // 'Profesional' solo ordena, no se mueve
    th.addEventListener('dragstart',e=>{ dragCol=th.dataset.col; colDragged=true; th.classList.add('col-dragging'); e.dataTransfer.effectAllowed='move'; });
    th.addEventListener('dragend',()=>{ th.classList.remove('col-dragging'); wrap.querySelectorAll('.col-drop').forEach(x=>x.classList.remove('col-drop')); setTimeout(()=>colDragged=false,60); });
    th.addEventListener('dragover',e=>{ if(!dragCol) return; e.preventDefault(); th.classList.add('col-drop'); });
    th.addEventListener('dragleave',()=>th.classList.remove('col-drop'));
    th.addEventListener('drop',e=>{
      e.preventDefault(); if(!dragCol||dragCol===th.dataset.col) return;
      const order=STATE.ordenCols.slice();
      const from=order.indexOf(dragCol), to=order.indexOf(th.dataset.col);
      order.splice(to,0,order.splice(from,1)[0]);
      STATE.ordenCols=order; dragCol=null; renderTable();
    });
  });
}

/* 8 · estados */
function stateBox(icon,title,sub){
  return `<div class="state"><div class="ic">${SVG[icon]||SVG.empty}</div><div class="t">${title}</div><div class="s">${sub}</div></div>`;
}
function showLoading(){
  document.getElementById('kpiWrap').innerHTML = Array(4).fill('<div class="skel" style="height:150px"></div>').join('');
  document.getElementById('dispoWrap').innerHTML = '<div class="state"><div class="spin"></div><div class="t">Cargando agenda…</div></div>';
  document.getElementById('tableWrap').innerHTML = Array(7).fill('<div class="skel" style="height:46px;margin:8px 14px"></div>').join('');
}

/* 9 · orquestación + filtros */
function renderAll(){
  document.getElementById('lblPeriodo').textContent=lblPeriodo();
  renderKPI(); renderDispo(); renderTable();
}
function refresh(withLoading){ if(withLoading){ showLoading(); setTimeout(renderAll,420); } else renderAll(); }
const toISO = d => d.toISOString().slice(0,10);
function updateDateLabel(){
  const opt={weekday:'long',day:'numeric',month:'long'};
  if(STATE.periodo==='rango' && STATE.desde && STATE.hasta){
    document.getElementById('dbD').textContent = `${STATE.desde.slice(8)}/${STATE.desde.slice(5,7)} → ${STATE.hasta.slice(8)}/${STATE.hasta.slice(5,7)}`;
    document.getElementById('dbH').textContent = `${rangoDiasHabiles()} días hábiles`;
  }else{
    document.getElementById('dbD').textContent = cap(STATE.fecha.toLocaleDateString('es-CL',opt));
    document.getElementById('dbH').textContent = STATE.periodo==='dia'?'Hora simulada 13:20':`${diasPeriodo()} días hábiles`;
  }
}
function setupTopbar(){
  const seg=document.getElementById('segPeriodo');
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    STATE.periodo=b.dataset.p;
    document.getElementById('dpDia').style.display = STATE.periodo==='dia'?'flex':'none';
    document.getElementById('dpRango').style.display = STATE.periodo==='rango'?'flex':'none';
    updateDateLabel(); refresh(true);
  });
  const inDia=document.getElementById('inDia'); inDia.value = toISO(STATE.fecha);
  inDia.addEventListener('change',()=>{ STATE.fecha=new Date(inDia.value+'T12:00:00'); updateDateLabel(); refresh(true); });
  const d0=new Date(STATE.fecha); d0.setDate(d0.getDate()-6);
  document.getElementById('inDesde').value=toISO(d0); STATE.desde=toISO(d0);
  document.getElementById('inHasta').value=toISO(STATE.fecha); STATE.hasta=toISO(STATE.fecha);
  document.getElementById('inDesde').addEventListener('change',e=>{STATE.desde=e.target.value;updateDateLabel();refresh(true);});
  document.getElementById('inHasta').addEventListener('change',e=>{STATE.hasta=e.target.value;updateDateLabel();refresh(true);});
  document.getElementById('tgOnly').addEventListener('click',function(){
    this.classList.toggle('on'); STATE.soloDisponibles=this.classList.contains('on'); renderTable();
  });
  document.getElementById('btnReset').addEventListener('click',()=>{
    STATE.ordenFilas=null; STATE.ordenCols=['real','esp','dif1','pot','dif2']; STATE.centerOrder=BASE.map(p=>p.id);
    STATE.sortCol=null; STATE.sortDir='desc';
    renderDispo(); renderTable();
  });
}
/* 10 · macrocolumnas redimensionables (gutters) */
function setupResizers(){
  const grid=document.getElementById('grid');
  let c1=288, c2=360;
  try{ const s=JSON.parse(localStorage.getItem('panelDiaV1Cols')||'null'); if(s&&s.c1&&s.c2){c1=s.c1;c2=s.c2;} }catch(e){}
  const clamp=(v,a,b)=>Math.max(a,Math.min(Math.max(a,b),v));
  const apply=()=>{ grid.style.gridTemplateColumns=`${c1}px 12px ${c2}px 12px minmax(0,1fr)`; };
  apply();
  let drag=null;
  grid.querySelectorAll('.gutter').forEach(g=>{
    g.addEventListener('mousedown',e=>{ e.preventDefault(); drag={g:g.dataset.g,x:e.clientX,c1,c2}; g.classList.add('active'); document.body.classList.add('resizing'); });
    g.addEventListener('dblclick',()=>{ c1=288;c2=360;apply(); try{localStorage.removeItem('panelDiaV1Cols');}catch(e){} });
  });
  window.addEventListener('mousemove',e=>{
    if(!drag) return;
    const avail=grid.clientWidth-28-24, dx=e.clientX-drag.x;   // 28 padding lateral, 24 = 2 gutters
    if(drag.g==='1') c1=clamp(drag.c1+dx, 200, avail-drag.c2-360);   // derecha nunca <360
    else            c2=clamp(drag.c2+dx, 280, avail-drag.c1-360);
    apply();
  });
  window.addEventListener('mouseup',()=>{
    if(!drag) return;
    grid.querySelector('.gutter.active')?.classList.remove('active');
    document.body.classList.remove('resizing'); drag=null;
    try{ localStorage.setItem('panelDiaV1Cols',JSON.stringify({c1,c2})); }catch(e){}
  });
}
document.addEventListener('DOMContentLoaded',()=>{ setupTopbar(); setupResizers(); updateDateLabel(); refresh(true); });
</script>
