<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Remuneraciones · Alma CMC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%231172AB%22/%3E%3Cpath d=%22M12 6v12M6 12h12%22 stroke=%22white%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ALMA · Remuneraciones Pro — herramienta de escritorio del dueño
   Montserrat LOCAL · cero CDN · tokens claro/oscuro · densidad con calma
═══════════════════════════════════════════════════════════════════════════ */
@font-face{font-family:'Montserrat';src:url('/static/fonts/montserrat-var-latin.woff2') format('woff2-variations'),url('/static/fonts/montserrat-var-latin.woff2') format('woff2');font-weight:400 800;font-style:normal;font-display:swap}

:root{
  /* marca Alma/CMC */
  --aqua:#4FBECE; --blue:#1172AB; --navy:#0F3F68;
  /* estructura */
  --bg:#F5F8FA; --surface:#FFFFFF; --surface-2:#F2F6F9; --surface-3:#E9F0F5;
  --line:#E1E9EF; --line-2:#EDF2F6; --line-strong:#CBD8E2;
  --text:#0E2A43; --text-2:#3F5669; --text-3:#5C7385; --text-4:#8A9FAF;
  /* acento */
  --accent:#1172AB; --accent-h:#0D5F90; --accent-s:#E7F2F9; --accent-t:#0F5A87;
  --sel:#EAF4FA; --sel-line:#1172AB; --focus:0 0 0 2px #FFFFFF,0 0 0 4px #4FBECE;
  /* semántica (misma escala en chips, barras y puntos) */
  --ok:#14804A; --ok-s:#E5F5EC; --ok-b:#BFE5CF;
  --warn:#A35F00; --warn-s:#FFF3DF; --warn-b:#F4D7A6;
  --bad:#C62F2F; --bad-s:#FDEBEB; --bad-b:#F3C2C2;
  --info:#5B43C8; --info-s:#F0ECFF; --info-b:#D6CCFA;
  --neu:#5C7385; --neu-s:#EEF2F5; --neu-b:#D9E2E9;
  --wa:#128C4A;
  --src-sis:#0F3F68; --src-med:#4FBECE; --src-mod:#B8901A;
  /* elevación */
  --e1:0 1px 2px rgba(14,42,67,.06);
  --e2:0 4px 14px rgba(14,42,67,.08),0 1px 3px rgba(14,42,67,.06);
  --e3:0 18px 50px rgba(14,42,67,.18),0 2px 8px rgba(14,42,67,.08);
  /* forma */
  --r1:4px; --r2:6px; --r3:8px; --r4:12px;
  --row:34px;
  --ease:cubic-bezier(.2,.0,.0,1);
  --t:140ms;
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-15:15px; --fs-20:20px; --fs-28:28px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0A141C; --surface:#0F1C27; --surface-2:#132331; --surface-3:#192C3C;
  --line:#1C2F3F; --line-2:#162836; --line-strong:#27405A;
  --text:#E2ECF3; --text-2:#B4C6D3; --text-3:#8EA4B5; --text-4:#5F778A;
  --accent:#4FA9DE; --accent-h:#6CBBE8; --accent-s:#11314A; --accent-t:#8CCBEE;
  --sel:#12304A; --sel-line:#4FA9DE; --focus:0 0 0 2px #0F1C27,0 0 0 4px #4FBECE;
  --ok:#43C985; --ok-s:#0F2E21; --ok-b:#1E5A3E;
  --warn:#F0AE48; --warn-s:#33240C; --warn-b:#5E4318;
  --bad:#F27474; --bad-s:#3A1517; --bad-b:#6B2A2D;
  --info:#A592FF; --info-s:#221B45; --info-b:#3D3378;
  --neu:#8EA4B5; --neu-s:#172736; --neu-b:#26394A;
  --wa:#3DD07E;
  --src-sis:#8FB4D6; --src-med:#4FBECE; --src-mod:#D9B43E;
  --e1:0 1px 2px rgba(0,0,0,.3);
  --e2:0 4px 14px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
  --e3:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:var(--fs-13);line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:48px minmax(0,1fr);overflow:hidden;font-feature-settings:"tnum" 1,"lnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus);border-radius:var(--r2)}
::selection{background:var(--accent-s)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mute{color:var(--text-3)} .mute2{color:var(--text-4)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:14px;height:14px} .ico.xs{width:12px;height:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:600 10.5px/1 'Montserrat',sans-serif;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;border:1px solid var(--line-strong);border-bottom-width:2px;color:var(--text-3);background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ───────── botones ───────── */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r2);font-size:var(--fs-12);font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);white-space:nowrap;transition:background var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t)}
.btn:hover{background:var(--surface-2);border-color:var(--text-4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .btn.pri{color:#06131D}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
html[data-theme="dark"] .btn.wa{color:#04170C}
.btn.wa:hover{filter:brightness(1.07)}
.btn.okb{background:var(--ok-s);border-color:var(--ok-b);color:var(--ok)}
.btn.danger{color:var(--bad)} .btn.danger:hover{background:var(--bad-s);border-color:var(--bad-b)}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.sm{height:26px;padding:0 8px;font-size:var(--fs-11)}
.btn kbd{margin-left:2px;height:16px;min-width:16px;font-size:10px}
.btn.pri kbd,.btn.wa kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:inherit}

/* ───────── chips semánticos ───────── */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:var(--fs-11);font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-s);color:var(--ok);border-color:var(--ok-b)}
.chip.warn{background:var(--warn-s);color:var(--warn);border-color:var(--warn-b)}
.chip.bad{background:var(--bad-s);color:var(--bad);border-color:var(--bad-b)}
.chip.info{background:var(--info-s);color:var(--info);border-color:var(--info-b)}
.chip.neu{background:var(--neu-s);color:var(--neu);border-color:var(--neu-b)}
.chip.acc{background:var(--accent-s);color:var(--accent-t);border-color:transparent}
button.chip{cursor:pointer}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.sdot.ok{background:var(--ok)} .sdot.warn{background:var(--warn)} .sdot.bad{background:var(--bad)} .sdot.info{background:var(--info)} .sdot.neu{background:transparent;border:1.5px solid var(--text-4)}

/* ───────── topbar ───────── */
#top{display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:7px;background:radial-gradient(circle at 30% 25%,#8AE6F2,var(--blue) 62%,var(--navy));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand .mark svg{width:15px;height:15px;stroke:#fff}
.brand b{font-size:var(--fs-13);font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand span{font-size:var(--fs-12);color:var(--text-3);white-space:nowrap}
.tsep{width:1px;height:20px;background:var(--line);flex:none}
.mespick{display:flex;align-items:center;gap:2px}
.mespick .lbl{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r2);font-weight:700;font-size:var(--fs-13);white-space:nowrap}
.mespick .lbl:hover{background:var(--surface-2)}
.mespick input[type=month]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.verif{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:var(--r2);border:1px solid var(--line);font-size:var(--fs-12);white-space:nowrap;background:var(--surface)}
.verif .vt{display:flex;flex-direction:column;line-height:1.15}
.verif .vt small{font-size:10.5px;color:var(--text-3)}
.verif.ok{border-color:var(--ok-b);background:var(--ok-s)} .verif.ok .vt b{color:var(--ok)}
.verif.run{border-color:var(--accent);background:var(--accent-s)}
.verif.err{border-color:var(--bad-b);background:var(--bad-s)} .verif.err .vt b{color:var(--bad)}
.vbar{width:90px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}
.spacer{flex:1}
.cmdk{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:var(--r2);color:var(--text-3);font-size:var(--fs-12);min-width:180px;background:var(--surface-2)}
.cmdk:hover{border-color:var(--line-strong);color:var(--text-2)}
.cmdk span{flex:1;text-align:left;white-space:nowrap}
@media (max-width:1680px){.brand span{display:none}}
@media (max-width:1360px){.cmdk{min-width:0}.cmdk span{display:none}#btnBatch .bl{display:none}}
.chip.soft{background:transparent;color:var(--text-2);border-color:var(--line-strong);font-weight:600}
.chip.soft.warn .dot{color:var(--warn)} .chip.soft.info .dot{color:var(--info)} .chip.soft.neu .dot{color:var(--text-4)}

/* ───────── layout ───────── */
#app{--insW:440px;display:grid;grid-template-columns:minmax(0,1fr) 1px var(--insW);min-height:0;position:relative}
@media (max-width:1366px){#app{--insW:384px}}
#app.ins-off{grid-template-columns:minmax(0,1fr) 0 0}
#app.ins-off #ins{display:none}
#work{display:flex;flex-direction:column;min-width:0;min-height:0;container-type:inline-size;container-name:work}
#insRz{background:var(--line);cursor:col-resize;position:relative;z-index:5}
#insRz::after{content:"";position:absolute;inset:0 -3px}
#insRz:hover,#insRz.drag{background:var(--accent)}
#ins{background:var(--surface);display:flex;flex-direction:column;min-width:0;min-height:0}
#ins{container-type:inline-size;container-name:ins}
@container ins (max-width:420px){.tabs kbd{display:none}.tabs button{padding:0 8px}}

/* ───────── resumen del mes ───────── */
#sum{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.15fr 1.85fr;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.kpi{padding:10px 16px 11px;border-right:1px solid var(--line-2);min-width:0;text-align:left;position:relative}
.kpi:last-child{border-right:0}
.kpi .kl{font-size:var(--fs-11);font-weight:600;color:var(--text-3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#work.detail #sum,#work.detail #banner{display:none}
.kpi .kv{font-size:var(--fs-20);font-weight:700;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:var(--fs-11);color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hero .kv{color:var(--accent-t)}
button.kpi{cursor:pointer;transition:background var(--t)}
button.kpi:hover{background:var(--surface-2)}
.paybar{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden;display:flex}
.paybar i{display:block;height:100%;background:var(--ok)}
.src3{display:grid;grid-template-columns:repeat(3,auto);gap:2px 14px;margin-top:4px;font-size:var(--fs-11);color:var(--text-3);justify-content:start}
.src3 b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.src3 .na{color:var(--text-4);font-weight:500}
.basebanner{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:var(--fs-12);background:var(--warn-s);color:var(--warn);border-bottom:1px solid var(--warn-b);flex:none}
.basebanner b{font-weight:700}
.basebanner .btn{margin-left:auto}

/* ───────── barra de herramientas ───────── */
.tbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;min-height:46px}
.seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:var(--r3);background:var(--surface-2);border:1px solid var(--line)}
.seg button{height:24px;padding:0 9px;border-radius:5px;font-size:var(--fs-12);font-weight:600;color:var(--text-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button .n{font-size:10.5px;color:var(--text-4);font-weight:600}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--e1)}
.seg button.on .n{color:var(--text-3)}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);min-width:150px;flex:0 1 220px;color:var(--text-3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:var(--fs-12);color:var(--text)}
.search input::placeholder{color:var(--text-4)}

/* ───────── tabla de profesionales ───────── */
.twrap{flex:1;overflow:auto;min-height:0;position:relative;background:var(--surface)}
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-13)}
.grid th{position:sticky;top:0;z-index:2;background:var(--surface-2);height:30px;padding:0 10px;font-size:var(--fs-11);font-weight:600;color:var(--text-3);text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.grid th.num{text-align:right}
.grid th.sortable{cursor:pointer}
.grid th.sortable:hover{color:var(--text)}
.grid th .sa{display:inline-block;width:8px;margin-left:3px;color:var(--accent)}
.grid td{height:var(--row);padding:0 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.grid tbody tr.r{cursor:default;transition:background 80ms}
.grid tbody tr.r:hover td{background:var(--surface-2)}
.grid tbody tr.r.sel td{background:var(--sel)}
.grid tbody tr.r.sel td:first-child{box-shadow:inset 2px 0 0 var(--sel-line)}
.grid tbody tr.r.paid td.c-tr{color:var(--text-3)}
.grid tr.g td{height:28px;background:var(--bg);font-size:var(--fs-11);font-weight:700;color:var(--text-2);border-bottom:1px solid var(--line);position:sticky;top:30px;z-index:1}
.grid tr.g .gd{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}
.grid tr.g .gm{font-weight:500;color:var(--text-3);margin-left:8px}
.grid tfoot td{position:sticky;bottom:0;background:var(--surface-2);border-top:1px solid var(--line-strong);height:34px;font-weight:700;z-index:2}
.c-st{width:28px;padding-right:0!important}
.pn{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.pn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.pn small{font-size:var(--fs-11);color:var(--text-3);overflow:hidden;text-overflow:ellipsis;max-width:240px}
.c-pct{color:var(--text-2)}
.c-ret{color:var(--text-3)}
.c-tr{font-weight:700}
.tag-fijo{font-size:10px;font-weight:700;color:var(--info);background:var(--info-s);padding:1px 5px;border-radius:4px}
.tag-fact{font-size:10px;font-weight:700;color:var(--text-3);background:var(--neu-s);padding:1px 5px;border-radius:4px;margin-left:4px}
.notel{color:var(--warn);display:inline-flex;vertical-align:-2px;margin-left:5px}
@container work (max-width:1040px){.c-ret,.c-aj{display:none}#btnGroup span{display:none}}
@container work (max-width:920px){.c-base{display:none}.seg button .n{display:none}.search kbd{display:none}
  .kpi{padding:9px 12px 10px}.kpi .kv{font-size:var(--fs-15)}.kpi .ks{font-size:10.5px}.src3{gap:1px 10px}#sum{grid-template-columns:1.1fr 1fr .9fr 1fr 1.9fr}}
@container work (max-width:640px){.c-bol,.c-conc{display:none}}
@container work (max-width:520px){.c-pct{display:none}.pn b,.pn small{max-width:170px}.grid td,.grid th{padding:0 8px}}

/* skeleton */
.sk{display:block;height:10px;border-radius:4px;background:linear-gradient(90deg,var(--line-2),var(--surface-3),var(--line-2));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:64px 24px;text-align:center;color:var(--text-2)}
.state h3{font-size:var(--fs-15);font-weight:700;color:var(--text)}
.state p{max-width:440px;font-size:var(--fs-13);color:var(--text-3)}
.state>.ico{width:28px;height:28px;color:var(--text-4);stroke-width:1.5}
.state.err>.ico{color:var(--bad)}
.state code{font-size:var(--fs-11);background:var(--surface-2);padding:2px 6px;border-radius:4px;color:var(--text-3)}

/* ───────── inspector ───────── */
.ins-h{padding:12px 14px 0;border-bottom:1px solid var(--line);flex:none}
.ins-id{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:var(--fs-12);flex:none}
.ins-id .nm{flex:1;min-width:0}
.ins-id .nm b{display:block;font-size:var(--fs-15);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-id .nm small{display:block;font-size:var(--fs-12);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;margin-top:10px}
.tabs button{height:32px;padding:0 10px;font-size:var(--fs-12);font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs kbd{height:15px;min-width:15px;font-size:9.5px}
.ins-b{flex:1;overflow:auto;min-height:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
.sec-t{font-size:var(--fs-11);font-weight:700;color:var(--text-3);display:flex;align-items:center;gap:8px;margin-bottom:8px;letter-spacing:.02em}
.sec-t .r{margin-left:auto;font-weight:600}
.paybox{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.paybox .amt{font-size:var(--fs-28);font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.paybox .lbl{font-size:var(--fs-11);color:var(--text-3);font-weight:600}
.paybox .st{margin-top:6px;font-size:var(--fs-12);color:var(--text-3)}
.payform{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px;border-radius:var(--r3);background:var(--accent-s);border:1px solid var(--line)}
.payform label{font-size:var(--fs-11);font-weight:600;color:var(--text-2)}
.inp{height:30px;border:1px solid var(--line-strong);border-radius:var(--r2);background:var(--surface);padding:0 8px;font-size:var(--fs-13);min-width:0}

.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:var(--fs-13)}

.kv span{color:var(--text-2)}

.kv .tot span,.kv .tot b{border-bottom:0;padding-top:8px;font-weight:700;color:var(--text);font-size:var(--fs-15)}
.kv .neg b{color:var(--text-2)}
.kv .sub span{padding-left:12px;font-size:var(--fs-12)}
.kv .sub b{font-size:var(--fs-12);font-weight:500}
.ajx{color:var(--text-4);margin-left:6px;vertical-align:-2px;border-radius:4px;display:inline-flex}
.ajx:hover{color:var(--bad);background:var(--bad-s)}
.ajform{display:grid;grid-template-columns:110px 110px 1fr auto;gap:6px;margin-top:8px}
.ajform select{height:30px;border:1px solid var(--line-strong);border-radius:var(--r2);background:var(--surface);padding:0 6px;font-size:var(--fs-12)}

.srcs span{padding:6px 0;border-bottom:1px solid var(--line-2)}
.srcs .s1{display:flex;align-items:center;gap:7px;color:var(--text-2);font-weight:600;padding-right:10px}
.srcs .s2{color:var(--text-3)}
.srcs .s3{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;padding-left:10px}
.srcs .s4{text-align:right;font-variant-numeric:tabular-nums;padding-left:10px;min-width:74px}
.srcs .base span{background:var(--accent-s)}
.srcs .base .s1{box-shadow:inset 2px 0 0 var(--accent);padding-left:6px}
.dlt{font-size:var(--fs-11);font-weight:600}
.dlt.z{color:var(--text-4)} .dlt.p,.dlt.n{color:var(--warn)}
.tiplist{display:flex;flex-direction:column;gap:2px}
.tip{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--r2);font-size:var(--fs-12);text-align:left;width:100%}
.tip:hover{background:var(--surface-2)}
.tip .tl{flex:1;min-width:0;color:var(--text-2)}
.tip .tn{font-weight:700;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.tip .tm{font-variant-numeric:tabular-nums;color:var(--text-3);min-width:84px;text-align:right}
.cfg{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center;font-size:var(--fs-12)}
.cfg label{color:var(--text-2);font-weight:600}
.cfg .row{display:flex;gap:6px;align-items:center}
.note{font-size:var(--fs-11);color:var(--text-3);line-height:1.45}

.inlineconfirm{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px;border-radius:var(--r3);border:1px solid var(--bad-b);background:var(--bad-s);font-size:var(--fs-12);color:var(--bad)}

/* whatsapp */

.bprog i{display:block;height:100%;background:var(--accent)}

/* ───────── vista detalle (conciliación) ───────── */
#det{display:none;flex-direction:column;min-height:0;flex:1}
#work.detail #det{display:flex}
#work.detail #listv{display:none}
#listv{display:flex;flex-direction:column;min-height:0;flex:1}
.dh{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;min-height:46px}
.dh .crumb{display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--text-3);min-width:0}
.dh .crumb b{color:var(--text);font-size:var(--fs-15);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .crumb{flex-shrink:0;max-width:40%} .dh .crumb span{white-space:nowrap}
.d3{display:grid;grid-template-columns:repeat(3,1fr) 1.2fr;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.d3 .kpi .kv{font-size:var(--fs-15)}
.d3 .kpi .kl i{width:8px;height:8px;border-radius:2px;display:inline-block}
.pats{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;flex:none}
.pat{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r3);border:1px solid var(--line);background:var(--surface-2);font-size:var(--fs-12);max-width:100%;text-align:left}

.ltable{flex:1;overflow:auto;min-height:0;background:var(--surface);position:relative}
.lhead,.lrow{display:grid;grid-template-columns:62px minmax(150px,1.3fr) 104px 104px 132px 92px minmax(170px,1.15fr) 28px;align-items:center;column-gap:0}
.lhead{position:sticky;top:0;z-index:3;height:30px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:var(--fs-11);font-weight:600;color:var(--text-3)}
.lhead>div,.lrow>div{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .num,.lrow .num{text-align:right}
.lhead .src{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.lhead .src i{width:8px;height:8px;border-radius:2px}
.lrow{height:32px;border-bottom:1px solid var(--line-2);font-size:var(--fs-12);position:absolute;left:0;right:0;cursor:default}
.lrow:hover{background:var(--surface-2)}
.lrow.sel{background:var(--sel)!important;box-shadow:inset 2px 0 0 var(--sel-line)}
.lrow.t-bad{box-shadow:inset 3px 0 0 var(--bad)}

.lrow.t-info{box-shadow:inset 3px 0 0 var(--info)}

.lrow .hl-warn{background:var(--warn-s);color:var(--warn);font-weight:600}
.lrow .hl-info{background:var(--info-s);color:var(--info);font-weight:600}
.lrow .na{color:var(--text-4)}
.lrow .pac{font-weight:500}
.lrow .modsub{font-size:10px;color:var(--text-4);margin-left:4px}
.lrow .dif{font-weight:700}
.lrow .afp{display:flex;justify-content:center;color:var(--bad)}
.lrow .afp.no{color:var(--text-4)}
.lsep{position:absolute;left:0;right:0;height:26px;display:flex;align-items:center;padding:0 10px;font-size:var(--fs-11);font-weight:700;color:var(--text-3);background:var(--bg);border-bottom:1px solid var(--line)}
.lfoot{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:9px 14px;font-size:var(--fs-12);display:flex;gap:12px;align-items:flex-start;min-height:54px}
.lfoot .lx{flex:1;color:var(--text-2);line-height:1.5}
.lfoot .lx b{color:var(--text)}
.lfoot .lpos{color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}


/* filas-grupo del detalle (patrones conocidos / calzan) */
.lgrp{position:absolute;left:0;right:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;border-bottom:1px solid var(--line-2);font-size:var(--fs-12);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.lgrp:hover{background:var(--surface-2)}
.lgrp.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--sel-line)}
.lgrp .car{color:var(--text-3);transition:transform var(--t) var(--ease);display:inline-flex}
.lgrp.open .car{transform:rotate(90deg)}
.lgrp .gx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.lgrp .gx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgrp .gx small{color:var(--text-3);font-size:var(--fs-11);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgrp .gn{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.lgrp .gm{font-variant-numeric:tabular-nums;color:var(--text-2);min-width:100px;text-align:right}
.lrow.child{background:var(--bg)}
.lrow.child>div:nth-child(2){padding-left:22px}
.lrow.child>div:first-child{color:var(--text-4)}
/* % con antigüedad */
.pctage{font-size:10px;color:var(--text-4);margin-left:5px;font-weight:500}
.pctage.old{color:var(--warn)}
.verif.ok .ico{color:var(--ok)}

/* ───────── ventana flotante (simulador) ───────── */
.win{position:fixed;z-index:60;display:none;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r4);box-shadow:var(--e3);min-width:720px;min-height:360px;overflow:hidden;resize:both}
.win.on{display:flex;animation:winin 160ms var(--ease)}
@keyframes winin{from{opacity:0;transform:translateY(6px) scale(.99)}}
.win.min{height:44px!important;min-height:44px;resize:none}
.win.min .win-b{display:none}
.win-h{height:44px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-bottom:1px solid var(--line);cursor:move;user-select:none;flex:none;background:var(--surface)}
.win-h b{font-size:var(--fs-13);font-weight:700}
.win-h .wsub{font-size:var(--fs-11);color:var(--text-3)}
.win-b{flex:1;min-height:0;display:flex;flex-direction:column}
.scn{display:flex;align-items:center;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--surface-2);flex:none}
.scn button.t{height:30px;padding:0 12px;border-radius:6px 6px 0 0;font-size:var(--fs-12);font-weight:600;color:var(--text-3);border:1px solid transparent;border-bottom:0;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.scn button.t.on{background:var(--surface);color:var(--text);border-color:var(--line)}
.scn button.t .x{opacity:.5;display:inline-flex}
.scn button.t .x:hover{opacity:1;color:var(--bad)}
.simtop{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;flex:none}
.simtop .disp label{display:block;font-size:var(--fs-11);font-weight:600;color:var(--text-3);margin-bottom:4px}
.simtop .disp .inp{width:180px;height:36px;font-size:var(--fs-15);font-weight:700}
.alc{min-width:0}
.alc-l{display:flex;align-items:baseline;gap:10px;font-size:var(--fs-12);color:var(--text-2);margin-bottom:6px;flex-wrap:wrap}
.alc-l .big{font-size:var(--fs-15);font-weight:700}
.alc-l .big.ok{color:var(--ok)} .alc-l .big.bad{color:var(--bad)}
.alcbar{position:relative;height:14px;border-radius:4px;background:var(--surface-3);display:flex;overflow:hidden}
.alcbar i{display:block;height:100%;border-right:1px solid var(--surface);flex:none}
.alcbar i.c{background:var(--ok)} .alcbar i.p{background:var(--warn)} .alcbar i.u{background:var(--bad-s);box-shadow:inset 0 0 0 1px var(--bad-b)}
.alcbar .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
.alc-s{display:flex;justify-content:space-between;font-size:var(--fs-11);color:var(--text-3);margin-top:4px}
.simgrid{flex:1;overflow:auto;min-height:0}
.sg-h,.sg-r{display:grid;grid-template-columns:26px 28px minmax(170px,1.4fr) 100px 70px 104px 100px 108px 108px 104px 100px;align-items:center}
.sg-h>div:nth-child(-n+2),.sg-r>div:nth-child(-n+2){padding:0;display:flex;justify-content:center;overflow:visible}
.sg-h{position:sticky;top:0;z-index:2;height:30px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:var(--fs-11);font-weight:600;color:var(--text-3)}
.sg-h>div,.sg-r>div{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-r{min-height:36px;border-bottom:1px solid var(--line-2);font-size:var(--fs-12);background:var(--surface)}
.sg-r:hover{background:var(--surface-2)}
.sg-r.off{opacity:.45}
.sg-r.dragging{opacity:.4}
.sg-r.dropb{box-shadow:inset 0 2px 0 var(--accent)} .sg-r.dropa{box-shadow:inset 0 -2px 0 var(--accent)}
.sg-r .hdl{cursor:grab;color:var(--text-4);display:flex;justify-content:center}
.sg-r .hdl:hover{color:var(--text-2)}
.sg-r .inp{height:26px;font-size:var(--fs-12);width:100%}
.sg-r .chg{color:var(--accent-t);font-weight:700}
.cov{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-11);font-weight:700}
.cov.c{color:var(--ok)} .cov.p{color:var(--warn)} .cov.u{color:var(--bad)}
.sg-aj{grid-column:3/-1;padding:4px 8px 8px;display:flex;flex-direction:column;gap:4px}
.sg-aj .ajl{display:grid;grid-template-columns:120px 120px 1fr 26px;gap:6px}
.sg-aj select{height:26px;border:1px solid var(--line-strong);border-radius:var(--r2);background:var(--surface);font-size:var(--fs-12);padding:0 4px}
.simfoot{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);flex:none;align-items:start}
.cmp{border-collapse:collapse;font-size:var(--fs-12)}
.cmp th,.cmp td{padding:3px 12px 3px 0;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmp th{font-size:var(--fs-11);color:var(--text-3);font-weight:600}
.cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--text-2)}
.cmp tr.cur td{color:var(--accent-t);font-weight:700}
.cmp td{padding:2px 16px 2px 0}
.cmp tr td.better{color:var(--ok)} .cmp tr td.worse{color:var(--bad)}


/* ───────── paleta, ayuda, toast ───────── */
.ovl{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(10,20,30,.28)}
.ovl.on{display:flex}
.pal{width:580px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r4);box-shadow:var(--e3);overflow:hidden;animation:winin 140ms var(--ease)}
.pal-i{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--line)}
.pal-i input{flex:1;border:0;background:transparent;outline:none;font-size:var(--fs-15)}
.pal-i input:focus-visible,.search input:focus-visible{box-shadow:none}
.pal-l{max-height:360px;overflow:auto;padding:6px}
.pal-g{font-size:var(--fs-11);font-weight:700;color:var(--text-3);padding:8px 10px 4px}
.pal-it{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r2);font-size:var(--fs-13);width:100%;text-align:left}
.pal-it.on{background:var(--sel)}
.pal-it .pk{margin-left:auto;display:flex;gap:3px;color:var(--text-3);font-size:var(--fs-11)}
.help{width:720px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r4);box-shadow:var(--e3);padding:18px 20px;animation:winin 140ms var(--ease)}
.help h2{font-size:var(--fs-15);margin-bottom:12px;display:flex;align-items:center}
.help h2 .btn{margin-left:auto}
.help .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.help .hg{font-size:var(--fs-11);font-weight:700;color:var(--text-3);margin:10px 0 4px;grid-column:span 1}
.help .hk{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line-2);font-size:var(--fs-12)}
.help .hk span:last-child{display:flex;gap:3px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;border-radius:var(--r3);background:#0E2A43;color:#E8F1F7;font-size:var(--fs-12);box-shadow:var(--e3);animation:winin 160ms var(--ease);max-width:560px}
html[data-theme="dark"] .toast{background:#E2ECF3;color:#0E2A43}
.toast.err{background:var(--bad);color:#fff}
.toast button{font-weight:700;color:#8CD8E6;padding:3px 8px;border-radius:4px}
html[data-theme="dark"] .toast button{color:var(--blue)}
.toast button:hover{background:rgba(255,255,255,.12)}

/* ───────── impresión: liquidación limpia ───────── */
#print{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm}
  html,body{height:auto;overflow:visible;background:#fff;color:#000;display:block}
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:11pt;color:#111}
  #print h1{font-size:16pt;margin-bottom:2pt}
  #print .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5pt solid #0F3F68;padding-bottom:8pt;margin-bottom:12pt}
  #print .ph small{color:#555;font-size:9pt}
  #print table{width:100%;border-collapse:collapse;margin-bottom:12pt}
  #print td,#print th{padding:4pt 6pt;border-bottom:.5pt solid #ccc;text-align:left;font-size:10pt}
  #print th{font-size:8.5pt;color:#555;text-transform:uppercase;letter-spacing:.04em}
  #print .r{text-align:right;font-variant-numeric:tabular-nums}
  #print .tot td{font-weight:700;border-top:1pt solid #000;border-bottom:0;font-size:11pt}
  #print .pn{font-size:8.5pt;color:#555;margin-top:14pt}
  #print h2{font-size:11pt;margin:14pt 0 6pt}
  #print tr{break-inside:avoid}
}

/* ───────── móvil: degradación digna ───────── */
@media (max-width:760px){
  body{overflow:auto;display:block}
  #top{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px;position:sticky;top:0}
  .brand span,.cmdk,#btnHelp,#btnTheme .lbl,.tsep{display:none}
  #app{display:block}
  #insRz{display:none}
  #work{height:auto}
  #sum{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid var(--line-2)}
  .kpi:last-child{grid-column:1/-1}
  .tbar{flex-wrap:wrap}
  .tbar .seg{overflow-x:auto;max-width:100%;scrollbar-width:none}
  #work{overflow:hidden}
  .search{min-width:0;flex:1}
  .twrap{overflow:visible}
  #ins{position:fixed;left:0;right:0;bottom:0;height:72vh;border-top:1px solid var(--line-strong);border-radius:14px 14px 0 0;box-shadow:var(--e3);transform:translateY(105%);transition:transform 200ms var(--ease);z-index:50}
  #app.sheet #ins{transform:none}
  #app.ins-off #ins{display:flex}
  .win{left:0!important;top:0!important;width:100vw!important;height:100vh!important;min-width:0;border-radius:0;resize:none}
  .lhead,.lrow{grid-template-columns:52px minmax(110px,1fr) 88px 88px 0 72px 0 24px}
  .simtop{grid-template-columns:1fr}
}

const FILTROS=[['todos','Todos'],['porpagar','Por pagar'],['pagados','Pagados'],['dif','Afecta el pago'],['obs','Observaciones'],['sintel','Sin teléfono']];
function passF(p,f){f=f||S.filter;if(f==='porpagar')return !p.pagado;if(f==='pagados')return !!p.pagado;if(f==='dif')return conc(p).nAf>0;if(f==='obs')return conc(p).obs>0;if(f==='sintel')return !telOk(p.telefono);return true;}
function visible(){const q=norm(S.q);let ps=P().filter(p=>passF(p)&&(!q||norm(p.nombre+' '+p.especialidad).includes(q)));
  const k=S.sort.k,d=S.sort.dir;
  const val={nombre:p=>norm(p.nombre),base:p=>L(p).base||0,pct:p=>p.fijo?-1:(p.pct||0),bruto:p=>L(p).bruto||0,ret:p=>L(p).retencion||0,aj:p=>L(p).total_ajustes||0,tr:p=>L(p).a_transferir||0,conc:p=>conc(p).rank*1e9-conc(p).mAf,pago:p=>(p.pagado?1:0)};
  if(k&&val[k])ps.sort((a,b)=>{const x=val[k](a),y=val[k](b);return (x<y?-1:x>y?1:0)*d;});
  else ps.sort((a,b)=>(L(b).a_transferir||0)-(L(a).a_transferir||0));

function buildPrint(){const el=$('#print');const T=S.data&&S.data.totales||{};const now=new Date().toLocaleString('es-CL');
  if(PRINT_MODE==='mes'||!byId(S.sel)){const ps=P().slice().sort((a,b)=>norm(a.nombre)<norm(b.nombre)?-1:1);
    el.innerHTML=`<div class="ph"><div><h1>Remuneraciones · ${mesLabel(S.mes)}</h1><small>Centro Médico Carampangue · base ${isVerif()?'Medilink en vivo':'sistema (sin verificar con Medilink)'}</small></div><small>Emitido ${now}</small></div>
    <table><thead><tr><th>Profesional</th><th class="r">Base</th><th class="r">%</th><th class="r">Honorario</th><th class="r">Retención</th><th class="r">Ajustes</th><th class="r">A transferir</th><th>Estado</th></tr></thead><tbody>
    ${ps.map(p=>{const l=L(p);return `<tr><td>${esc(p.nombre)}</td><td class="r">${clp(l.base)}</td><td class="r">${p.fijo?'Fijo':pctF(p.pct)}</td><td class="r">${clp(l.bruto)}</td><td class="r">${clp(-(l.retencion||0))}</td><td class="r">${l.total_ajustes?sgn(l.total_ajustes):'—'}</td><td class="r">${clp(l.a_transferir)}</td><td>${p.pagado?'Pagado':'Por pagar'}</td></tr>`;}).join('')}
    <tr class="tot"><td>Total</td><td class="r">${clp(T.base_pago)}</td><td></td><td class="r">${clp(T.bruto)}</td><td></td><td></td><td class="r">${clp((T.pagado||0)+(T.por_pagar||0))}</td><td></td></tr></tbody></table>`;return;}
  const p=byId(S.sel),l=L(p),d=S.det[p.id+'|'+S.mes];const ls=d&&d.lineas?d.lineas.filter(x=>x.cuenta_para_pago!==false).sort((a,b)=>a.fecha<b.fecha?-1:1):null;
  el.innerHTML=`<div class="ph"><div><h1>Liquidación de honorarios</h1><small>Centro Médico Carampangue · ${mesLabel(S.mes)}</small></div><small>Emitido ${now}</small></div>
  <table><tbody><tr><td style="width:40%">Profesional</td><td><b>${esc(p.nombre)}</b></td></tr><tr><td>Especialidad</td><td>${esc(p.especialidad||'')}</td></tr><tr><td>Base de pago</td><td>${l.base_fuente==='reporte_medilink'?'Reporte de Medilink del profesional':l.base_fuente==='medilink'?'Caja Medilink verificada':'Caja según sistema'}</td></tr></tbody></table>
  <table><tbody><tr><td>Venta del mes (base)</td><td class="r">${clp(l.base)}</td></tr><tr><td>Honorario ${p.fijo?'(monto fijo)':'('+pctF(p.pct)+')'}</td><td class="r">${clp(l.bruto_propio!=null?l.bruto_propio:l.bruto)}</td></tr>${jefRows(l).map(j=>`<tr><td>${esc(j.txt)}</td><td class="r">${clp(j.monto)}</td></tr>`).join('')}
  <tr><td>${p.sin_retencion?'Factura (sin retención)':'Retención boleta de honorarios 15,25%'}</td><td class="r">${clp(-(l.retencion||0))}</td></tr>
  ${(l.ajustes||[]).map(a=>`<tr><td>${esc(a.motivo||'Ajuste')}</td><td class="r">${sgn(a.monto)}</td></tr>`).join('')}
  <tr class="tot"><td>Total a transferir</td><td class="r">${clp(l.a_transferir)}</td></tr></tbody></table>
  ${p.pagado?`<p>Pagado ${clp(p.monto_pagado!=null?p.monto_pagado:l.a_transferir)} el ${fFecha(p.pagado_at)}.</p>`:''}
  ${ls?`<h2>Atenciones consideradas (${ls.length})</h2><table><thead><tr><th>Fecha</th><th>Paciente</th><th class="r">Monto</th></tr></thead><tbody>${ls.map(x=>`<tr><td>${fFecha(x.fecha)}</td><td>${esc(x.paciente)}</td><td class="r">${clp(x.monto_pago!=null?x.monto_pago:(x.medilink||x.sistema||{}).monto)}</td></tr>`).join('')}</tbody></table>`:''}
  <p class="pn">${p.sin_retencion?'Emitir factura':'Emitir boleta de honorarios'} por ${clp(l.bruto)}. Documento interno de liquidación.</p>`;}
async function printLiq(){const p=byId(S.sel);if(!p){printMes();return;}PRINT_MODE='liq';await loadDet(p.id);buildPrint();window.print();}
function printMes(){PRINT_MODE='mes';buildPrint();window.print();PRINT_MODE='liq';}
addEventListener('beforeprint',buildPrint);
function exportCsv(){if(!P().length)return;const rows=[['Profesional','Especialidad','Base','Fuente base','%','Fijo','Honorario','Retencion','Ajustes','A transferir','Pagado','Monto pagado','Conciliacion','Telefono']];
  visibleIds().map(byId).forEach(p=>{const l=L(p);rows.push([p.nombre,p.especialidad,l.base,l.base_fuente,p.pct??'',p.fijo?'si':'',l.bruto,l.retencion,l.total_ajustes||0,l.a_transferir,p.pagado?'si':'no',p.monto_pagado??'',conc(p).label,p.telefono||'']);});
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='remuneraciones_'+S.mes+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}

/* ═══════════════ vista: tema, inspector, filtros ═══════════════ */
function applyTheme(t){document.documentElement.dataset.theme=t;$('#btnTheme').innerHTML=ico(t==='dark'?'sun':'moon');}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';lsSet('alma_theme',t);applyTheme(t);}
function toggleIns(){const a=$('#app');a.classList.toggle('ins-off');lsSet('remun_ins_off',a.classList.contains('ins-off'));}
function setFilter(f){S.filter=f;if(S.view==='detail')closeDetail();renderList();const ids=visibleIds();if(!ids.includes(S.sel))select(ids[0]);}
function payKey(){const p=byId(S.sel);if(!p)return;if($('#app').classList.contains('ins-off'))toggleIns();S.insTab='liq';if(p.pagado){S.unpay=true;}else S.payEdit=true;renderIns();}
function renderAll(){renderTop();renderSum();renderList();renderIns();if(S.view==='detail')renderDetail();if(SIM.open&&S.data)simGrid();}

/* ═══════════════ eventos ═══════════════ */
document.addEventListener('click',async e=>{
  const pi=e.target.closest('[data-pi]');if(pi){palRun(+pi.dataset.pi);return;}
  if(e.target.id==='palOvl'){closePal();return;} if(e.target.id==='helpOvl'){closeHelp();return;} if(e.target.id==='repOvl'){closeRep();return;}
  const ri=e.target.closest('#lbody [data-ri]');if(ri){const i=+ri.dataset.ri,k=DSEL.indexOf(i);if(k>=0){S.dd.sel=k;if(DROWS[i].k==='grp')detToggle();else drawLines(false);}return;}
  const b=e.target.closest('[data-act]');
  if(!b){const tr=e.target.closest('#twrap tr.r');if(tr)select(+tr.dataset.id,{sheet:matchMedia('(max-width:760px)').matches});
    const th=e.target.closest('th[data-sort]');if(th){const k=th.dataset.sort;S.sort=S.sort.k===k?(S.sort.dir===-1?{k,dir:1}:{k:null,dir:-1}):{k,dir:-1};lsSet('remun_sort',S.sort);renderList();}return;}
  const act=b.dataset.act,p=byId(S.sel);
  switch(act){
    case 'verificar':verificar();break;
    case 'reload':loadMes();break;
    case 'mesprev':setMes(mesShift(S.mes,-1));break;
    case 'filtro':setFilter(b.dataset.f);break;
    case 'clearf':S.q='';$('#q').value='';setFilter('todos');break;
    case 'detalle':{e.stopPropagation();const id=+b.dataset.id;openDetail(id);break;}
    case 'dettipo':openDetail(S.sel,b.dataset.t);break;
    case 'back':closeDetail();break;
    case 'detreload':if(p)loadDet(p.id,true);break;
    case 'dfilt':S.dd.filter=b.dataset.f;S.dd.sel=0;renderDetail();break;
    case 'pagar':{e.stopPropagation();select(+b.dataset.id);payKey();break;}
    case 'prev':S.view==='detail'?stepProf(-1):moveSel(-1);break;
    case 'next':S.view==='detail'?stepProf(1):moveSel(1);break;
    case 'tab':S.insTab=b.dataset.t;renderIns();break;
    case 'payedit':S.insTab='liq';S.payEdit=true;S.unpay=false;renderIns();break;
    case 'unpay':S.unpay=true;renderIns();break;
    case 'unpayok':if(p)setPagado(p,false,null);break;
    case 'cancel':S.payEdit=false;S.unpay=false;S.ajEdit=false;S.pctConfirm=false;renderIns();break;
    case 'ajedit':S.ajEdit=true;renderIns();break;
    case 'ajdel':{const a=(L(p).ajustes||[]).find(x=>String(x.id)===b.dataset.aj);if(a)delAjuste(p,a);break;}
    case 'pctsave':{const v=parseFloat(String($('#cfgPct').value).replace(',','.'));if(isNaN(v)||v<0||v>100){toast('Ingrese un % entre 0 y 100.',{err:1});break;}if(v===p.pct){toast('El % no cambió.');break;}S.pctConfirm=v;renderIns();break;}
    case 'pctok':{const v=S.pctConfirm;S.pctConfirm=false;if(p)await saveConfig(p,{pct:v},`% de ${p.nombre} actualizado a ${pctF(v)}.`);break;}
    case 'telsave':{const t=telNorm($('#cfgTel').value);if(t&&!telOk(t)){toast('El teléfono no parece válido (56 9 XXXX XXXX).',{err:1});break;}await saveConfig(p,{telefono:t},'Teléfono guardado.');break;}
    case 'watelsave':{const t=telNorm($('#waTel').value);if(!telOk(t)){toast('El teléfono no parece válido (56 9 XXXX XXXX).',{err:1});break;}const w=S.wa[waKey(p)];const keep=w&&w.texto,ed=w&&w.edited;if(await saveConfig(p,{telefono:t},'Teléfono guardado.')&&keep&&ed){S.wa[waKey(p)]={texto:keep,orig:keep,telefono:t,tel:null,edited:true};renderIns();}break;}
    case 'wareload':delete S.wa[waKey(p)];renderIns();break;
    case 'warestore':{const w=S.wa[waKey(p)];w.texto=w.orig;w.edited=false;renderIns();break;}
    case 'wasend':if(p&&waSend(p))renderIns();break;
    case 'repopen':openRep();break;
    case 'repclose':closeRep();break;
    case 'repprev':repPost(false);break;
    case 'repsave':repPost(true);break;
    case 'repdel':repDel();break;
    case 'rconf':repartoConf(+b.dataset.i);break;
    case 'rdel':repartoDel(+b.dataset.pid);break;
    case 'ldec':{const k2=p&&(p.id+'|'+S.mes),d2=k2&&S.det[k2],r2=d2&&DROWS[DSEL[S.dd.sel]];if(!r2||!r2.l)break;const v2=b.dataset.v===''?null:b.dataset.v==='1';
      api('linea-decision',{method:'POST',body:{prof:p.id,mes:S.mes,clave_linea:r2.l.clave_linea,incluir:v2}}).then(async()=>{toast(v2==null?'Línea vuelve a la regla por defecto.':v2?'Línea incluida en el pago.':'Línea excluida del pago.');delete S.wa[waKey(p)];await loadDet(p.id,true);await loadMes({silent:true});renderDetail();}).catch(e=>toast(errMsg(e),{err:1}));break;}
    case 'wacopy':if(p)waCopy(p);break;
    case 'bsend':if(p&&waSend(p))batchNext(true);break;
    case 'bskip':batchNext(false);break;
    case 'bend':toast(`Lote detenido: ${S.batch.sent} enviados.`);S.batch=null;renderIns();break;
    case 'print':printLiq();break;
    case 'closesheet':$('#app').classList.remove('sheet');break;
    case 'helpclose':closeHelp();break;
    /* simulador */
    case 'simclose':simClose();break;
    case 'simmin':$('#sim').classList.toggle('min');break;
    case 'simmax':{const w=$('#sim');if(w.classList.toggle('max')){w.dataset.prev=JSON.stringify({l:w.style.left,t:w.style.top,w:w.style.width,h:w.style.height});Object.assign(w.style,{left:'8px',top:'56px',width:(innerWidth-16)+'px',height:(innerHeight-64)+'px'});}else{const o=JSON.parse(w.dataset.prev||'{}');Object.assign(w.style,{left:o.l,top:o.t,width:o.w,height:o.h});}break;}
    case 'scn':if(e.target.closest('[data-act="scndel"]'))break;SIM.st.cur=+b.dataset.i;simRender();break;
    case 'scndel':{e.stopPropagation();const i=+b.dataset.i;if(!confirm('¿Eliminar el escenario «'+SIM.st.scn[i].nombre+'»?'))break;SIM.st.scn.splice(i,1);SIM.st.cur=Math.max(0,Math.min(SIM.st.cur,SIM.st.scn.length-1));simRender();break;}
    case 'scnadd':{const n=SIM.st.scn.length;if(n>=5){toast('Máximo 5 escenarios.');break;}const c=JSON.parse(JSON.stringify(SIM.sc));c.nombre='Escenario '+String.fromCharCode(65+n);c.confirm=null;SIM.st.scn.push(c);SIM.st.cur=n;simRender();break;}
    case 'simreset':{const sc=SIM.sc;sc.ov={};sc.extra=[];sc.ord=[];sc.open={};sc.confirm=null;simRender();break;}
    case 'simextra':{const id=Date.now()%1e7;SIM.sc.extra.push({id,nombre:'',monto:0});simGrid();setTimeout(()=>{const n=$(`#simGrid .sg-r[data-k="x:${id}"] [data-sim="xname"]`);if(n)n.focus();},0);break;}
    case 'simxdel':{const k=b.closest('.sg-r').dataset.k;SIM.sc.extra=SIM.sc.extra.filter(x=>'x:'+x.id!==k);simGrid();break;}
    case 'simaj':{const k=b.closest('.sg-r').dataset.k;SIM.sc.open[k]=!SIM.sc.open[k];simGrid();break;}
    case 'simajadd':{const k=b.closest('.sg-r').dataset.k,o=SIM.sc.ov[k]=SIM.sc.ov[k]||{};(o.aj=o.aj||[]).push({t:'bono',m:0,mo:''});simGrid();const n=$$(`#simGrid .sg-r[data-k="${k}"] [data-sim="ajm"]`).pop();if(n)n.focus();break;}
    case 'simajdel':{const k=b.closest('.sg-r').dataset.k;SIM.sc.ov[k].aj.splice(+b.dataset.j,1);simGrid();break;}
    case 'simapl':SIM.sc.confirm=b.closest('.sg-r').dataset.k;simLive();break;
    case 'simapl2':{const k=b.closest('.sg-r').dataset.k,pp=byId(+k),v=SIM.sc.ov[k].pct;if(await saveConfig(pp,{pct:v},`% definitivo de ${pp.nombre}: ${pctF(v)}.`)){SIM.st.scn.forEach(s=>{if(s.ov[k]&&s.ov[k].pct===v)s.ov[k].pct=null;});SIM.sc.confirm=null;simGrid();}break;}
  }
});
document.addEventListener('dblclick',e=>{const tr=e.target.closest('#twrap tr.r');if(tr&&!e.target.closest('[data-act]'))openDetail(+tr.dataset.id);});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const p=byId(S.sel);if(!p)return;
  if(f.dataset.form==='pay'){const v=parseMonto($('#payMonto').value);if(isNaN(v)||v<0){toast('Ingrese el monto transferido.',{err:1});return;}setPagado(p,true,v);}
  if(f.dataset.form==='aj'){const t=$('#ajTipo').value,m=parseMonto($('#ajMonto').value);let mo=$('#ajMotivo').value.trim();if(isNaN(m)||m<=0){toast('Ingrese un monto mayor a cero.',{err:1});return;}
    const lbl={bono:'Bono',descuento:'Descuento',anticipo:'Anticipo'}[t];mo=mo?(norm(mo).startsWith(norm(lbl))?mo:lbl+': '+mo):lbl;addAjuste(p,t==='bono'?m:-m,mo);}});
document.addEventListener('focusout',e=>{if(e.target.id==='payMonto'||e.target.id==='ajMonto'){const v=parseMonto(e.target.value);if(!isNaN(v))e.target.value=fmtN.format(v);}});
function stepProf(d){const ids=visibleIds(),i=ids.indexOf(S.sel)+d;if(i>=0&&i<ids.length)select(ids[i]);}

/* teclado */
document.addEventListener('keydown',e=>{
  const tg=e.target,typing=tg.matches&&tg.matches('input,textarea,select,[contenteditable="true"]'),mod=e.metaKey||e.ctrlKey,k=e.key;
  if(mod&&k.toLowerCase()==='k'){e.preventDefault();$('#palOvl').classList.contains('on')?closePal():openPal();return;}
  if($('#palOvl').classList.contains('on')){if(k==='Escape'){e.preventDefault();closePal();}else if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();PAL.sel=Math.max(0,Math.min(PAL.items.length-1,PAL.sel+(k==='ArrowDown'?1:-1)));palRender();}else if(k==='Enter'){e.preventDefault();palRun(PAL.sel);}return;}
  if($('#helpOvl').classList.contains('on')){if(k==='Escape'||k==='?'){e.preventDefault();closeHelp();}return;}
  if($('#repOvl').classList.contains('on')){if(k==='Escape'){e.preventDefault();closeRep();}return;}
  if(mod&&k==='Enter'){const p=byId(S.sel);if(p&&S.batch){e.preventDefault();if(waSend(p))batchNext(true);return;}if(p&&S.insTab==='wa'){e.preventDefault();if(waSend(p))renderIns();return;}}
  if(mod&&k==='ArrowRight'&&S.batch&&!typing){e.preventDefault();batchNext(false);return;}
  if(mod&&k.toLowerCase()==='z'&&!e.shiftKey&&!typing){e.preventDefault();undo();return;}
  if(k==='Escape'){
    if(typing){if(tg.closest('[data-form]')||tg.id==='cfgPct'){S.payEdit=false;S.ajEdit=false;S.pctConfirm=false;renderIns();}else tg.blur();if(tg.id==='q'&&!tg.value)tg.blur();return;}
    if(S.payEdit||S.unpay||S.ajEdit||S.pctConfirm){S.payEdit=S.unpay=S.ajEdit=false;S.pctConfirm=false;renderIns();return;}
    if(SIM.open&&$('#sim').contains(document.activeElement)){simClose();return;}
    if(S.view==='detail'){closeDetail();return;}
    if($('#app').classList.contains('sheet')){$('#app').classList.remove('sheet');return;}
    if(S.batch){S.batch=null;renderIns();toast('Lote detenido.');return;}
    if(SIM.open){simClose();return;}
    return;}
  if(typing||mod||e.altKey)return;
  const inSim=SIM.open&&$('#sim').contains(document.activeElement);
  if(k==='Enter'){if(S.unpay){e.preventDefault();const p=byId(S.sel);if(p)setPagado(p,false,null);return;}if(S.pctConfirm){e.preventDefault();$('[data-act="pctok"]').click();return;}
    if(tg.matches&&tg.matches('button,a,[data-act]'))return;
    if(S.view==='detail'){e.preventDefault();detToggle();}else if(S.sel!=null&&!inSim){e.preventDefault();openDetail();}return;}
  if(inSim&&(k==='ArrowUp'||k==='ArrowDown'))return;
  switch(k){
    case 'j':case 'ArrowDown':e.preventDefault();S.view==='detail'?detMove(1):moveSel(1);break;
    case 'k':case 'ArrowUp':e.preventDefault();S.view==='detail'?detMove(-1):moveSel(-1);break;
    case '[':stepProf(-1);break; case ']':stepProf(1);break;
    case 's':e.preventDefault();SIM.open?simClose():simOpen();break;
    case 'w':e.preventDefault();if(byId(S.sel)){if($('#app').classList.contains('ins-off'))toggleIns();S.insTab='wa';renderIns();}break;
    case 'W':e.preventDefault();batchStart();break;
    case 'p':e.preventDefault();payKey();break;
    case 'a':e.preventDefault();if(byId(S.sel)){S.insTab='liq';S.ajEdit=true;renderIns();}break;
    case 'v':e.preventDefault();if(S.data)verificar();break;
    case 'g':S.group=!S.group;lsSet('remun_group',S.group);renderList();break;
    case 'm':e.preventDefault();try{$('#mesIn').showPicker();}catch(_){$('#mesIn').focus();}break;
    case '/':e.preventDefault();(S.view==='detail'?$('#dq'):$('#q')).focus();break;
    case '\\':toggleIns();break;
    case '?':e.preventDefault();openHelp();break;
    case 'f':if(S.view==='detail'){const ch=$$('#det [data-act="dfilt"]');const i=ch.findIndex(c=>c.classList.contains('on'));const n=ch[(i+1)%ch.length];if(n){S.dd.filter=n.dataset.f;S.dd.sel=0;renderDetail();}}break;
    case '1':case '2':case '3':case '4':case '5':case '6':if(S.view==='list')setFilter(FILTROS[+k-1][0]);break;
  }
});
$('#palIn').addEventListener('input',()=>{PAL.sel=0;palRender();});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderList();const ids=visibleIds();if(ids.length&&!ids.includes(S.sel))select(ids[0]);});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();e.target.blur();}});
$('#mesIn').addEventListener('change',e=>{if(e.target.value)setMes(e.target.value);});
$('#mesPrev').onclick=()=>setMes(mesShift(S.mes,-1));$('#mesNext').onclick=()=>setMes(mesShift(S.mes,1));
$('#btnCmd').onclick=openPal;$('#btnSim').onclick=()=>SIM.open?simClose():simOpen();$('#btnBatch').onclick=batchStart;$('#btnIns').onclick=toggleIns;$('#btnTheme').onclick=toggleTheme;$('#btnHelp').onclick=openHelp;
$('#btnGroup').onclick=()=>{S.group=!S.group;lsSet('remun_group',S.group);renderList();};$('#btnCsv').onclick=exportCsv;
/* inspector redimensionable */
(function(){const rz=$('#insRz'),app=$('#app');const w0=lsGet('remun_insW',null);if(w0)app.style.setProperty('--insW',w0+'px');
  rz.addEventListener('pointerdown',e=>{e.preventDefault();rz.classList.add('drag');const mv=ev=>{const w=Math.max(340,Math.min(760,innerWidth-ev.clientX));app.style.setProperty('--insW',w+'px');};
    const up=ev=>{rz.classList.remove('drag');removeEventListener('pointermove',mv);removeEventListener('pointerup',up);lsSet('remun_insW',parseInt(getComputedStyle(app).getPropertyValue('--insW')));};addEventListener('pointermove',mv);addEventListener('pointerup',up);});
  rz.addEventListener('dblclick',()=>{app.style.removeProperty('--insW');try{localStorage.removeItem('remun_insW');}catch(_){}});
  if(lsGet('remun_ins_off',false))app.classList.add('ins-off');})();
addEventListener('resize',()=>{if(S.view==='detail')drawLines(false);});

/* ═══════════════ inicio ═══════════════ */
applyTheme(lsGet('alma_theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
S.sent=lsGet('remun_sent_'+S.mes,{});
wireSim();renderAll();loadMes();
</script>
